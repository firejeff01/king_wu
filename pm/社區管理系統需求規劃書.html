<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>社區管理系統需求</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1f2933; --muted:#5f6b7a; --border:#e1e5ea;
  --accent:#1f6f5c; --accent-soft:#e3f1ec; --code:#f0f2f5;
  --p0:#b42318; --p0-bg:#fde8e7; --p1:#9a5b00; --p1-bg:#fdf1dc; --p2:#3b5b8a; --p2-bg:#e6edf7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171b; --panel:#1c2026; --text:#e4e7eb; --muted:#9aa5b1; --border:#2e343c;
    --accent:#5cc4a6; --accent-soft:#1d3530; --code:#252a31;
    --p0:#ff8a80; --p0-bg:#3a1f1e; --p1:#ffc266; --p1-bg:#3a2e17; --p2:#9ab8e6; --p2-bg:#1f2a3a;
  }
}
:root[data-theme="dark"]{
  --bg:#14171b; --panel:#1c2026; --text:#e4e7eb; --muted:#9aa5b1; --border:#2e343c;
  --accent:#5cc4a6; --accent-soft:#1d3530; --code:#252a31;
  --p0:#ff8a80; --p0-bg:#3a1f1e; --p1:#ffc266; --p1-bg:#3a2e17; --p2:#9ab8e6; --p2-bg:#1f2a3a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7;font-size:15px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px}
nav .brand{font-weight:700;font-size:16px;margin:0 6px 4px}
nav .sub{color:var(--muted);font-size:12px;margin:0 6px 14px}
nav a{display:block;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px;font-size:13.5px}
nav a.h3{padding-left:22px;font-size:12.5px}
nav a:hover,nav a.active{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;gap:6px;margin:0 6px 14px}
.tools button{flex:1;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;padding:5px;font-size:12px;cursor:pointer}
main{padding:32px 40px 80px;max-width:1180px}
h1{font-size:28px;margin:0 0 18px;border-bottom:3px solid var(--accent);padding-bottom:10px}
h2{font-size:22px;margin:44px 0 14px;padding:8px 14px;background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:4px;scroll-margin-top:16px}
h3{font-size:17px;margin:28px 0 10px;color:var(--accent);scroll-margin-top:16px}
p,li{color:var(--text)}
hr{border:0;border-top:1px solid var(--border);margin:28px 0}
blockquote{margin:14px 0;padding:10px 16px;background:var(--panel);border-left:4px solid var(--muted);color:var(--muted);border-radius:4px}
blockquote p{margin:0;color:var(--muted)}
.table-wrap{overflow-x:auto;margin:12px 0 18px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--code);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}
code{background:var(--code);padding:1px 6px;border-radius:4px;font-size:13px;font-family:Consolas,"Cascadia Mono",monospace}
pre{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;line-height:1.5}
pre code{background:none;padding:0}
.mermaid{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;margin:14px 0;overflow-x:auto;text-align:center}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.p0{color:var(--p0);background:var(--p0-bg)}
.badge.p1{color:var(--p1);background:var(--p1-bg)}
.badge.p2{color:var(--p2);background:var(--p2-bg)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:0 6px 14px}
.filter label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
tr.hidden{display:none}
.menu-btn{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{position:fixed;inset:0 30% 0 0;z-index:10;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 24px rgba(0,0,0,.25)}
  nav.open{transform:none}
  main{padding:60px 16px 60px}
  .menu-btn{display:block;position:fixed;top:12px;left:12px;z-index:11;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px}
  h1{font-size:22px}
}
@media print{
  nav,.menu-btn{display:none}
  .layout{display:block}
  main{max-width:none;padding:0}
  h2{break-after:avoid}
  .table-wrap,.mermaid{break-inside:avoid}
}
</style>
</head>
<body>
<button class="menu-btn" onclick="document.querySelector('nav').classList.toggle('open')">☰ 目錄</button>

  <nav>
    <div class="brand">社區管理系統</div>
    <div class="sub">需求規劃書</div>
    <div class="tools">
      <button onclick="setTheme()">深淺色切換</button>
      <button onclick="window.print()">列印 / PDF</button>
    </div>
    <div class="filter" title="篩選需求表格中的優先級">
      <label><input type="checkbox" data-p="P0" checked>P0</label>
      <label><input type="checkbox" data-p="P1" checked>P1</label>
      <label><input type="checkbox" data-p="P2" checked>P2</label>
    </div>
    <div id="toc"></div>
  </nav>
  <main id="content">載入中…（需連網以載入 Markdown 與流程圖元件）</main>
</div>

<script>
const MD = "# 物業公司社區管理系統 — 需求規劃書\n\n| 項目 | 內容 |\n|---|---|\n| 文件版本 | v0.6（第 8 章技術架構同步 SaaS 版的技術選型：Vue 3、.NET 10、PostgreSQL） |\n| 撰寫日期 | 2026-11-04 |\n| 文件狀態 | 需求草案，待業主確認與調整 |\n| 系統暫定名稱 | 物業社區管理平台（Property Community Management Platform, PCMP） |\n\n---\n\n## 1. 專案概述\n\n### 1.1 背景\n\n物業公司同時承接多個社區（案場）的管理服務，派駐總幹事、秘書、保全、清潔、機電等人員。目前常見痛點：\n\n- 各社區資料分散在紙本、Excel、LINE 群組，總公司難以即時掌握現場狀況。\n- 合約到期、證照到期、人員異動仰賴人工記憶，容易漏掉。\n- 排班、請假、代班調度溝通成本高，人力缺口難以預警。\n- 督導巡點、稽核缺失沒有系統化追蹤，品質難以量化。\n- 住戶報修、包裹、訪客等日常作業各社區做法不一，無法標準化。\n\n### 1.2 目標\n\n1. **總公司視角**：集中管理「員工」與「簽約社區」兩大核心資料，掌握合約、人力、品質、營運狀況。\n2. **社區現場視角**：提供社區工作人員一套標準化的日常作業工具（交接、報修、包裹、訪客、巡邏、通報、收費）。\n3. **資料打通**：現場作業資料即時回流總公司，形成報表與預警。\n\n### 1.3 系統範圍\n\n| 端 | 使用者 | 裝置 | 說明 |\n|---|---|---|---|\n| **後台**（總公司管理平台） | 公司幹部：主管、區域督導、人資、財務、工務 | 桌機為主 | 管理社區、合約、員工、排班、稽核、報表與系統設定 |\n| **前台**（社區工作站） | 派駐社區的工作人員：總幹事、秘書、保全、清潔、機電 | 平板／手機／櫃台電腦（RWD） | 執行社區日常作業，只能看到自己被派駐的社區資料 |\n\n> **不做**：住戶端（App / LINE 住戶服務），系統僅供公司幹部與社區工作人員使用（業主確認）。\n>\n> **不在本期範圍（建議）**：物業公司自身的會計總帳、薪資計算、**打卡系統（暫緩）**。可列為後續擴充（見第 9 章）。\n>\n> **納入範圍**：管理費收繳（含費率設定、帳單、收款、催繳、歷年紀錄、收繳分析），見 3.11 與 4.14；社區（管委會）財務記帳與財報，見 3.12 與 4.15。\n\n### 1.4 系統架構示意\n\n```mermaid\nflowchart LR\n  subgraph HQ[後台：總公司管理平台]\n    A1[社區/合約管理]\n    A2[員工/人事管理]\n    A3[排班/請假審核]\n    A4[督導稽核]\n    A5[報表/儀表板]\n    A6[系統設定/權限]\n    A7[管理費收繳/分析]\n    A8[社區財務/財報]\n    A9[公司經營分析]\n  end\n  subgraph Site[前台：社區工作站]\n    B1[班表/請假]\n    B2[交接班日誌]\n    B3[包裹/訪客]\n    B4[報修工單]\n    B5[巡邏打點]\n    B6[事件通報]\n    B7[櫃台收費/催繳]\n    B8[支出/零用金登錄]\n  end\n  DB[(共用資料庫<br/>以社區為資料邊界)]\n  HQ <--> API[API 服務層] <--> Site\n  API <--> DB\n  API --> N[通知服務<br/>Email / LINE / 推播]\n```\n\n---\n\n## 2. 使用者角色與權限\n\n### 2.1 後台角色（公司幹部）\n\n| 角色代碼 | 角色 | 主要職責 | 資料範圍 |\n|---|---|---|---|\n| HQ-ADMIN | 系統管理員 | 帳號、角色權限、代碼表、系統參數 | 全公司 |\n| HQ-EXEC | 高階主管（總經理/副總） | 查看儀表板、報表、核決合約 | 全公司（唯讀為主） |\n| HQ-AREA | 區域主管／督導 | 管轄社區巡點稽核、人員調度、異常追蹤 | 指派的組織節點（含子節點）或個別社區 |\n| HQ-HR | 人資 | 員工檔案、證照、到離職、派駐、請假審核 | 全公司員工 |\n| HQ-FIN | 財務／業務 | 合約金額、請款期程、續約追蹤、經營分析 | 全公司合約 |\n| HQ-ENG | 工務／機電主管 | 設備資料、保養計畫、重大報修 | 指派社區 |\n\n### 2.2 前台角色（社區工作人員）\n\n| 角色代碼 | 角色 | 主要職責 | 資料範圍 |\n|---|---|---|---|\n| SITE-MGR | 總幹事／社區主任 | 社區作業總管、審核前台資料、管委會窗口 | 自己派駐的社區（可多個） |\n| SITE-SEC | 秘書／行政 | 住戶資料、公告、公設預約、包裹 | 派駐社區 |\n| SITE-GUARD | 保全／警衛 | 訪客、包裹、巡邏、交接班、事件通報 | 派駐社區 |\n| SITE-CLEAN | 清潔人員 | 查看班表、清潔檢核表、事件通報 | 派駐社區（功能精簡） |\n| SITE-TECH | 機電／工務人員 | 報修處理、設備保養紀錄 | 派駐社區 |\n\n### 2.3 權限設計原則\n\n- **RBAC + 資料範圍（Scope）**：權限 = 角色（能做什麼）× 範圍（能看哪些社區）。範圍可指定為組織樹的某個節點（含其下所有社區）或個別社區。\n- 一位員工可同時擁有多個角色（例如督導兼任某社區總幹事）。\n- 前台帳號登入後只顯示「目前派駐中」的社區；派駐結束自動失去存取權。\n- 住戶個資欄位（電話、身分證後碼、車牌）採欄位級權限與遮罩顯示。\n- 所有新增／修改／刪除／匯出操作寫入稽核日誌。\n\n### 2.4 權限矩陣（摘要）\n\n| 功能 | ADMIN | EXEC | AREA | HR | FIN | ENG | SITE-MGR | SITE-SEC | SITE-GUARD | SITE-CLEAN | SITE-TECH |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| 社區基本資料 | 全 | 讀 | 讀/改(轄區) | 讀 | 讀 | 讀 | 讀 | 讀 | — | — | — |\n| 合約管理 | 全 | 讀/核 | 讀(轄區) | — | 全 | — | — | — | — | — | — |\n| 員工檔案 | 全 | 讀 | 讀(轄區) | 全 | — | 讀 | 讀(本社區) | — | — | — | — |\n| 排班 | 全 | 讀 | 全(轄區) | 讀 | — | — | 編(本社區) | 讀 | 讀自己 | 讀自己 | 讀自己 |\n| 請假審核 | 全 | — | 核(轄區) | 核 | — | — | 初審 | 申請 | 申請 | 申請 | 申請 |\n| 督導稽核 | 全 | 讀 | 全(轄區) | — | — | 讀 | 讀/回覆改善 | — | — | — | — |\n| 住戶資料 | 全 | — | 讀(遮罩) | — | — | — | 全 | 全 | 讀(遮罩) | — | 讀(遮罩) |\n| 管理費收繳 | 全 | 讀(分析) | 讀(轄區) | — | 全 | — | 全(本社區) | 收款/查詢 | — | — | — |\n| 公司經營分析 | 全 | 全 | 讀(轄區,可設定) | — | 全 | — | — | — | — | — | — |\n| 社區財務/財報 | 全 | 讀 | 讀(轄區) | — | 全 | — | 全(本社區) | 登錄 | — | — | — |\n| 包裹/訪客 | 讀 | — | 讀 | — | — | — | 全 | 全 | 全 | — | — |\n| 報修工單 | 讀 | 讀 | 讀/派工 | — | — | 全 | 全 | 建/讀 | 建/讀 | 建 | 處理 |\n| 事件通報 | 讀 | 讀 | 全(轄區) | — | — | 讀 | 全 | 建 | 建 | 建 | 建 |\n| 報表 | 全 | 全 | 轄區 | 人事類 | 合約類 | 工務類 | 本社區 | — | — | — | — |\n| 系統設定 | 全 | — | — | — | — | — | — | — | — | — | — |\n\n> 實際權限可於後台「角色權限設定」調整，以上為預設值。\n\n---\n\n## 3. 後台功能需求（總公司管理平台）\n\n> 需求編號規則：`B-模組-序號`，優先級：**P0** = MVP 必要、**P1** = 第二期、**P2** = 未來擴充。\n\n### 3.1 儀表板（B-DASH）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-DASH-01 | 顯示簽約社區總數、服務戶數、派駐人數、本月營收（合約金額加總） | P0 |\n| B-DASH-02 | 預警清單：合約 90/60/30 天內到期、員工證照 60 天內到期、社區人力缺額 | P0 |\n| B-DASH-03 | 今日出勤狀況：應到/實到/缺勤/遲到，依社區列出（**依賴打卡系統，暫緩**） | 暫緩 |\n| B-DASH-04 | 未結案事件通報、逾期報修工單、稽核未改善缺失數量 | P0 |\n| B-DASH-05 | 社區地圖（依地址標點，顏色表示狀態） | P2 |\n| B-DASH-06 | 依角色顯示不同儀表板（督導只看轄區） | P1 |\n| B-DASH-09 | 經營摘要（限主管/財務）：本月營收、毛利率、服務費應收逾期、虧損社區數 | P0 |\n| B-DASH-08 | 社區財務狀態：未封帳、月報未送出、帳戶異常的社區清單 | P0 |\n| B-DASH-07 | 管理費收繳概況：本期收繳率、累計欠費金額、收繳率最低的社區排行 | P0 |\n\n### 3.2 社區（案場）管理（B-SITE）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-SITE-01 | 社區基本資料：名稱、地址、GPS 座標、棟數、樓層、戶數、車位數、建物型態（住宅/商辦/混合）、使用執照日期 | P0 |\n| B-SITE-02 | 社區掛在組織架構的某個節點下（見 B-SYS-07），並設定負責督導 | P0 |\n| B-SITE-03 | 管委會資料：屆別、任期、主委/副主委/財委/監委聯絡資訊（含歷屆紀錄） | P0 |\n| B-SITE-04 | 社區狀態：洽談中 / 服務中 / 暫停 / 已解約，並保留狀態變更紀錄 | P0 |\n| B-SITE-05 | 公共設施清單（健身房、會議室、游泳池…）及開放規則，供前台預約使用 | P1 |\n| B-SITE-06 | 設備清冊：電梯、消防、發電機、水塔、機械車位等，含廠商、保固、保養週期 | P1 |\n| B-SITE-07 | 社區文件庫：規約、平面圖、使用執照、交接清冊等檔案上傳與版本管理 | P1 |\n| B-SITE-08 | 社區人力編制標準（例：總幹事1、秘書1、保全日班2/夜班2、清潔3） | P0 |\n| B-SITE-09 | 社區 QR Code / 打卡範圍（GPS 半徑或指定 Wi-Fi）設定（**打卡系統暫緩**） | 暫緩 |\n\n### 3.3 合約管理（B-CONT）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-CONT-01 | 合約主檔：合約編號、社區、甲方（管委會）、合約起訖日、服務項目（物業/保全/清潔/機電）、月費金額、付款方式 | P0 |\n| B-CONT-02 | 合約附件上傳（掃描檔 PDF） | P0 |\n| B-CONT-03 | 續約／變更／解約紀錄，保留歷史版本（一社區可有多份合約） | P0 |\n| B-CONT-04 | 到期提醒：90/60/30 天自動通知業務、督導、主管 | P0 |\n| B-CONT-05 | 合約約定人力（與 B-SITE-08 連動），比對實際派駐人力 | P0 |\n| B-CONT-06 | 請款期程與收款狀態登記（僅登記，不做金流） | P1 |\n| B-CONT-07 | 合約審核流程（業務建立 → 主管核決） | P1 |\n| B-CONT-08 | 調價紀錄（例：基本工資調整連動調價） | P1 |\n\n### 3.4 員工／人事管理（B-EMP）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-EMP-01 | 員工檔案：工號、姓名、性別、生日、身分證字號（加密）、聯絡方式、緊急聯絡人、住址、到職日、職稱、雇用類型（正職/兼職/約聘） | P0 |\n| B-EMP-02 | 證照管理：保全人員資格核備、甲/乙級電匠、消防設備士、防火管理人、急救證照等，含證號、有效期限、掃描檔 | P0 |\n| B-EMP-03 | 派駐管理：員工 ↔ 社區 ↔ 職位 ↔ 起訖日，可查詢歷史派駐紀錄 | P0 |\n| B-EMP-04 | 到職、調動、離職流程；離職自動停用帳號並結束派駐 | P0 |\n| B-EMP-05 | 員工帳號開通（同一員工決定可登入前台/後台及其角色） | P0 |\n| B-EMP-06 | 教育訓練紀錄：課程、時數、日期、結訓狀態 | P1 |\n| B-EMP-07 | 獎懲紀錄 | P1 |\n| B-EMP-08 | 員工資料匯入（Excel）與匯出 | P0 |\n| B-EMP-09 | 保全人員良民證／勞健保投保狀態登記 | P1 |\n\n### 3.5 排班與出勤（B-SCH）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-SCH-01 | 班別定義：早/中/晚/大夜/日班 12H 等，含上下班時間與休息時間 | P0 |\n| B-SCH-02 | 月排班表：以社區為單位排班，支援複製上月、週期輪班套用 | P0 |\n| B-SCH-03 | 排班檢核：人力不足（低於編制）、連續上班天數、單日工時上限等勞基法提醒 | P1 |\n| B-SCH-04 | 出勤紀錄：彙整前台打卡資料，標記遲到/早退/缺卡/曠職（**打卡系統暫緩**） | 暫緩 |\n| B-SCH-05 | 補卡申請審核（**打卡系統暫緩**） | 暫緩 |\n| B-SCH-06 | 請假申請審核（多層級：總幹事初審 → 督導/人資核准） | P0 |\n| B-SCH-07 | 代班／支援調度：跨社區支援人員指派，支援紀錄可供計算支援津貼 | P1 |\n| B-SCH-08 | 加班申請與紀錄 | P1 |\n| B-SCH-09 | 出勤報表匯出（供薪資計算使用）（**打卡系統暫緩**） | 暫緩 |\n\n### 3.6 督導巡點與稽核（B-AUD）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-AUD-01 | 稽核表單範本管理：可自訂檢查項目、評分方式、是否需拍照 | P0 |\n| B-AUD-02 | 督導巡點紀錄：日期、社區、使用範本逐項評分、拍照、簽名 | P0 |\n| B-AUD-03 | 缺失追蹤：缺失項目自動開立改善單 → 前台總幹事回覆改善 → 督導複查結案 | P0 |\n| B-AUD-04 | 巡點計畫：每位督導每月應巡社區次數，追蹤達成率 | P1 |\n| B-AUD-05 | 社區品質評分趨勢報表 | P1 |\n| B-AUD-06 | 管委會滿意度調查（定期發送問卷） | P2 |\n\n### 3.7 工單與事件總覽（B-OPS）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-OPS-01 | 跨社區報修工單總覽：依狀態、社區、類別、逾期篩選 | P0 |\n| B-OPS-02 | 重大報修可由工務主管派工或指派外部廠商 | P1 |\n| B-OPS-03 | 事件通報總覽：依等級（一般/重要/緊急）通知對應主管 | P0 |\n| B-OPS-04 | 緊急事件即時推播（火警、漏水、治安、人員受傷） | P0 |\n| B-OPS-05 | 廠商管理：協力廠商資料、服務類別、評價 | P1 |\n\n### 3.8 公告與文件中心（B-DOC）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-DOC-01 | 公司公告發布：可指定全部社區/特定區域/特定角色，追蹤已讀狀態 | P0 |\n| B-DOC-02 | SOP 與表單範本庫（例：颱風防災 SOP、交接清冊範本） | P1 |\n| B-DOC-03 | 公告需確認閱讀（重要公告強制已讀） | P1 |\n\n### 3.9 報表中心（B-RPT）\n\n| 編號 | 報表 | 優先級 |\n|---|---|---|\n| B-RPT-01 | 社區清冊（含合約狀態、到期日、月費） | P0 |\n| B-RPT-02 | 人力配置表：各社區編制 vs 實際派駐 | P0 |\n| B-RPT-03 | 月出勤統計表（員工/社區維度）（**打卡系統暫緩**） | 暫緩 |\n| B-RPT-04 | 證照到期清單 | P0 |\n| B-RPT-05 | 報修統計（件數、類別、平均處理時間） | P1 |\n| B-RPT-06 | 事件通報統計 | P1 |\n| B-RPT-07 | 督導稽核成績與缺失改善率 | P1 |\n| B-RPT-08 | 所有報表支援 Excel / PDF 匯出 | P0 |\n| B-RPT-09 | 管理費收繳報表（明細見 3.11 收繳分析） | P0 |\n\n### 3.10 系統設定（B-SYS）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-SYS-01 | 帳號管理：建立、停用、重設密碼、強制登出 | P0 |\n| B-SYS-02 | 角色與權限設定（功能權限 + 資料範圍） | P0 |\n| B-SYS-03 | 代碼表維護：區域、職稱、班別、報修類別、事件類別、證照類別 | P0 |\n| B-SYS-04 | 稽核日誌查詢（誰、何時、對哪筆資料、做了什麼） | P0 |\n| B-SYS-05 | 通知設定：Email / LINE Notify 替代方案（LINE 官方帳號 Messaging API）/ App 推播 | P1 |\n| B-SYS-06 | 登入安全：密碼原則、登入失敗鎖定、後台雙因子驗證（2FA） | P0 |\n| B-SYS-07 | **組織架構自訂**：以樹狀結構設定公司內部層級，層數與名稱不固定（例：總公司 → 事業處 → 區 → 組），可新增、改名、搬移、停用節點 | P0 |\n| B-SYS-08 | 每個組織節點可指定主管；幹部的資料範圍可設為某節點，**自動涵蓋其下所有子節點的社區** | P0 |\n| B-SYS-10 | **資料匯入中心**：提供標準 Excel 範本與匯入檢核報告，支援 社區與合約、員工與證照、住戶/區權人/車位（含坪數與應繳管理費）、設備與廠商、管理費歷年紀錄；可試算預覽後再正式匯入，留存匯入批次紀錄並可整批撤銷 | P0 |\n| B-SYS-09 | 組織調整（社區換區、節點合併）保留異動歷史，歷史報表可依當時或目前組織統計 | P1 |\n\n### 3.11 管理費收繳（B-FEE）\n\n> 管理費收入屬於**管委會**，物業公司是代為收繳與管理紀錄。系統以「社區」為帳務單位，每個社區的帳彼此獨立。\n>\n> **款項流向與收據名義依社區不同**（業主確認）：每個社區可個別設定款項進管委會帳戶或公司帳戶、收據以管委會或公司名義開立（見 B-FEE-05a～05c）。\n\n#### 3.11.1 費率設定\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-FEE-01 | 收費項目設定：管理費、車位清潔費（汽車/機車）、其他雜項（如裝潢保證金），每個社區可自訂 | P0 |\n| B-FEE-02 | 計費方式：依坪數（元/坪）、依戶固定金額、依車位數、依戶別類型（住宅/店面/辦公）不同費率 | P0 |\n| B-FEE-03 | 費率版本管理：每次調整費率需設定生效日，保留**歷年費率**（例：2024 年 60 元/坪、2026 年起 65 元/坪），歷史帳單維持當時費率 | P0 |\n| B-FEE-04 | 收費週期：月繳、季繳、半年繳、年繳；可設定預繳優惠（如年繳 95 折） | P0 |\n| B-FEE-05a | **款項流向設定（每社區個別設定）**：A. 直接入管委會帳戶；B. 先入公司帳戶再定期撥付管委會。設定收款帳戶資訊，變更需保留歷史 | P0 |\n| B-FEE-05b | **收據名義設定（每社區個別設定）**：收據抬頭可為該社區管委會或本公司，含抬頭、統編、印章圖檔、收據字軌 | P0 |\n| B-FEE-05c | 流向 B 的社區：撥付管委會紀錄（撥付日期、期間、金額、匯款憑證），並可產生「代收款撥付明細表」；系統顯示代收未撥付餘額 | P0 |\n| B-FEE-05 | 調費需記錄依據（區權會/管委會決議日期、會議紀錄附件） | P1 |\n\n#### 3.11.2 帳單（應收）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-FEE-06 | 每期自動產生全社區應收帳單（依戶別、費率、週期），可預覽後再確認開立 | P0 |\n| B-FEE-07 | 個別帳單調整：減免、折讓、補收、作廢，需填寫原因並留存紀錄 | P0 |\n| B-FEE-08 | 繳費通知單列印（可批次列印投遞信箱）或匯出 | P0 |\n| B-FEE-09 | 戶別異動處理：過戶、出租（繳費人改為租客）時，帳單歸屬依日期切分 | P1 |\n| B-FEE-10 | 滯納金規則（依社區規約，可關閉） | P1 |\n\n#### 3.11.3 收款（實收）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-FEE-11 | 收款登記：收款方式（現金、匯款、支票、ATM 轉帳、信用卡、超商代收）、金額、日期、經手人 | P0 |\n| B-FEE-12 | 一筆收款可沖銷多期帳單；溢繳金額轉為預收款，下期自動扣抵 | P0 |\n| B-FEE-13 | 開立收據：系統編號連號、可列印／作廢重開，作廢需保留原收據紀錄 | P0 |\n| B-FEE-14 | 銀行入帳對帳：匯入銀行存摺明細（Excel/CSV），依虛擬帳號或金額自動比對 | P1 |\n| B-FEE-15 | 每戶專屬虛擬帳號（需與銀行簽約） | P2 |\n| B-FEE-16 | 超商代收 / 線上刷卡 / 行動支付 | P2 |\n| B-FEE-17 | 現金日結：每日櫃台收現金額與收據核對，交接給總幹事簽收 | P0 |\n\n#### 3.11.4 欠費與催繳\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-FEE-18 | 欠費 *記帳模式（每社區個別設定）**：A. 現場記帳（總幹事記帳、封帳、出月報，公司財務抽查）；B. 總公司記帳（現場只上傳憑證，由公司財務記帳、封帳、出月報）；C. 現場記帳＋財務覆核（覆核通過才能封帳）。模式變更保留紀錄 | P0 |\n| B-FIN-04 | 帳戶間轉帳（如管理費專戶轉存定存、提撥公共基金）登錄 | P0 |\n\n#### 3.12.2 收入\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-FIN-05 | 管理費、車位費收款自動寫入收入帳（依收款日入帳）；款項先進公司帳戶的社區，以「撥付管委會」日期入帳（與 B-FEE-05c 連動） | P0 |\n| B-FIN-06 | 其他收入手動登錄：日期、科目、金額、入帳帳戶、憑證照片 | P0 |\n\n#### 3.12.3 支出\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-FIN-07 | 支出登錄：日期、科目、廠商、摘要、金額、付款方式（轉帳/支票/現金/零用金）、發票或收據照片 | P0 |\n| B-FIN-08 | **支出簽核（每社區自訂級距）**：每個社區依規約或管委會決議，自行設定金額級距與對應簽核人（例：5,000 以下總幹事、5,000～30,000 財委、30,000 以上主委＋監委），可設多層；設定變更需記錄決議依據並保留歷史。管委會不登入系統，由系統列印「請款單／支出傳票」紙本簽核後，掃描或拍照上傳；未上傳簽核影像的支出不可封帳 | P0 |\n| B-FIN-09 | 固定支出（每月物業服務費、電梯保養等）自動產生待付款項；所有待付款項列入「應付未付」追蹤，付款後自動轉為支出 | P0 |\n| B-FIN-10 | 報修工單的費用可直接轉為支出（與 F-REP-05 連動） | P1 |\n| B-FIN-11 | 支票登記：票號、到期日、兌現狀態 | P1 |\n\n#### 3.12.4 零用金\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-FIN-12 | 零用金額度設定、撥補、支用登錄（附收據照片） | P0 |\n| B-FIN-13 | 零用金日記帳與月底盤點（實點金額 vs 帳面金額，差額需說明） | P0 |\n\n#### 3.12.5 對帳與結帳\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-FIN-14 | 銀行對帳：每月登錄或匯入存摺餘額，與帳面餘額比對，列出差異 | P0 |\n| B-FIN-15 | **月結封帳**：封帳後不可修改，只能用調整分錄更正並保留紀錄 | P0 |\n| B-FIN-16 | 年度結帳：結轉下年度期初餘額 | P0 |\n\n#### 3.12.6 財務報表\n\n| 編號 | 報表 | 說明 | 優先級 |\n|---|---|---|---|\n| B-FIN-17 | 收支明細表 | 指定期間每一筆收入、支出明細（依日期或科目） | P0 |\n| B-FIN-18 | 收支結算表 | 月/年各科目收入、支出合計與本期結餘 | P0 |\n| B-FIN-19 | 資金餘額表 | 各帳戶（專戶、公基、定存、零用金）期初、收入、支出、期末餘額 | P0 |\n| B-FIN-20 | 公共基金收支表 | 公基提撥、動支、利息與餘額 | P0 |\n| B-FIN-21 | 管理費收繳表與欠費明細 | 引用 3.11 資料（B-FEE-35） | P0 |\n| B-FIN-22 | 零用金明細表 | 撥補、支用、盤點結果 | P0 |\n| B-FIN-23 | **管委會月報（一鍵產出）** | 合併成一份 PDF，可加封面與總幹事簽章欄，內容包含：①財務報表（B-FIN-17～22）②工作報告（B-FIN-23a）③應付未付清單（B-FIN-23b）④憑證影本（B-FIN-23c）。另提供「公告版」（去除個資與憑證，供張貼公布欄）；各章節可勾選是否輸出 | P0 |\n| B-FIN-23a | 月報－工作報告 | 自動彙整本月物業服務成果：報修件數與明細（已結/未結）、事件通報、設備保養紀錄、巡邏統計、包裹/訪客件數、督導稽核結果；總幹事可補充文字說明與照片 | P0 |\n| B-FIN-23b | 月報－應付未付清單 | 已發生但尚未付款的費用（廠商、項目、金額、預計付款日），來源為固定支出待付款項、已簽核未付款支出、報修完工未請款 | P0 |\n| B-FIN-23c | 月報－憑證影本 | 依支出順序附上當月發票、收據、請款單簽核影像，每張標示對應的收支紀錄編號 | P0 |\n| B-FIN-24 | 年度決算報告 | 全年收支結算、資金餘額、公基、欠費總表 | P0 |\n| B-FIN-25 | 歷年財報查詢與比較 | 各年度收支、結餘並排比較，支出結構趨勢 | P0 |\n| B-FIN-26 | 預算編列與預算執行表 | 年度預算（依科目），每月比對預算 vs 實際與執行率 | P1 |\n| B-FIN-27 | 支出分析 | 支出依科目/廠商統計，前 N 大支出項目 | P1 |\n\n#### 3.12.7 交接、歷史資料與公司總覽\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-FIN-28 | 管委會改選時產生「財務移交清冊」（資金餘額、存摺、印鑑、支票、零用金、未付款項） | P0 |\n| B-FIN-29 | 歷史財務資料匯入：可匯入期初餘額；有明細的年度可匯入收支明細 | P0 |\n| B-FIN-30 | 社區撤場時，匯出完整帳冊與憑證影像移交管委會 | P0 |\n| B-FIN-31 | 後台總覽：各社區本月是否已封帳、月報是否已送管委會、異常提醒（帳戶餘額為負、零用金未盤點、銀行對帳有差異） | P0 |\n\n### 3.13 公司經營分析（B-BIZ）\n\n> 這是**物業公司自己**的經營分析，和 3.12 社區（管委會）財報分開，社區工作人員看不到。\n>\n> - **收入**：來自合約（B-CONT）的服務費與請款、收款紀錄。\n> - **成本**：以社區為單位歸集。人事成本是最大宗，資料來源見 B-BIZ-06。\n> - 分析單位：**社區 → 組織節點（可自訂層級）→ 全公司**，並可依服務類型（物業/保全/清潔/機電）切分。\n> - 預先彙總計算（NF-PERF-08），社區數量很多時也能快速查詢。\n\n#### 3.13.1 收入與應收\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-BIZ-01 | 依合約自動產生每月**應收服務費**（含調價生效日、合約起訖、中途解約按日計算） | P0 |\n| B-BIZ-02 | 請款與收款登記：請款單號、請款日、收款日、金額、短收原因（與 B-CONT-06 合併） | P0 |\n| B-BIZ-03 | 臨時性收入：加派人力、專案清潔、代辦工程等，歸屬到社區 | P0 |\n| B-BIZ-04 | **服務費應收帳齡**：各社區欠公司服務費的金額與天數（30/60/90 天以上） | P0 |\n\n#### 3.13.2 成本\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-BIZ-05 | 職位標準成本設定：各職位（總幹事、秘書、保全日/夜班、清潔、機電）的月薪、勞健保、勞退 6%、加班、津貼、年終與特休提撥，算出每人每月標準成本；可依年度設定版本（基本工資調整時更新） | P0 |\n| B-BIZ-06 | **人事成本歸集（第一期採標準成本，業主確認）**：依派駐紀錄（B-EMP-03），以「職位標準成本 × 派駐天數比例」把成本歸到社區；跨社區支援依支援紀錄分攤。待 Q5 薪資系統確認後，再擴充為匯入或串接實際薪資（P1），並提供標準 vs 實際差異分析 | P0 |\n| B-BIZ-07 | 其他直接成本登錄：制服、清潔耗材、設備工具、保險、交通、外包費等，歸屬到社區 | P0 |\n| B-BIZ-08 | **間接成本（業主確認）**：①督導、區域主管的成本直接歸屬到其管轄的組織節點，在該節點損益中扣除（不分攤到社區）；②總公司管理費用只在全公司層級扣除 | P0 |\n| B-BIZ-08a | 社區淨利分攤（選用）：將間接成本依營收比例（預設）、人數或戶數分攤到社區，計算社區淨利供主管參考；分攤方式由財務設定 | P1 |\n\n#### 3.13.3 經營分析報表\n\n| 編號 | 分析項目 | 說明 | 優先級 |\n|---|---|---|---|\n| B-BIZ-09 | **社區損益表** | 每個社區每月：服務收入 − 人事成本 − 其他直接成本 = **毛利**、毛利率（第一期社區只算到毛利；淨利見 B-BIZ-08a） | P0 |\n| B-BIZ-10 | 組織／公司損益彙總 | 依組織樹逐層加總社區毛利，再扣除該節點的督導/主管成本；全公司層級再扣除總公司管理費用得出營業利益；可展開到單一社區 | P0 |\n| B-BIZ-11 | 毛利排行與虧損警示 | 毛利率排行；**警示門檻可由主管設定**，預設：毛利率 < 10% 黃燈、< 0%（虧損）紅燈、連續 3 個月虧損通知高階主管；警示同步顯示在儀表板 | P0 |\n| B-BIZ-12 | 營收趨勢 | 月/年營收、成長率；新簽約、續約、解約社區數與金額 | P0 |\n| B-BIZ-13 | 人力達成率 | 合約約定人力 vs 實際派駐人力，人力不足的社區與可能的違約風險 | P0 |\n| B-BIZ-14 | 人效指標 | 每人平均營收、每戶服務成本、每坪服務費 | P1 |\n| B-BIZ-15 | 合約續約分析 | 即將到期合約的金額、毛利，續約率、流失原因統計 | P1 |\n| B-BIZ-16 | **調價試算** | 輸入基本工資或勞健保費率調整，試算各社區成本增加與毛利變化，列出需要調價的合約與建議調幅 | P1 |\n| B-BIZ-17 | 新案報價試算 | 輸入社區規模與人力編制，依標準成本與目標毛利率算出建議月費 | P1 |\n| B-BIZ-18 | 服務品質 × 毛利交叉分析 | 結合稽核分數、事件與報修數量，找出「低毛利且低品質」的高風險社區 | P2 |\n| B-BIZ-19 | 經營月報 | 每月自動產生公司經營月報 PDF（營收、毛利、應收、人力、預警），寄送主管 | P1 |\n| B-BIZ-20 | 年度預算與達成率 | 公司年度營收、毛利目標，可分配到組織節點，追蹤達成率 | P1 |\n\n#### 3.13.4 權限\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-BIZ-21 | 經營分析僅限高階主管、財務；區域主管只看轄區且可設定是否顯示成本與毛利；個人薪資明細只有財務與人資看得到，分析畫面只顯示彙總數 | P0 |\n\n---\n\n## 4. 前台功能需求（社區工作站）\n\n> 前台以「行動優先（Mobile First）」設計，櫃台可用平板或電腦操作。登入後若派駐多個社區，需先選擇社區。\n\n### 4.1 工作台首頁（F-HOME）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-HOME-01 | 顯示今日班表、待辦事項（未領包裹、待處理報修、未讀公告、改善單） | P0 |\n| F-HOME-02 | 快捷功能按鈕（依角色顯示不同功能） | P0 |\n| F-HOME-03 | 社區切換（派駐多社區者） | P0 |\n\n### 4.2 個人班表與請假（F-ATT）\n\n> **打卡系統暫時不做**（業主決定）。本期只提供班表查詢與請假；打卡相關需求標記為「暫緩」，日後再啟用。\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-ATT-01 | 上下班打卡：GPS 定位驗證（社區半徑範圍內）或掃描社區 QR Code | 暫緩 |\n| F-ATT-02 | 打卡拍照（選配，防代打卡） | 暫緩 |\n| F-ATT-03 | 查看個人班表 | P0 |\n| F-ATT-04 | 線上請假、加班申請，查詢審核進度 | P0 |\n| F-ATT-05 | 總幹事可編修本社區排班（送督導核准） | P1 |\n\n### 4.3 交接班日誌（F-SHIFT）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-SHIFT-01 | 每班填寫交接日誌：重要事項、待辦、鑰匙/對講機/設備點交 | P0 |\n| F-SHIFT-02 | 接班人員確認接收（電子簽核） | P0 |\n| F-SHIFT-03 | 自動帶入本班包裹、訪客、事件摘要 | P1 |\n\n### 4.4 住戶資料（F-RES）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-RES-01 | **每個社區需建立每一戶的完整資料**：棟別、樓層、門牌、戶別類型（住宅/店面/辦公）、坪數（主建物/附屬/公設，計費坪數） | P0 |\n| F-RES-01a | **應繳管理費**：依費率與坪數自動計算每戶每期應繳金額，並可個別設定例外金額（需填原因） | P0 |\n| F-RES-01b | **車位資料**：車位編號、類型（汽車/機車、平面/機械）、產權（自有/租用）、車位坪數、車位管理費 | P0 |\n| F-RES-01c | **區權人資料**：姓名、身分證/統編（加密）、聯絡電話、通訊地址、持分比例、取得日期；過戶時保留歷任區權人紀錄 | P0 |\n| F-RES-01d | 住戶（實際居住者）資料：屋主自住/租客、聯絡方式、繳費人設定（區權人或租客） | P0 |\n| F-RES-02 | 車輛資料（車牌、車型），對應車位 | P1 |\n| F-RES-03 | 寵物登記、特殊住戶備註（行動不便、獨居長者）| P2 |\n| F-RES-04 | 住戶資料 Excel 匯入匯出（權限控管、留存匯出紀錄） | P0 |\n| F-RES-05 | 個資遮罩：非授權角色只看到部分資訊（例：0912-***-678） | P0 |\n\n### 4.5 包裹／郵件管理（F-PKG）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-PKG-01 | 包裹登記：戶別、收件人、物流商、件數、類型（一般/冷藏/掛號/大型）、拍照、存放位置 | P0 |\n| F-PKG-02 | 領取登記：領取人簽名或拍照、領取時間 | P0 |\n| F-PKG-03 | 逾期未領提醒（例：超過 7 天標紅） | P0 |\n| F-PKG-04 | 通知住戶領取：工作人員可一鍵產生通知文字或撥打電話紀錄（不做住戶端系統） | P1 |\n| F-PKG-05 | 住戶寄放物品（代收代寄）登記 | P1 |\n\n### 4.6 訪客管理（F-VIS）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-VIS-01 | 訪客登記：姓名、拜訪戶別、事由、人數、證件抵押、進出時間 | P0 |\n| F-VIS-02 | 廠商／施工人員進出登記（含裝修申請連動） | P1 |\n| F-VIS-03 | 訪客車輛臨停登記 | P1 |\n| F-VIS-04 | 黑名單提醒 | P2 |\n\n### 4.7 報修工單（F-REP）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-REP-01 | 建立報修：來源（住戶/巡邏發現/管委會）、地點（公設或戶別）、類別（水電/電梯/門禁/消防/清潔/其他）、描述、照片 | P0 |\n| F-REP-02 | 工單狀態流程：待處理 → 處理中 → 待料/外包 → 已完成 → 結案（總幹事確認） | P0 |\n| F-REP-03 | 指派處理人（社區機電或外部廠商），記錄處理過程與完工照片 | P0 |\n| F-REP-04 | 逾期未處理自動通知督導 | P1 |\n| F-REP-05 | 報修費用登記（是否由管委會支付） | P1 |\n\n### 4.8 巡邏打點（F-PAT）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-PAT-01 | 巡邏點設定（後台或總幹事設定，每點產生 QR Code / NFC 標籤） | P0 |\n| F-PAT-02 | 巡邏路線與頻率（例：夜班每 2 小時一次） | P0 |\n| F-PAT-03 | 保全掃碼打點，可附註異常與拍照，異常可一鍵轉報修或事件 | P0 |\n| F-PAT-04 | 漏巡、超時提醒；巡邏紀錄報表 | P1 |\n\n### 4.9 設備保養與清潔檢核（F-MNT）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-MNT-01 | 依設備保養週期自動產生保養任務（電梯月保、消防年檢、水塔清洗半年） | P1 |\n| F-MNT-02 | 保養紀錄登錄：日期、廠商、結果、照片、報告上傳 | P1 |\n| F-MNT-03 | 清潔檢核表：每日區域打勾、拍照 | P1 |\n| F-MNT-04 | 抄表紀錄（公電、公水） | P2 |\n\n### 4.10 公設預約（F-FAC）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-FAC-01 | 依公設規則代住戶登記預約（時段、人數、費用） | P1 |\n| F-FAC-02 | 預約行事曆檢視、衝突檢查 | P1 |\n\n### 4.11 事件通報（F-INC）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-INC-01 | 事件登記：類別（治安、火警、漏水、停電、糾紛、人員受傷、客訴…）、等級、時間、地點、描述、照片/影片 | P0 |\n| F-INC-02 | 依等級自動通知：一般→總幹事；重要→督導；緊急→督導＋區域經理＋主管（即時推播） | P0 |\n| F-INC-03 | 處理進度更新與結案報告 | P0 |\n\n### 4.12 公告（F-NEWS）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-NEWS-01 | 接收公司公告，標記已讀 | P0 |\n| F-NEWS-02 | 社區公告管理（張貼給住戶的公告內容存檔，例：停水通知、區權會通知） | P1 |\n| F-NEWS-03 | 管委會會議紀錄存檔 | P1 |\n\n### 4.13 稽核改善回覆（F-AUD）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-AUD-01 | 總幹事查看督導開立的改善單，回覆改善措施並上傳改善後照片 | P0 |\n\n### 4.14 管理費櫃台作業（F-FEE）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-FEE-01 | 輸入戶別即可查詢應繳金額、欠費期數、歷年繳費紀錄 | P0 |\n| F-FEE-02 | 櫃台收款登記並列印收據（支援熱感應或一般印表機） | P0 |\n| F-FEE-03 | 每日現金日結表，交班時與交接日誌連動 | P0 |\n| F-FEE-04 | 總幹事：本社區欠費清單、登記催繳紀錄、列印催繳單 | P0 |\n| F-FEE-05 | 總幹事：本社區收繳率與欠費帳齡（簡版分析） | P0 |\n| F-FEE-06 | 保全/秘書代收時，需經總幹事確認後才算正式入帳 | P1 |\n\n### 4.15 社區財務作業（F-FIN）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| F-FIN-01 | 總幹事/秘書登錄支出與其他收入，手機直接拍發票、收據 | P0 |\n| F-FIN-02 | 列印請款單／支出傳票給管委會簽核，簽核後拍照上傳 | P0 |\n| F-FIN-03 | 零用金支用登錄、月底盤點 | P0 |\n| F-FIN-04 | 登錄銀行存摺餘額進行對帳 | P0 |\n| F-FIN-05 | 總幹事月結封帳，一鍵產出管委會月報 PDF（完整版／公告版）；總公司記帳模式的社區，前台只顯示憑證上傳與月報下載 | P0 |\n| F-FIN-06 | 查詢本社區歷年財報 | P0 |\n\n---\n\n## 5. 核心業務流程\n\n### 5.1 新簽約社區上線流程\n\n```mermaid\nflowchart TD\n  S1[業務建立社區資料<br/>狀態: 洽談中] --> S2[建立合約<br/>上傳合約掃描檔]\n  S2 --> S3{主管核決}\n  S3 -- 退回 --> S2\n  S3 -- 核准 --> S4[社區狀態改為: 服務中]\n  S4 --> S5[設定人力編制 / 巡邏點 / 管理費費率]\n  S5 --> S6[人資派駐員工<br/>開通前台帳號]\n  S6 --> S7[匯入住戶資料]\n  S7 --> S8[社區正式上線]\n```\n\n### 5.2 請假審核流程\n\n```mermaid\nflowchart LR\n  A[員工前台申請請假] --> B[總幹事初審]\n  B -- 駁回 --> X[通知員工]\n  B -- 同意 --> C{是否需安排代班?}\n  C -- 是 --> D[督導安排代班/支援人力]\n  C -- 否 --> E[督導/人資核准]\n  D --> E\n  E --> F[更新班表]\n```\n\n### 5.3 報修工單流程\n\n```mermaid\nstateDiagram-v2\n  [*] --> 待處理: 建立報修\n  待處理 --> 處理中: 指派處理人\n  處理中 --> 待料外包: 需叫料/委外\n  待料外包 --> 處理中\n  處理中 --> 已完成: 上傳完工照片\n  已完成 --> 結案: 總幹事確認\n  已完成 --> 處理中: 確認未修復\n  結案 --> [*]\n```\n\n### 5.4 督導稽核缺失改善流程\n\n```mermaid\nflowchart LR\n  A[督導巡點稽核] --> B{有缺失?}\n  B -- 否 --> Z[稽核完成]\n  B -- 是 --> C[系統開立改善單<br/>設定改善期限]\n  C --> D[總幹事回覆改善<br/>上傳照片]\n  D --> E{督導複查}\n  E -- 未通過 --> D\n  E -- 通過 --> Z\n  C -. 逾期未回覆 .-> F[通知區域經理]\n```\n\n### 5.5 合約到期提醒流程\n\n```mermaid\nflowchart LR\n  A[每日排程檢查合約到期日] --> B{剩餘天數}\n  B -- 90天 --> C[通知業務/督導]\n  B -- 60天 --> D[通知業務/督導/主管]\n  B -- 30天 --> E[儀表板紅色警示<br/>每日提醒]\n  C & D & E --> F[登記續約洽談結果]\n  F --> G{續約?}\n  G -- 是 --> H[建立新合約版本]\n  G -- 否 --> I[排定撤場與交接]\n```\n\n### 5.6 管理費收繳流程\n\n```mermaid\nflowchart TD\n  A[費率設定<br/>含生效日] --> B[每期產生應收帳單]\n  B --> C[列印/發送繳費通知]\n  C --> D{住戶繳費?}\n  D -- 櫃台現金 --> E1[櫃台收款 開立收據]\n  D -- 匯款/ATM --> E2[匯入銀行明細 自動對帳]\n  E1 --> F[沖銷帳單<br/>溢繳轉預收]\n  E2 --> F\n  E1 --> G[每日現金日結 總幹事簽收]\n  D -- 逾期未繳 --> H[列入欠費清單]\n  H --> I[催繳: 電話 → 催繳單 → 存證信函]\n  I --> J[登記催繳結果]\n  J --> D\n  F --> K[月結/年結封帳]\n  K --> L[收繳分析 & 管委會月報]\n```\n\n### 5.7 社區財務月報流程\n\n```mermaid\nflowchart TD\n  A[管理費收款<br/>自動入收入帳] --> D\n  B[總幹事登錄支出<br/>拍照憑證] --> C{金額級距}\n  C -- 小額 --> D[收支紀錄]\n  C -- 需管委會簽核 --> C2[列印請款單<br/>財委/主委紙本簽核] --> C3[上傳簽核影像] --> D\n  Z[零用金支用] --> D\n  D --> E[月底: 零用金盤點 + 銀行對帳]\n  E --> F{有差異?}\n  F -- 是 --> G[查明並調整] --> E\n  F -- 否 --> H[月結封帳]\n  H --> I[一鍵產出管委會月報 PDF]\n  I --> J[送交管委會 / 公告版張貼]\n  J --> K[後台財務總覽標記已送出]\n```\n\n---\n\n## 6. 核心資料模型（概念）\n\n```mermaid\nerDiagram\n  ORG_UNIT ||--o{ ORG_UNIT : \"子節點\"\n  ORG_UNIT ||--o{ SITE : \"包含\"\n  SITE ||--o{ CONTRACT : \"簽訂\"\n  SITE ||--o{ COMMITTEE : \"管委會屆別\"\n  SITE ||--o{ UNIT : \"戶別\"\n  SITE ||--o{ STAFFING_STD : \"人力編制\"\n  SITE ||--o{ EQUIPMENT : \"設備\"\n  SITE ||--o{ PATROL_POINT : \"巡邏點\"\n  EMPLOYEE ||--o{ ASSIGNMENT : \"派駐\"\n  SITE ||--o{ ASSIGNMENT : \"被派駐\"\n  EMPLOYEE ||--o{ CERTIFICATE : \"證照\"\n  EMPLOYEE ||--o| USER_ACCOUNT : \"登入帳號\"\n  USER_ACCOUNT }o--o{ ROLE : \"擁有\"\n  EMPLOYEE ||--o{ SCHEDULE : \"班表\"\n  EMPLOYEE ||--o{ LEAVE_REQUEST : \"請假\"\n  UNIT ||--o{ RESIDENT : \"住戶\"\n  UNIT ||--o{ OWNER : \"區權人(含歷任)\"\n  UNIT ||--o{ PARKING : \"車位\"\n  UNIT ||--o{ PACKAGE : \"包裹\"\n  SITE ||--o{ REPAIR_ORDER : \"報修\"\n  SITE ||--o{ INCIDENT : \"事件\"\n  SITE ||--o{ AUDIT_RECORD : \"稽核\"\n  AUDIT_RECORD ||--o{ IMPROVEMENT : \"改善單\"\n  SITE ||--o{ SHIFT_LOG : \"交接日誌\"\n  SITE ||--o{ VISITOR_LOG : \"訪客\"\n  SITE ||--o{ FEE_RATE : \"費率版本\"\n  UNIT ||--o{ BILL : \"應收帳單\"\n  UNIT ||--o{ PAYMENT : \"收款\"\n  PAYMENT ||--o{ PAYMENT_ALLOC : \"沖銷\"\n  BILL ||--o{ PAYMENT_ALLOC : \"被沖銷\"\n  PAYMENT ||--o| RECEIPT : \"收據\"\n  SITE ||--o| FEE_SETTING : \"款項流向/收據名義\"\n  SITE ||--o{ REMITTANCE : \"撥付管委會\"\n  SITE ||--o{ FUND_ACCOUNT : \"資金帳戶\"\n  SITE ||--o{ ACCOUNT_TITLE : \"會計科目\"\n  FUND_ACCOUNT ||--o{ LEDGER_ENTRY : \"收支紀錄\"\n  ACCOUNT_TITLE ||--o{ LEDGER_ENTRY : \"歸屬科目\"\n  SITE ||--o{ PERIOD_CLOSE : \"月結封帳\"\n  SITE ||--o{ BUDGET : \"年度預算\"\n  CONTRACT ||--o{ SERVICE_INVOICE : \"服務費請款\"\n  SITE ||--o{ SITE_COST : \"成本歸集\"\n  EMPLOYEE ||--o{ SITE_COST : \"人事成本分攤\"\n  POSITION_COST ||--o{ SITE_COST : \"標準成本\"\n  SITE ||--o{ SITE_PNL_MONTHLY : \"月損益彙總\"\n  UNIT ||--o{ DUNNING : \"催繳紀錄\"\n```\n\n### 6.1 主要實體說明\n\n| 實體 | 說明 | 關鍵欄位 |\n|---|---|---|\n| ORG_UNIT 組織節點 | 公司內部自訂層級（樹狀，層數不限） | 名稱、層級名稱、上層節點、主管、路徑（加速查詢子節點） |\n| SITE 社區 | 簽約服務的案場 | 名稱、地址、座標、戶數、狀態、所屬組織節點、督導 |\n| CONTRACT 合約 | 社區服務合約，可多版本 | 合約號、起訖日、服務項目、月費、約定人力、狀態 |\n| COMMITTEE 管委會 | 社區管委會屆別與成員 | 屆別、任期、成員職稱、聯絡方式 |\n| EMPLOYEE 員工 | 公司所有員工 | 工號、姓名、職稱、到離職日、雇用類型 |\n| ASSIGNMENT 派駐 | 員工派駐到社區的紀錄 | 員工、社區、職位、起訖日、是否主要派駐 |\n| CERTIFICATE 證照 | 員工證照 | 類別、證號、發證日、到期日、附件 |\n| USER_ACCOUNT 帳號 | 登入帳號，綁定員工 | 帳號、可登入端（前台/後台）、狀態、2FA |\n| SCHEDULE 班表 | 排班 | 日期、班別、社區、員工、狀態（打卡 ATTENDANCE 暫緩） |\n| UNIT 戶別 | 每一戶 | 棟/樓/號、類型、坪數（計費坪數）、應繳管理費、例外金額 |\n| OWNER 區權人 | 戶別所有權人，保留歷任 | 姓名、身分證/統編（加密）、聯絡方式、持分、取得/過戶日 |\n| PARKING 車位 | 車位資料 | 編號、類型、產權、坪數、車位管理費、所屬戶別 |\n| RESIDENT 住戶 | 實際居住者 | 自住/租客、聯絡方式（加密）、是否為繳費人 |\n| REPAIR_ORDER 報修 | 報修工單 | 來源、類別、地點、狀態、處理人、時間軸 |\n| INCIDENT 事件 | 異常事件通報 | 類別、等級、時間、處理紀錄 |\n| AUDIT_RECORD / IMPROVEMENT | 稽核與改善單 | 範本、評分、缺失、改善期限、狀態 |\n| FEE_RATE 費率 | 社區收費項目與費率，依生效日分版本 | 項目、計費方式、單價、週期、生效日、決議依據 |\n| BILL 應收帳單 | 每戶每期應繳 | 戶別、期別、項目、金額、調整、狀態（未繳/部分/已繳/作廢） |\n| PAYMENT / PAYMENT_ALLOC | 收款與沖銷明細 | 收款方式、金額、日期、經手人；沖銷到哪幾期帳單 |\n| RECEIPT 收據 | 收據 | 連號編號、開立/作廢紀錄 |\n| FEE_SETTING 收費設定 | 每社區的款項流向與收據名義 | 流向（管委會/公司）、收款帳戶、收據抬頭、統編、字軌、生效日 |\n| REMITTANCE 撥付 | 公司代收後撥付管委會 | 撥付日、涵蓋期間、金額、憑證 |\n| ACCOUNT_TITLE 會計科目 | 每社區科目表 | 代碼、名稱、收入/支出、是否公基 |\n| FUND_ACCOUNT 資金帳戶 | 專戶、公基、定存、零用金 | 類型、銀行、帳號、期初餘額 |\n| LEDGER_ENTRY 收支紀錄 | 每一筆收入/支出/轉帳 | 日期、科目、帳戶、金額、廠商、憑證、簽核狀態、來源（手動/管理費/報修） |\n| PERIOD_CLOSE 封帳 | 月結/年結紀錄 | 期間、封帳人、時間、月報是否已送出 |\n| BUDGET 預算 | 年度各科目預算 | 年度、科目、金額 |\n| SERVICE_INVOICE 服務費請款 | 公司向管委會請款 | 合約、期間、應收、實收、收款日 |\n| POSITION_COST 職位標準成本 | 各職位每月標準成本（年度版本） | 職位、年度、薪資、保險、勞退、提撥 |\n| SITE_COST 社區成本 | 歸集到社區的成本 | 社區、月份、類型（人事/直接/分攤）、金額、來源 |\n| SITE_PNL_MONTHLY 月損益彙總 | 預先計算的社區月損益 | 社區、月份、收入、成本、毛利、毛利率 |\n| DUNNING 催繳 | 催繳紀錄 | 日期、方式、對象、結果、承諾繳款日 |\n\n> **資料邊界原則**：所有社區作業資料（住戶、包裹、訪客、報修…）都必須帶 `site_id`，API 層強制依登入者的派駐範圍過濾，避免跨社區資料外洩。\n\n---\n\n## 7. 非功能需求\n\n### 7.1 資安與個資\n\n| 編號 | 需求 |\n|---|---|\n| NF-SEC-01 | 全站 HTTPS；密碼以 bcrypt/Argon2 雜湊儲存 |\n| NF-SEC-02 | 敏感欄位（身分證字號、住戶電話、車牌）資料庫加密儲存、畫面遮罩 |\n| NF-SEC-03 | 符合《個人資料保護法》：蒐集告知、目的限定、匯出留痕、離職/解約後資料保存期限與刪除機制 |\n| NF-SEC-04 | 後台登入需雙因子驗證；可設定僅允許公司 IP 登入（選配） |\n| NF-SEC-05 | Session 逾時自動登出（後台 30 分鐘）；前台櫃台模式閒置自動鎖定，以 PIN 碼解鎖 |\n| NF-SEC-06 | 完整稽核日誌保存至少 1 年 |\n| NF-SEC-07 | 解約社區的資料：唯讀封存，依合約約定期限後刪除或移交管委會 |\n\n### 7.2 可用性與效能\n\n| 編號 | 需求 |\n|---|---|\n| NF-PERF-01 | 一般頁面回應時間 < 2 秒；報表查詢 < 10 秒 |\n| NF-PERF-02 | 系統可用率 ≥ 99.5% |\n| NF-PERF-03 | **不預設社區數量上限**，系統以可水平擴充為前提設計，社區數量可能非常多（數百至數千個以上），效能不可隨社區增加而明顯下降 |\n| NF-PERF-04 | 每日自動備份，保留 30 天；異地備份 |\n| NF-PERF-05 | 應用服務無狀態（Stateless），可依負載增加主機數量（水平擴充），搭配負載平衡 |\n| NF-PERF-06 | 所有作業資料以 `site_id` 為分區鍵建立索引；資料量大時可依社區或年度分割資料表（Partition），必要時可分庫 |\n| NF-PERF-07 | 所有列表一律分頁查詢（伺服器端分頁），禁止一次載入全部資料 |\n| NF-PERF-08 | 跨社區統計（儀表板、收繳分析、人力統計）採**預先彙總**：排程或事件觸發計算彙總表，查詢時讀彙總結果，不即時掃描明細 |\n| NF-PERF-09 | 大型報表與匯出改為**非同步背景產生**，完成後通知下載，避免佔用線上資源 |\n| NF-PERF-10 | 讀寫分離：報表與分析查詢走唯讀副本資料庫；熱門資料（代碼表、權限、社區基本資料）使用快取 |\n| NF-PERF-11 | 冷熱資料分層：已封帳的歷年帳務、超過保存期的巡邏/訪客/包裹紀錄移至歸檔儲存，仍可查詢 |\n| NF-PERF-12 | 照片與檔案存放物件儲存並經 CDN 提供，上傳時自動壓縮與產生縮圖 |\n| NF-PERF-13 | 上線前需進行壓力測試，以「大量社區 × 交班時段巡邏/交接尖峰」與「月初帳單批次產生」為主要情境 |\n\n### 7.3 使用體驗\n\n| 編號 | 需求 |\n|---|---|\n| NF-UX-01 | 前台 RWD，手機單手可操作；大按鈕、少輸入（多用選單、掃碼、拍照） |\n| NF-UX-02 | 前台支援安裝為 PWA（加到主畫面），可接收推播 |\n| NF-UX-03 | 網路不穩時，巡邏打點可離線暫存、恢復後上傳（P1） |\n| NF-UX-04 | **多語系**：有外籍員工，前台需支援多語系切換（系統採 i18n 架構，介面文字不寫死）；前台語系：**繁體中文、英文、印尼文、越南文、泰文**；後台以繁體中文為主。使用者可自選語系，系統記住偏好；代碼表（如報修類別）也需支援多語名稱 |\n| NF-UX-05 | **長輩友善**（年長員工多）：前台預設大字級（≥ 18px）、大按鈕、高對比；常用作業 3 步內完成；多用選單、掃碼、拍照取代打字；圖示一律搭配文字 |\n| NF-UX-06 | **櫃台共用電腦**：支援「櫃台模式」，同一台裝置可快速切換使用者（工號＋PIN 碼），交班時一鍵登出；閒置自動鎖定；每筆資料記錄實際操作人 |\n| NF-UX-07 | 前台提供操作教學（圖文/短影片），並由總幹事負責現場教育訓練 |\n\n---\n\n## 8. 技術架構\n\n> 2026-11-07 更新：技術選型與架構已確定，與 SaaS 版共用同一套設計，詳見《SaaS 版技術需求書》（`saas/社區管理系統SaaS版技術需求書.md`）。單一公司導入時，相當於 SaaS 版的「單一租戶模式」（SaaS 版需求書 5.11）。\n\n| 層級 | 選擇 | 說明 |\n|---|---|---|\n| 前端 | Vue 3＋TypeScript（前後端分離） | 依使用情境分成後台、LINE 前台、網頁前台（櫃台／PWA）分開建置；後台元件庫 Element Plus，LINE 前台與行動版 Vant |\n| 後端 | .NET 10 LTS（ASP.NET Core） | DDD 模組化單體：依業務切成模組（現場作業、人事與出勤、品質稽核、廠商與合約、社區帳務、社區財務、組織與社區、經營分析等）；認證服務獨立部署 |\n| 資料庫 | PostgreSQL 17 以上 | 免授權費、各家雲端皆有託管服務，也可安裝在公司自有主機 |\n| 快取與即時更新 | Redis、SignalR | 跨畫面即時更新、權限與代碼表快取 |\n| 背景工作 | Hangfire | 帳單批次、PDF 月報、匯出、LINE 推播（緊急推播獨立佇列） |\n| 檔案儲存 | 物件儲存（雲端或自有主機的 S3 相容服務） | 照片、合約掃描檔、文件；以短效簽章網址存取 |\n| 通知 | LINE 官方帳號 Messaging API、Email、Web Push | LINE Notify 已停止服務，改用官方帳號 |\n| 部署 | Docker 容器 | 雲端或公司自有主機皆可；部署方式仍待確認（Q12） |\n\n**品質要求**：效能與可維護性優先；開發過程須遵守嚴格的開發規範，並通過弱點掃描、壓力測試與資安測試（標準見技術需求書第 6～8 章）。\n---\n\n## 9. 分期建議\n\n| 期別 | 範圍 | 目標 |\n|---|---|---|\n| **第一期 MVP** | 所有 P0：社區/合約/員工/證照/派駐、排班、請假、督導稽核、事件通報、報修、包裹、訪客、交接日誌、巡邏、公告、基本報表、權限、**管理費（費率、帳單、櫃台收款、收據、催繳、歷年紀錄、封帳、收繳分析）**、**社區財務與財報（科目、收支、簽核、零用金、對帳、封帳、管委會月報、年度決算、歷年比較）**、**公司經營分析（服務費應收、標準人事成本、社區/組織損益、虧損警示、營收趨勢、人力達成率）** | 讓總公司掌握「社區、合約、人、收繳」，讓現場完成「交接、包裹、訪客、報修、通報、收費」 |\n| **第二期** | 所有 P1：設備保養、公設預約、代班支援、加班、廠商管理、清潔檢核、離線模式、合約審核與請款登記、銀行明細自動對帳、滯納金、進階收繳分析、社區預算與支出分析、支票管理、經營分析進階（間接成本分攤、人效、續約分析、調價與報價試算、經營月報、年度目標） | 深化營運管理與品質量化 |\n| **第三期（擴充）** | P2 及以下：虛擬帳號與線上繳費、薪資計算串接、滿意度調查、社區地圖、BI 分析 | 金流自動化與決策分析 |\n\n---\n\n## 10. 待確認事項（請業主回覆）\n\n| # | 問題 | 影響範圍 |\n|---|---|---|\n| Q1 | ~~社區數量多少？~~ **已確認：不預設數量，以效能與可擴充為前提設計**（見 NF-PERF-03～13） | 系統規模、架構 |\n| Q2 | ~~人員是否分屬不同公司？~~ **已確認：同一家公司**，員工與合約不需區分法人 | 員工/合約 |\n| Q3 | ~~是否有區域與督導制度？~~ **已確認：組織層級要可自訂**，採樹狀組織架構（見 B-SYS-07～09） | 權限範圍設計 |\n| Q4 | ~~打卡方式？~~ **已確認：打卡系統暫時不做**，相關需求標記「暫緩」 | 出勤模組 |\n| Q5 | 目前是否已有人事薪資系統？班表、請假資料是否需要匯出給它？格式為何？ **狀態：應該有，待與業主討論後補充** | 系統介接 |\n| Q6 | ~~管理費是否納入系統？~~ **已確認：納入**，需有歷年紀錄與收繳分析（見 3.11）。**款項流向與收據名義：依社區不同**（見 B-FEE-05a～05c）。**歷史資料：全部匯入**（見 B-FEE-25～25c）。 | 管理費模組 |\n| Q7 | ~~管委會是否需要登入？~~ **已確認：不需要**。管委會所需報告由總幹事匯出 PDF / 列印提供（如 B-FEE-35 管委會月報） | 角色設計 |\n| Q8 | ~~是否需要住戶端？~~ **已確認：不需要**，不規劃住戶 App / LINE 住戶服務 | 系統範圍 |\n| Q9 | ~~員工特性？~~ **已確認：年長員工多、有外籍員工、櫃台共用電腦**（見 NF-UX-04～07）。**語系：繁中、英、印尼、越南、泰文**。 | UI 設計與語系 |\n| Q10 | ~~既有資料匯入？~~ **已確認：社區與合約、員工與證照、住戶與車位、設備與廠商都要匯入**（見 B-SYS-10）；住戶不需磁扣資料 | 資料轉移工作量 |\n| Q11 | 預算範圍與期望上線時間？ **狀態：尚未決定，待與業主討論**（技術選型已確定，見第 8 章） | 分期 |\n| Q12 | 系統部署偏好：雲端或自有機房？ **狀態：尚未決定，待與業主討論**（考量社區數量可能很多，建議雲端以便水平擴充） | 架構與維運 |\n| Q13 | ~~社區財報？~~ **已確認：納入社區（管委會）財報**（見 3.12、4.15）。記帳模式依社區不同；支出簽核級距每社區自訂；月報含財務報表、工作報告、應付未付清單、憑證影本；不做發票與報稅 | 社區財務模組 |\n| Q14 | ~~公司經營分析？~~ **已確認：納入**（見 3.13）。人事成本第一期採職位標準成本；毛利警示門檻可設定；間接成本：社區只算毛利、督導成本掛組織節點、總公司費用在全公司扣除，第二期再提供可設定的淨利分攤 | 經營分析模組 |\n\n---\n\n## 附錄 A：前後台選單結構\n\n### 後台選單\n\n```\n總公司管理平台\n├─ 儀表板\n├─ 社區管理\n│   ├─ 社區列表 / 社區詳情（基本資料、管委會、人力編制、設施、設備、文件）\n│   └─ 組織架構（樹狀自訂層級）\n├─ 合約管理\n│   ├─ 合約列表\n│   └─ 到期追蹤\n├─ 人事管理\n│   ├─ 員工列表 / 員工詳情（基本資料、證照、派駐、訓練、獎懲）\n│   ├─ 派駐調度\n│   └─ 證照到期\n├─ 排班請假\n│   ├─ 班別設定\n│   ├─ 排班表\n│   └─ 請假 / 加班審核\n├─ 督導稽核\n│   ├─ 稽核範本\n│   ├─ 巡點紀錄\n│   └─ 改善單追蹤\n├─ 營運總覽\n│   ├─ 報修工單\n│   ├─ 事件通報\n│   └─ 廠商管理\n├─ 管理費\n│   ├─ 費率設定（含歷年版本）\n│   ├─ 帳單開立 / 調整\n│   ├─ 收款與收據\n│   ├─ 銀行對帳（P1）\n│   ├─ 欠費與催繳\n│   ├─ 歷年紀錄 / 封帳\n│   └─ 收繳分析\n├─ 社區財務\n│   ├─ 科目 / 資金帳戶 / 公共基金\n│   ├─ 收入 / 支出 / 簽核\n│   ├─ 零用金\n│   ├─ 銀行對帳 / 封帳\n│   ├─ 財務報表（月報、年度決算、歷年比較）\n│   ├─ 預算（P1）\n│   └─ 財務總覽（各社區封帳與月報狀態）\n├─ 經營分析（限主管/財務）\n│   ├─ 服務費應收 / 請款收款\n│   ├─ 成本設定（職位標準成本、其他直接成本、間接分攤）\n│   ├─ 社區損益 / 組織損益\n│   ├─ 營收趨勢 / 續約分析 / 人力達成率\n│   └─ 調價試算 / 新案報價試算（P1）\n├─ 公告文件\n├─ 報表中心\n└─ 系統設定（帳號、角色權限、代碼表、通知、稽核日誌）\n```\n\n### 前台選單\n\n```\n社區工作站\n├─ 工作台（今日班表、待辦、快捷鍵）\n├─ 我的班表（班表、請假）\n├─ 交接日誌\n├─ 包裹管理\n├─ 訪客登記\n├─ 報修工單\n├─ 巡邏打點\n├─ 事件通報\n├─ 住戶資料\n├─ 管理費（查詢、收款、收據、日結、催繳）\n├─ 社區財務（支出登錄、零用金、請款單、月報產出）\n├─ 公設預約（P1）\n├─ 設備保養（P1）\n├─ 公告（公司公告 / 社區公告）\n└─ 改善單（總幹事）\n```\n";

function setTheme(){
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try{localStorage.setItem('pcmp-theme', r.dataset.theme)}catch(e){}
}
try{const t=localStorage.getItem('pcmp-theme'); if(t) document.documentElement.dataset.theme=t;}catch(e){}

const content=document.getElementById('content');
content.innerHTML = marked.parse(MD);

// 表格外包捲動容器
content.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='table-wrap';t.before(w);w.appendChild(t);});

// 優先級徽章
content.querySelectorAll('td').forEach(td=>{
  const m = td.textContent.trim().match(/^P([012])$/);
  if(m){ td.innerHTML='<span class="badge p'+m[1]+'">P'+m[1]+'</span>'; td.parentElement.dataset.p='P'+m[1]; }
});
content.querySelectorAll('strong').forEach(s=>{
  const m=s.textContent.trim().match(/^P([012])$/); if(m) s.outerHTML='<span class="badge p'+m[1]+'">P'+m[1]+'</span>';
});

// 優先級篩選
document.querySelectorAll('.filter input').forEach(cb=>cb.addEventListener('change',()=>{
  const on=[...document.querySelectorAll('.filter input:checked')].map(c=>c.dataset.p);
  content.querySelectorAll('tr[data-p]').forEach(tr=>tr.classList.toggle('hidden',!on.includes(tr.dataset.p)));
}));

// 目錄
const toc=document.getElementById('toc');
content.querySelectorAll('h2,h3').forEach((h,i)=>{
  h.id='sec-'+i;
  const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.className=h.tagName.toLowerCase();
  a.onclick=()=>document.querySelector('nav').classList.remove('open');
  toc.appendChild(a);
});
const links=[...toc.querySelectorAll('a')];
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+e.target.id));}
}),{rootMargin:'0px 0px -75% 0px'});
content.querySelectorAll('h2,h3').forEach(h=>io.observe(h));

// Mermaid 流程圖
content.querySelectorAll('pre code.language-mermaid').forEach(c=>{
  const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.parentElement.replaceWith(d);
});
mermaid.initialize({startOnLoad:false,theme:'default',securityLevel:'strict'});
mermaid.run({querySelector:'.mermaid'});
</script>
