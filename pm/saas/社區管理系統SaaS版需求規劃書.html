<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>物業社區管理平台：SaaS 版需求規劃書</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1f2933; --muted:#5f6b7a; --border:#e1e5ea;
  --accent:#1f6f5c; --accent-soft:#e3f1ec; --code:#f0f2f5;
  --p0:#b42318; --p0-bg:#fde8e7; --p1:#9a5b00; --p1-bg:#fdf1dc; --p2:#3b5b8a; --p2-bg:#e6edf7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171b; --panel:#1c2026; --text:#e4e7eb; --muted:#9aa5b1; --border:#2e343c;
    --accent:#5cc4a6; --accent-soft:#1d3530; --code:#252a31;
    --p0:#ff8a80; --p0-bg:#3a1f1e; --p1:#ffc266; --p1-bg:#3a2e17; --p2:#9ab8e6; --p2-bg:#1f2a3a;
  }
}
:root[data-theme="dark"]{
  --bg:#14171b; --panel:#1c2026; --text:#e4e7eb; --muted:#9aa5b1; --border:#2e343c;
  --accent:#5cc4a6; --accent-soft:#1d3530; --code:#252a31;
  --p0:#ff8a80; --p0-bg:#3a1f1e; --p1:#ffc266; --p1-bg:#3a2e17; --p2:#9ab8e6; --p2-bg:#1f2a3a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7;font-size:15px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px}
nav .brand{font-weight:700;font-size:16px;margin:0 6px 4px}
nav .sub{color:var(--muted);font-size:12px;margin:0 6px 14px}
nav a{display:block;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px;font-size:13.5px}
nav a.h3{padding-left:22px;font-size:12.5px}
nav a:hover,nav a.active{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;gap:6px;margin:0 6px 14px}
.tools button{flex:1;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;padding:5px;font-size:12px;cursor:pointer}
main{padding:32px 40px 80px;max-width:1180px}
h1{font-size:28px;margin:0 0 18px;border-bottom:3px solid var(--accent);padding-bottom:10px}
h2{font-size:22px;margin:44px 0 14px;padding:8px 14px;background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:4px;scroll-margin-top:16px}
h3{font-size:17px;margin:28px 0 10px;color:var(--accent);scroll-margin-top:16px}
p,li{color:var(--text)}
hr{border:0;border-top:1px solid var(--border);margin:28px 0}
blockquote{margin:14px 0;padding:10px 16px;background:var(--panel);border-left:4px solid var(--muted);color:var(--muted);border-radius:4px}
blockquote p{margin:0;color:var(--muted)}
.table-wrap{overflow-x:auto;margin:12px 0 18px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--code);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}
code{background:var(--code);padding:1px 6px;border-radius:4px;font-size:13px;font-family:Consolas,"Cascadia Mono",monospace}
pre{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;line-height:1.5}
pre code{background:none;padding:0}
.mermaid{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;margin:14px 0;overflow-x:auto;text-align:center}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.p0{color:var(--p0);background:var(--p0-bg)}
.badge.p1{color:var(--p1);background:var(--p1-bg)}
.badge.p2{color:var(--p2);background:var(--p2-bg)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:0 6px 14px}
.filter label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
tr.hidden{display:none}
.menu-btn{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{position:fixed;inset:0 30% 0 0;z-index:10;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 24px rgba(0,0,0,.25)}
  nav.open{transform:none}
  main{padding:60px 16px 60px}
  .menu-btn{display:block;position:fixed;top:12px;left:12px;z-index:11;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px}
  h1{font-size:22px}
}
@media print{
  nav,.menu-btn{display:none}
  .layout{display:block}
  main{max-width:none;padding:0}
  h2{break-after:avoid}
  .table-wrap,.mermaid{break-inside:avoid}
}
</style>
</head>

<script>
const MD = "# 物業社區管理平台 SaaS 版 — 需求規劃書\n\n| 項目 | 內容 |\n|---|---|\n| 文件版本 | v0.7（新增企業方案：單一租戶部署與授權、3 年預付） |\n| 撰寫日期 | 2026-11-06 |\n| 文件狀態 | 需求草案，待訪談與試用驗證後調整 |\n| 基礎文件 | 原需求規劃書 v0.5（`../社區管理系統需求規劃書.md`），以下簡稱「**原需求書**」 |\n| 相關文件 | 《SaaS 商業計畫書》（`SaaS商業計畫書.md`） |\n\n---\n\n## 1. 文件說明\n\n### 1.1 撰寫方式\n\n原需求書是為**單一物業公司**規劃的。評估後，大部分功能可以直接用在 SaaS（見第 2 章），因此本文件採**差異式**撰寫：\n\n- **沿用**：原需求書第 3、4 章的功能需求（`B-*`、`F-*` 編號）原則上沿用，編號不變，本文件不重複列出。\n- **調整**：需要因 SaaS 修改的原需求，列在第 6 章，並標明原編號。\n- **新增**：SaaS 平台本身需要的功能（租戶、訂閱、計費、LINE 前台、使用率監控等），以新編號列在第 5 章。\n- **方案歸屬**：每個模組屬於哪個版本，列在第 7 章。\n\n> 閱讀時請搭配原需求書。若兩份文件有衝突，**以本文件為準**。\n\n### 1.2 名詞定義\n\n| 名詞 | 說明 |\n|---|---|\n| **平台** | 本 SaaS 服務本身，由我方營運 |\n| **租戶（Tenant）** | 一個訂閱客戶，通常是一家物業公司或一個物業集團 |\n| **法人** | 租戶底下實際簽約、雇用員工的公司。一個租戶可有多個法人（例：同集團的保全公司與物業管理公司） |\n| **方案** | 訂閱內容，由「版本（基本／專業／旗艦）」與「社區數級距」組成 |\n| **功能授權** | 依方案決定租戶可使用哪些模組 |\n| **LINE 前台** | 社區工作人員透過 LINE 官方帳號的圖文選單與 LIFF 頁面操作前台功能 |\n| **平台營運後台** | 平台營運方（我們）使用的管理系統，管理租戶、方案、帳務、推薦夥伴、客服、內容與系統 |\n| **推薦夥伴** | 介紹客戶給平台並收取佣金的個人或公司（例：業主） |\n\n### 1.3 需求編號規則\n\n| 前綴 | 範圍 |\n|---|---|\n| `P-ENT-*` | 企業方案（買斷）：單一租戶部署、授權控管、更新維護（見 5.11） |\n| `B-*`、`F-*` | 沿用原需求書；`B-VND-*` 為本文件新增的社區廠商與合約管理（見 5.10） |\n| `P-*` | 本文件新增的平台需求：租戶端（P-TEN 租戶、P-SUB 訂閱、P-BILL 計費、P-ONB 導入、P-LINE LINE 前台、P-PAY 出勤與薪資資料、P-ADOPT 使用率、P-EXIT 退租、P-HELP 教學）；平台營運後台（P-DASH 儀表板、P-CRM 客戶開發、P-OPS 租戶管理、P-PTN 推薦夥伴、P-SUP 客服、P-CMS 內容管理、P-MON 系統監控、P-ADM 平台設定） |\n| `NF-SAAS-*`、`NF-REG-*`、`NF-AUTH-*`、`NF-SVC-*`、`NF-BAK-*`、`NF-PF-*` | 本文件新增的非功能需求：SaaS 共通、註冊與開通、登入與身分驗證、系統服務資安、系統備份、效能（見第 8 章） |\n\n優先級沿用原需求書：**P0** = SaaS 上市必要、**P1** = 第二期、**P2** = 未來擴充。\n\n> **資安與效能最優先**：第 8 章所有 P0 項目都是上線門檻，不得因時程延後（見 8.1）。\n\n---\n\n## 2. 原功能 SaaS 化評估\n\n### 2.1 評估結論\n\n1. **原功能大多可直接沿用**。原需求書在設計時已具備多項 SaaS 必要條件：組織架構可自訂、所有資料以 `site_id` 為邊界、不預設社區數量上限、可水平擴充、記帳模式與收費設定可依社區個別調整、多語系。\n2. **需要補上的是「平台層」**：租戶隔離、訂閱與功能授權、計費、客戶導入、平台營運後台。這些原需求書沒有，因為原本只有一個客戶。\n3. **前台要重新設計入口**：業主不導入的原因是總幹事年長、學習曲線高。前台改以 **LINE 為主要入口**，原本的 PWA 網頁保留給櫃台模式與不使用 LINE 的人員。\n4. **原本「業主確認」的決策要重新決定或改成「租戶可設定」**：例如打卡（SaaS 版納入基本版）、薪資串接、法人數量（見 2.3）。\n5. **範圍要分版本**：原需求書 P0 範圍很大（含管理費、社區財務、經營分析）。SaaS 版拆成三個版本，基本版先上市（見第 7 章）。\n\n### 2.2 逐模組評估\n\n**評估等級說明**：\n\n- **A 直接沿用**：功能不用改，只需加上租戶隔離。\n- **B 參數化**：功能沿用，但原本寫死或業主確認的部分要改成租戶可設定，或提供平台預設範本。\n- **C 重新設計**：互動方式或架構需要明顯調整。\n- **D 延後／加購**：不放在上市範圍，或改為加購模組。\n\n#### 後台模組\n\n| 原模組 | 評估 | 說明 | 版本 |\n|---|---|---|---|\n| 3.1 儀表板 B-DASH | B | 依租戶的方案只顯示有授權的區塊；新增「使用率」區塊（P-ADOPT） | 基本 |\n| 3.2 社區管理 B-SITE | B | 沿用；新增「社區所屬法人」與「模組開關」（P-SUB-05）；社區數受方案級距控管 | 基本 |\n| 3.3 合約管理 B-CONT | B | 沿用；合約需指定簽約法人（同一社區的保全合約與物業合約可能由不同法人簽訂） | 基本 |\n| 3.4 員工／人事 B-EMP | B | 沿用；員工需指定所屬法人；證照類別改由平台提供預設清單，租戶可增修 | 基本 |\n| 3.5 排班與出勤 B-SCH | B | 沿用；原本暫緩的出勤紀錄、補卡審核、出勤報表（B-SCH-04/05/09）**改為 P0**，配合打卡納入基本版；出勤資料可標準匯出並串接薪資系統（P-PAY） | 基本 |\n| 3.6 督導稽核 B-AUD | B | 沿用；平台提供**稽核範本庫**（物業、保全、清潔常用範本），租戶可複製後修改 | 專業 |\n| 3.7 工單與事件 B-OPS | A | 沿用；B-OPS-05 廠商管理併入新增的「社區廠商與合約管理」（5.10） | 基本 |\n| 3.8 公告與文件 B-DOC | A | 沿用；平台另需「平台公告」（版本更新、維護通知），見 P-OPS | 基本 |\n| 3.9 報表中心 B-RPT | B | 沿用；報表依方案授權顯示；大型匯出需依租戶排隊，避免影響其他租戶 | 基本／專業 |\n| 3.10 系統設定 B-SYS | C | 帳號、角色、代碼表改為「平台預設＋租戶覆寫」；通知設定改由 P-LINE 與通知中心處理；資料匯入中心是**導入關鍵**，提升為平台核心能力 | 基本 |\n| 3.11 管理費收繳 B-FEE | B | 功能沿用；原本已可依社區設定款項流向與收據名義，適合多客戶；收據抬頭可選法人 | 旗艦／加購 |\n| 3.12 社區財務 B-FIN | B | 功能沿用；平台提供預設會計科目表；記帳模式本來就可依社區設定 | 旗艦／加購 |\n| 3.13 公司經營分析 B-BIZ | B | 沿用；新增「依法人」檢視損益；職位標準成本由租戶自行設定，平台提供範本 | 旗艦 |\n\n#### 前台模組\n\n| 原模組 | 評估 | 說明 | 版本 |\n|---|---|---|---|\n| 4.1 工作台 F-HOME | C | 改為 **LINE 圖文選單**（依角色顯示不同選單）；櫃台模式保留網頁版工作台 | 基本 |\n| 4.2 班表與請假 F-ATT | C | 班表查詢、請假申請改為 LIFF 頁面；**打卡納入基本版**（LIFF 以 GPS 範圍或掃社區 QR Code 打卡，見 P-LINE-12） | 基本 |\n| 4.3 交接班日誌 F-SHIFT | C | 改為 LIFF 頁面，提供常用範本與語音輸入；接班人在 LINE 一鍵確認 | 基本 |\n| 4.4 住戶資料 F-RES | B | 基本版只需「戶別清單」（供包裹、報修選戶別）；區權人、坪數、應繳管理費等完整欄位屬旗艦版 | 基本（戶別）／旗艦或加購（完整） |\n| 4.5 包裹 F-PKG | A | 沿用；櫃台多為共用電腦，以網頁版為主，LINE 提供查詢 | 基本 |\n| 4.6 訪客 F-VIS | A | 沿用；以網頁版櫃台模式為主 | 基本 |\n| 4.7 報修 F-REP | C | 改為 LIFF「拍照 → 選類別 → 送出」三步流程 | 基本 |\n| 4.8 巡邏打點 F-PAT | C | 掃碼改用 LIFF 開啟相機掃 QR Code；離線暫存需另行評估（LIFF 環境限制較多） | 專業 |\n| 4.9 設備保養與清潔 F-MNT | A | 沿用 | 專業 |\n| 4.10 公設預約 F-FAC | A | 沿用 | 專業 |\n| 4.11 事件通報 F-INC | C | 改為 LIFF「拍照 → 選等級 → 送出」；緊急事件以 LINE 推播通知督導 | 基本 |\n| 4.12 公告 F-NEWS | C | 公司公告改由 LINE 推送，點開即標記已讀 | 基本 |\n| 4.13 稽核改善回覆 F-AUD | C | 改善單以 LINE 通知總幹事，於 LIFF 頁面拍照回覆 | 專業 |\n| 4.14 管理費櫃台 F-FEE | A | 沿用；櫃台收款與列印收據以網頁版為主 | 旗艦／加購 |\n| 4.15 社區財務作業 F-FIN | B | 支出登錄、拍憑證可走 LIFF；封帳與月報產出以網頁版為主 | 旗艦／加購 |\n\n#### 非功能需求\n\n| 原章節 | 評估 | 說明 |\n|---|---|---|\n| 7.1 資安與個資 | C | 沿用並**大幅加嚴**：資安列為最高優先，新增風險評估、註冊／登入／系統服務資安、系統備份與上線門檻（見第 8 章） |\n| 7.2 可用性與效能 | B | 原本即以大量社區、水平擴充設計，適合多租戶；新增規模假設、尖峰估算、量化效能目標、租戶間資源公平與效能測試（見 8.7） |\n| 7.3 使用體驗 | B | 長輩友善、多語系、櫃台模式全部保留，且成為**產品主要賣點**；PWA 改為 LINE 的輔助管道 |\n| 8. 技術架構 | C | 部署確定採雲端多租戶；通知以 LINE 官方帳號為主（見第 3 章） |\n\n#### 統計\n\n| 評估 | 模組數 | 比例 |\n|---|---|---|\n| A 直接沿用 | 7 | 約 22% |\n| B 參數化 | 14 | 約 44% |\n| C 重新設計 | 11 | 約 34%（多數是前台改為 LINE，業務邏輯不變；另含資安大幅加嚴） |\n| 合計 | 32 | 後台 13、前台 15、非功能 4 |\n\n> 重新設計的部分主要是「**操作介面**」，資料模型與業務規則幾乎不變。後端 API 可以共用，LINE 前台與網頁前台呼叫同一套 API。\n\n### 2.3 原「業主確認」決策的 SaaS 處理方式\n\n原需求書第 10 章有許多依單一業主決定的事項，SaaS 版需重新處理：\n\n| 原題號 | 原決定 | SaaS 版處理 |\n|---|---|---|\n| Q1 社區數量 | 不設上限 | **沿用**；社區數改由方案級距控管（P-SUB-04） |\n| Q2 人員是否分屬不同公司 | 同一家公司 | **改為支援多法人**：一個租戶可有多個法人，員工、合約、收據可指定法人（P-TEN-04） |\n| Q3 組織層級 | 樹狀自訂 | **沿用**，每個租戶各自一棵組織樹 |\n| Q4 打卡 | 暫緩 | **納入基本版（P0）**：LIFF 以 GPS 範圍或掃社區 QR Code 打卡；原 B-DASH-03、B-SITE-09、B-SCH-04/05/09、B-RPT-03、F-ATT-01/02 由「暫緩」改為 P0 |\n| Q5 薪資系統 | 待確認 | **標準匯出（P0）＋串接常見薪資系統（P1）**：出勤、請假、加班資料提供標準格式匯出與欄位對應；另調查市場常用的 2～3 套薪資系統並直接串接（見 P-PAY） |\n| Q6 管理費 | 納入、依社區設定 | **沿用**，屬旗艦版 |\n| Q7 管委會登入 | 不需要 | **沿用**；管委會唯讀入口列為 P2 評估項目（可能成為加值功能） |\n| Q8 住戶端 | 不需要 | **沿用**，維持「服務物業公司本身」的定位 |\n| Q9 員工特性 | 年長、外籍、櫃台共用 | **沿用並強化**，是產品主要差異化 |\n| Q10 資料匯入 | 全部匯入 | **沿用**；匯入中心提升為平台核心，並提供平台人員代為匯入（P-ONB） |\n| Q11 預算與時程 | 未定 | 改由商業計畫書規劃 |\n| Q12 部署 | 未定 | **確定雲端多租戶**；60 個社區以上的企業方案可評估專屬環境（P2）；買斷以「企業方案」提供（5.11，第三期之後） |\n| Q13 社區財報 | 納入 | **沿用**，屬旗艦版 |\n| Q14 經營分析 | 納入 | **沿用**，屬旗艦版；新增依法人檢視 |\n\n---\n\n## 3. SaaS 系統架構\n\n### 3.1 架構示意\n\n```mermaid\nflowchart TB\n  subgraph Users[使用者]\n    U1[租戶幹部<br/>瀏覽器]\n    U2[社區工作人員<br/>LINE]\n    U3[櫃台<br/>共用電腦/平板]\n    U4[平台營運人員]\n  end\n  subgraph Front[前端]\n    W1[後台網頁<br/>總公司管理平台]\n    W2[LIFF 頁面<br/>LINE 前台]\n    W3[網頁前台<br/>櫃台模式/PWA]\n    W4[平台營運後台]\n  end\n  LINE[LINE 官方帳號<br/>Messaging API]\n  API[API 服務層<br/>租戶識別 / 功能授權 / 權限]\n  subgraph Data[資料層]\n    DB[(共用資料庫<br/>tenant_id + site_id)]\n    OBJ[(物件儲存<br/>依租戶分目錄)]\n  end\n  JOB[背景工作<br/>帳單/報表/推播排程]\n  PAY[金流 / 電子發票]\n  U1 --> W1 --> API\n  U2 --> LINE --> W2 --> API\n  LINE <--> API\n  U3 --> W3 --> API\n  U4 --> W4 --> API\n  API --> DB\n  API --> OBJ\n  API --> JOB\n  JOB --> LINE\n  API --> PAY\n```\n\n### 3.2 資料層級\n\n```\n平台\n└─ 租戶（物業公司／集團）  ← 訂閱與計費單位\n    ├─ 法人（保全公司、物業管理公司…）\n    └─ 組織樹（總公司 → 事業處 → 區 → 組，層級自訂）\n        └─ 社區  ← 原需求書的資料邊界\n            └─ 戶別、報修、包裹、帳務…\n```\n\n### 3.3 多租戶模式\n\n| 項目 | 決定 | 說明 |\n|---|---|---|\n| 資料庫 | **共用資料庫、共用資料表，以 `tenant_id` 區隔** | 維運成本最低，適合中小型客戶；原本的 `site_id` 邊界維持不變 |\n| 隔離機制 | 應用層強制過濾＋資料庫層 Row-Level Security 雙重保護 | 任何查詢都必須帶租戶條件，見 NF-SAAS-01 |\n| 檔案儲存 | 依租戶分目錄，存取一律透過短效簽章網址 | 避免猜網址讀到別的租戶檔案 |\n| 版本 | 所有租戶使用同一版本，以功能開關（Feature Flag）控制新功能逐步開放 | 不為個別客戶維護分支 |\n| 企業方案 | 專屬資料庫或專屬環境 | P2，視大型客戶需求再評估 |\n\n### 3.4 前台入口\n\n| 入口 | 使用者 | 使用情境 |\n|---|---|---|\n| **LINE（主要）** | 總幹事、保全、清潔、機電 | 個人手機操作：交接、報修、通報、請假、公告、改善單 |\n| **網頁前台（櫃台模式）** | 櫃台值班人員、秘書 | 共用電腦或平板：包裹、訪客、管理費收款、住戶查詢 |\n| **網頁前台（PWA）** | 不使用 LINE 的人員 | 與 LINE 功能相同的備援管道 |\n\n---\n\n## 4. 使用者角色\n\n### 4.1 平台角色（新增）\n\n| 角色代碼 | 角色 | 主要職責 | 資料範圍 |\n|---|---|---|---|\n| PLAT-ADMIN | 平台管理員 | 方案設定、租戶管理、系統參數、平台公告、平台人員帳號 | 全平台（不含租戶業務資料內容） |\n| PLAT-SALES | 業務 | 潛在客戶、試用申請、建立試用租戶、報價 | 自己負責的潛在客戶與租戶 |\n| PLAT-SUPPORT | 客服／導入人員 | 協助導入、資料匯入、問題排除、內容管理 | 僅限**租戶授權期間**的指定租戶 |\n| PLAT-FIN | 平台財務 | 訂閱帳單、收款對帳、發票、佣金撥付 | 全平台的訂閱、帳單與佣金資料 |\n| PARTNER | 推薦夥伴 | 查看自己推薦的客戶與佣金（P1 夥伴入口） | 僅限自己推薦的客戶，且只看名稱、階段、付費狀態 |\n\n> 平台人員**預設看不到**租戶的業務資料（住戶、員工、帳務）。客服需要協助時，必須由租戶管理者開啟限時授權（P-OPS-04），所有操作留下稽核紀錄。\n\n### 4.2 租戶角色\n\n沿用原需求書第 2 章所有角色（HQ-*、SITE-*），另新增：\n\n| 角色代碼 | 角色 | 主要職責 |\n|---|---|---|\n| TEN-OWNER | 租戶擁有者 | 訂閱方案、付款方式、帳單、發票資訊、授權平台客服存取；每個租戶至少一位 |\n\n> 原 HQ-ADMIN 改為「租戶系統管理員」，權限範圍限於自己的租戶。\n\n---\n\n## 5. 平台新增功能需求\n\n### 5.1 租戶管理（P-TEN）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-TEN-01 | 建立租戶：公司名稱、統編、聯絡人、租戶代碼（用於登入網址或識別），建立時自動產生租戶擁有者帳號 | P0 |\n| P-TEN-02 | 租戶狀態：試用中 / 正式 / 付款逾期 / 唯讀 / 停權 / 已終止，狀態變更保留紀錄 | P0 |\n| P-TEN-03 | 租戶基本設定：預設語系、時區、Logo（顯示於後台、LIFF 頁面、PDF 報表） | P0 |\n| P-TEN-04 | **多法人**：一個租戶可建立多個法人（名稱、統編、地址、印章圖檔）；員工、合約、收據抬頭可指定法人 | P0 |\n| P-TEN-05 | 租戶自訂網域（例：`ops.某公司.com.tw`） | P2 |\n\n### 5.2 訂閱與功能授權（P-SUB）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-SUB-01 | 方案定義（平台設定）：版本（基本／專業／旗艦）× 社區數級距；每個方案設定可用模組、社區數上限、儲存空間配額、LINE 推播配額 | P0 |\n| P-SUB-02 | **功能授權**：API 與畫面依租戶方案檢查模組權限；未授權的功能不顯示選單，直接呼叫 API 時回傳「未授權」 | P0 |\n| P-SUB-03 | 試用期：新租戶可設定試用天數（預設 30 天），期滿未付款轉為唯讀 | P0 |\n| P-SUB-04 | **社區數控管**：新增或啟用社區時檢查「服務中」社區數；超過級距時提示升級，或依設定自動升級並於次月計費 | P0 |\n| P-SUB-05 | **社區模組開關**：租戶可依社區開啟或關閉已授權的模組（例：A 社區只用報修與通報），讓客戶逐步導入 | P0 |\n| P-SUB-06 | 升級立即生效、按日計價補差額；降級於下一計費週期生效，降級前檢查是否有資料或社區超出新方案限制 | P1 |\n| P-SUB-07 | **加購模組**：基本版、專業版可單獨加購「社區帳務模組」（見 7.1）；加購依社區數級距計價，可隨時取消（於下一計費週期生效） | P0 |\n| P-SUB-08 | 方案異動歷史：每次變更記錄日期、異動前後方案、操作人 | P0 |\n\n### 5.3 計費與帳單（P-BILL）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-BILL-01 | 依方案自動產生訂閱帳單：月繳或年繳（年繳折扣由平台設定）；導入費等一次性費用可手動新增 | P0 |\n| P-BILL-02 | 付款方式：銀行轉帳（人工對帳）為 P0；信用卡定期定額自動扣款（串接國內金流服務）為 P1 | P0 |\n| P-BILL-03 | **電子發票**：串接電子發票加值服務，平台收款後自動開立並寄送 | P1 |\n| P-BILL-04 | 逾期處理：到期前 7 天提醒 → 逾期 7 天轉「付款逾期」並每日提醒 → 逾期 30 天轉「唯讀」 → 逾期 60 天「停權」；每個階段的天數由平台設定 | P0 |\n| P-BILL-05 | 租戶擁有者可在後台查看方案、帳單、付款紀錄、下載發票 | P0 |\n| P-BILL-06 | 用量顯示：本月 LINE 推播則數、儲存空間使用量，與方案配額比較 | P1 |\n\n### 5.4 客戶導入（P-ONB）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-ONB-01 | **導入精靈**：依序引導完成「公司與法人 → 組織架構 → 社區 → 員工 → 角色與帳號 → LINE 綁定」，顯示完成進度 | P0 |\n| P-ONB-02 | 資料匯入中心（沿用 B-SYS-10）：標準 Excel 範本、檢核報告、試算預覽、批次撤銷；平台客服可在授權期間代為匯入 | P0 |\n| P-ONB-03 | **平台範本庫**：新租戶建立時自動帶入預設的班別、報修類別、事件類別、證照類別、稽核範本、會計科目表、職位標準成本範本；租戶可修改，不影響平台範本 | P0 |\n| P-ONB-04 | 示範資料：試用租戶可一鍵產生示範社區與資料，方便體驗；正式使用前可一鍵清除 | P1 |\n| P-ONB-05 | 導入檢查清單：列出尚未完成的設定（例：有社區沒有派駐人員、有員工未綁定 LINE） | P1 |\n\n### 5.5 LINE 前台（P-LINE）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-LINE-01 | **官方帳號架構（第一期即支援兩種）**：A. 全平台共用官方帳號（訊息費由平台吸收，受 P-LINE-09 配額限制）；B. 租戶自有官方帳號（訊息費由租戶自行向 LINE 支付，帳號顯示租戶品牌，不受平台配額限制）。租戶可在導入時選擇，之後可切換（切換時員工需重新綁定） | P0 |\n| P-LINE-02 | **員工綁定**：後台為員工產生一次性邀請碼或 QR Code，員工加入官方帳號後掃碼完成綁定；綁定後 LINE 帳號對應到租戶與員工身分。離職時自動解除綁定 | P0 |\n| P-LINE-03 | 一個 LINE 帳號只能綁定一個租戶的一個員工；如需更換租戶（員工跳槽），須先由原租戶解除綁定 | P0 |\n| P-LINE-04 | **圖文選單依角色切換**：總幹事、保全、清潔、機電看到不同的選單按鈕；選單文字依員工語系顯示 | P0 |\n| P-LINE-05 | **LIFF 頁面**：上下班打卡、交接日誌、報修、事件通報、請假、班表、公告、改善單回覆、巡邏掃碼、支出拍照登錄；以原需求書對應功能的業務規則為準 | P0 |\n| P-LINE-06 | **三步原則**：報修、事件通報、交接日誌在 LIFF 上 3 步內完成；大按鈕、大字級、圖示配文字；支援語音輸入轉文字（P1） | P0 |\n| P-LINE-07 | 派駐多個社區者，LIFF 頁面開啟時先選社區，系統記住上次選擇 | P0 |\n| P-LINE-08 | **推播策略**：只對例外狀況即時推播（緊急事件、逾期工單、改善單）；一般待辦合併為每日摘要；推播對象與時段可由租戶設定 | P0 |\n| P-LINE-09 | **推播配額**：依方案設定每月推播配額；接近上限時通知租戶擁有者；超出後非緊急通知改為僅在 LIFF 待辦顯示，緊急事件仍照常推播 | P1 |\n| P-LINE-10 | 未綁定 LINE 的人員改以 Email 或 PWA 推播通知；重要通知可選擇以簡訊備援（P2） | P1 |\n| P-LINE-11 | **自有官方帳號設定精靈**：租戶輸入 Channel ID、Channel Secret、Access Token，系統自動設定 Webhook 並測試連線、建立 LIFF 頁面與圖文選單；**Channel Secret 與 Token 存放於金鑰管理服務，依租戶分開保存**（NF-SVC-07），畫面不再顯示原值 | P0 |\n| P-LINE-12 | **LIFF 打卡**：上下班打卡以 GPS 判斷是否在社區範圍內，或掃描社區 QR Code；可設定是否需拍照；不在範圍內時可選「範圍外打卡」並填原因，送主管確認；打卡紀錄進入出勤（B-SCH-04） | P0 |\n\n> LINE 官方帳號的訊息費用：回覆訊息與 LIFF 頁面操作不計費，只有主動推播計費。費用估算見商業計畫書 7.2。\n\n### 5.5.1 出勤與薪資資料（P-PAY）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-PAY-01 | **出勤標準匯出**：依期間、法人、社區匯出出勤、請假、加班、補卡資料（CSV／Excel），可排程每月自動產生 | P0 |\n| P-PAY-02 | **欄位對應設定**：租戶可設定匯出欄位名稱、順序、假別代碼對應，儲存為範本 | P0 |\n| P-PAY-03 | **串接常見薪資系統**：調查市場常用的 2～3 套薪資系統後直接串接（API 或該系統的匯入格式）；串接金鑰依租戶存放於金鑰管理服務 | P1 |\n| P-PAY-04 | 匯出與串接紀錄：每次匯出或傳送的期間、筆數、操作人、結果，寫入稽核日誌 | P0 |\n\n### 5.6 使用率監控（P-ADOPT）\n\n> 這是回應「導入後使用率偏低」顧慮的**核心功能**，也是對老闆的主要賣點之一。\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-ADOPT-01 | **租戶使用率儀表板**：依社區、員工顯示近 7／30 天的活躍天數、各功能使用次數（交接日誌、報修、通報、巡邏等） | P0 |\n| P-ADOPT-02 | 低使用率警示：社區連續 N 天（預設 3 天）沒有交接日誌或任何操作時，通知負責督導；N 可由租戶設定 | P0 |\n| P-ADOPT-03 | LINE 綁定率：各社區派駐人員中已綁定 LINE 的比例 | P0 |\n| P-ADOPT-04 | 導入進度：新導入社區前 30 天的使用趨勢，協助督導判斷需不需要再訓練 | P1 |\n| P-ADOPT-05 | 使用率納入督導稽核評分項目（選用） | P2 |\n\n### 5.7 平台營運後台（P-OPS 等）\n\n> 平台營運後台是 SaaS 的**第三個端**：租戶（物業公司）使用「租戶後台」與「前台」，平台營運方（我們）使用「平台營運後台」管理客戶、方案、帳務、推薦夥伴、客服與系統。\n>\n> 平台營運後台與租戶系統使用**獨立的登入入口與帳號**，平台人員帳號不能登入租戶後台；需要協助租戶時，一律透過限時授權（P-OPS-04）。\n\n#### 5.7.1 營運儀表板（P-DASH）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-DASH-01 | 關鍵指標：月經常性收入（MRR）、年經常性收入（ARR）、付費租戶數、試用中租戶數、服務社區總數、本月新增／流失租戶 | P0 |\n| P-DASH-02 | 趨勢圖：近 12 個月 MRR、租戶數、社區數 | P0 |\n| P-DASH-03 | 待處理清單：試用即將到期、帳款逾期、流失預警、未結客服問題、待審核試用申請 | P0 |\n| P-DASH-04 | 試用轉付費率、平均導入天數（建立租戶到第一個社區正式使用） | P1 |\n| P-DASH-05 | 方案分布（版本 × 級距）與各方案營收占比 | P1 |\n\n#### 5.7.2 客戶開發（P-CRM）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-CRM-01 | **試用申請**：官網表單（公司名稱、統編、聯絡人、電話、Email、社區數、推薦人／推薦碼），送出後進入潛在客戶清單 | P0 |\n| P-CRM-02 | 潛在客戶管理：來源（官網、推薦夥伴、展覽、電話開發）、階段（新名單 → 已聯繫 → 已展示 → 試用中 → 議價 → 成交／未成交）、負責業務、預估社區數與月費 | P0 |\n| P-CRM-03 | 聯繫紀錄：日期、方式（電話、拜訪、線上展示）、內容、下次跟進日；到期提醒負責業務 | P0 |\n| P-CRM-04 | **一鍵建立試用租戶**：由潛在客戶資料直接建立租戶（帶入公司資料、推薦夥伴），寄送開通通知給客戶 | P0 |\n| P-CRM-05 | 未成交原因統計（價格、功能不足、員工不會用、已有系統…），供產品與定價調整參考 | P1 |\n| P-CRM-06 | 銷售漏斗報表：各階段數量與轉換率，可依來源、推薦夥伴、業務篩選 | P1 |\n\n#### 5.7.3 租戶管理（P-OPS）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-OPS-01 | 租戶列表：方案、狀態、社區數、使用者數、MRR、到期日、最近活躍時間、健康度；可篩選與匯出 | P0 |\n| P-OPS-02 | **流失預警與健康度**：依使用率（P-ADOPT）、LINE 綁定率、帳款逾期、客服問題數計算健康度（良好／注意／危險），危險租戶列入待處理清單 | P1 |\n| P-OPS-03 | 平台公告：版本更新、維護時間，可指定全部、特定方案或特定租戶，顯示於租戶後台與 LINE；可排程發布 | P0 |\n| P-OPS-04 | **限時授權存取**：租戶管理者開啟授權（例：24 小時），平台客服才能進入該租戶協助；授權到期自動失效；客服的所有操作寫入租戶可查閱的稽核日誌 | P0 |\n| P-OPS-05 | 客服問題回報：租戶可在後台與 LIFF 頁面回報問題並附截圖，平台追蹤處理狀態（見 5.7.6） | P1 |\n| P-OPS-06 | 功能開關管理：新功能可先對指定租戶開放試用（見 5.7.9） | P1 |\n| P-OPS-07 | 平台營運報表：MRR 變動明細（新增、升級、降級、流失）、各方案分布、各租戶 LINE 推播量與儲存用量 | P1 |\n| P-OPS-08 | **租戶詳情頁**：同一頁呈現基本資料與法人、目前方案與歷史、帳單與付款、用量與配額、使用率趨勢、導入檢查清單進度（P-ONB-05）、客服問題、聯繫紀錄、推薦夥伴 | P0 |\n| P-OPS-09 | 租戶狀態操作：延長試用、轉正式、手動調整方案、暫停、恢復、終止；每次操作需填原因並記錄 | P0 |\n| P-OPS-10 | 租戶聯繫紀錄：客戶成功人員的拜訪、電話、訓練紀錄 | P1 |\n\n#### 5.7.4 方案、價格與帳務（P-SUB、P-BILL 營運端）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-SUB-09 | **方案管理**：設定版本、級距、可用模組、配額、月費、年費；方案可停售（不再提供新客戶，既有客戶續用） | P0 |\n| P-SUB-10 | **價格版本**：調價時建立新價格版本並設定生效日；既有租戶可選擇沿用舊價（保留原價）或於指定日期起適用新價 | P1 |\n| P-SUB-11 | 優惠碼：折扣方式（百分比／固定金額／免費月數）、適用方案、有效期、使用次數上限 | P1 |\n| P-SUB-12 | 個別報價：企業方案或特殊條件可為單一租戶設定專屬價格，需主管核准 | P1 |\n| P-BILL-07 | 帳單總覽：本月應收、已收、逾期，依租戶篩選；可手動新增一次性費用（導入費、加購訓練） | P0 |\n| P-BILL-08 | **收款對帳**：銀行轉帳收款登記，或匯入銀行明細自動比對帳單金額與虛擬帳號 | P0 |\n| P-BILL-09 | 逾期催收：依 P-BILL-04 自動提醒，並記錄人工催收紀錄 | P0 |\n| P-BILL-10 | 折讓與退款：方案降級、服務中斷補償時開立折讓單，記錄原因 | P1 |\n\n#### 5.7.5 推薦夥伴與佣金（P-PTN）\n\n> 對應商業計畫書第 8 章的合作模式。推薦夥伴可以是業主、產業公會、保全設備商、會計師等。\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-PTN-01 | 夥伴資料：名稱、類型（個人／公司）、聯絡人、匯款帳戶、合作模式（推薦佣金／經銷）、佣金規則 | P0 |\n| P-PTN-02 | **推薦碼與推薦連結**：每位夥伴專屬推薦碼；透過推薦碼或連結申請試用的潛在客戶自動歸屬該夥伴 | P0 |\n| P-PTN-03 | **佣金規則**：依首年訂閱費比例（例：15%）、固定金額或持續分潤；可設定只計月費、不含導入費；租戶於指定期間內退租時佣金可追回 | P0 |\n| P-PTN-04 | 佣金計算：租戶實際付款後才計算佣金，產生每月佣金明細（租戶、帳單、付款日、佣金金額） | P0 |\n| P-PTN-05 | 佣金撥付：撥付日期、金額、匯款憑證；夥伴需開立發票或簽收單據時記錄單據號碼 | P0 |\n| P-PTN-06 | **夥伴入口**：夥伴登入後可查看自己推薦的客戶（名稱、階段、是否付費，不含租戶業務資料）、佣金明細與撥付紀錄、下載推廣資料 | P1 |\n| P-PTN-07 | 夥伴成效報表：推薦數、成交數、成交率、帶來的 MRR、累計佣金 | P1 |\n\n#### 5.7.6 客服中心（P-SUP）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-SUP-01 | 問題清單：來源（租戶後台、LIFF、電話、Email）、租戶、提問人、類別（操作問題、資料匯入、錯誤回報、功能建議、帳務）、優先級、狀態（新進 → 處理中 → 待客戶回覆 → 已解決 → 結案） | P1 |\n| P-SUP-02 | 問題詳情：對話紀錄、附件與截圖、內部備註（客戶看不到）、指派處理人 | P1 |\n| P-SUP-03 | 需要進入租戶查看時，可從問題頁直接發出「授權請求」給租戶管理者（P-OPS-04） | P1 |\n| P-SUP-04 | 回應時限：依方案客服等級設定首次回應時限，逾時標示 | P1 |\n| P-SUP-05 | 功能建議彙整：同類建議合併計數，供產品規劃參考 | P2 |\n\n#### 5.7.7 內容管理（P-CMS）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-CMS-01 | **平台範本庫管理**：班別、報修類別、事件類別、證照類別、稽核範本、會計科目表、職位標準成本範本、角色權限範本；修改後只影響之後建立的租戶，不覆蓋既有租戶 | P0 |\n| P-CMS-02 | **教學內容管理**：上傳教學短影片、圖解說明，指定對應的功能頁面與語系（繁中、英、印尼、越南、泰文）；供 P-HELP-01 使用 | P0 |\n| P-CMS-03 | 說明文件與常見問題：分類、搜尋、上下架 | P0 |\n| P-CMS-04 | 版本更新說明：每次發布的新功能與修正，發布後自動產生平台公告草稿 | P1 |\n| P-CMS-05 | 服務條款、隱私權政策、資料處理約定的版本管理；新版本生效時，租戶擁有者下次登入需重新同意並留存紀錄 | P0 |\n\n#### 5.7.8 系統監控（P-MON）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-MON-01 | 服務狀態：API 回應時間、錯誤率、可用率，依租戶篩選 | P1 |\n| P-MON-02 | 背景工作佇列：帳單批次、報表、匯入匯出、推播排程的執行狀態；失敗工作可重試 | P0 |\n| P-MON-03 | LINE 用量：全平台與各租戶每日推播則數、本月累計、預估月底用量與費用 | P0 |\n| P-MON-04 | 儲存用量：各租戶檔案儲存量與配額 | P1 |\n| P-MON-05 | 異常告警：錯誤率、佇列堆積、LINE API 失敗率超過門檻時通知平台管理員 | P1 |\n\n#### 5.7.9 平台設定（P-ADM）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-ADM-01 | 平台人員帳號：建立、停用、重設密碼；**強制雙因子驗證** | P0 |\n| P-ADM-02 | 平台角色權限：平台管理員、業務、客服、平台財務，可調整各角色可用功能 | P0 |\n| P-ADM-03 | **平台稽核日誌**：平台人員的所有操作（含方案調整、租戶狀態變更、授權存取期間的操作），保存至少 2 年；只能新增不能修改（NF-SVC-08） | P0 |\n| P-ADM-04 | 功能開關：每個功能開關可設定「全部關閉／指定租戶／全部開啟」 | P1 |\n| P-ADM-05 | 平台參數：試用天數、逾期處理各階段天數、退租保留天數、LINE 官方帳號設定、Email 寄件設定、金流與電子發票設定 | P0 |\n\n### 5.8 資料可攜、退租與備份（P-EXIT）\n\n> 原則：**資料屬於租戶**。租戶在使用期間可以隨時備份；退租時，平台會主動產生完整的最終備份，並保留足夠時間讓租戶下載；刪除前多次提醒，刪除後提供證明。\n\n#### 5.8.1 備份內容（完整匯出包）\n\n| 類別 | 內容 | 格式 |\n|---|---|---|\n| 結構化資料 | 所有模組資料：社區、合約、員工、排班、報修、事件、包裹、訪客、巡邏、稽核；旗艦版另含住戶、管理費、社區財務、經營分析 | 每個模組一份 **Excel**（人看）＋**CSV**（其他系統匯入）＋**JSON**（完整還原用） |\n| 檔案 | 照片、合約掃描檔、憑證影像、簽核影像、文件庫 | 依「社區／模組／年月」分資料夾 |\n| 報表 | 歷月管委會月報、年度決算、收據存根、收繳總表 | PDF |\n| 紀錄 | 稽核日誌、登入紀錄、平台客服授權紀錄 | CSV |\n| 說明文件 | 資料欄位說明（每個欄位的意義、代碼對照）、檔案目錄說明 | PDF／HTML |\n| 完整性 | 每個檔案的 SHA-256 校驗清單 | 文字檔 |\n\n#### 5.8.2 需求\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-EXIT-01 | **隨時完整匯出**：租戶擁有者或系統管理員可隨時產生完整匯出包（內容見 5.8.1），以背景工作處理，完成後通知下載；也可只匯出指定模組或指定社區 | P0 |\n| P-EXIT-04 | **匯出安全**：<br>① 只限租戶擁有者與系統管理員，且需**再次驗證 2FA**（NF-AUTH-13）<br>② 匯出包以 AES-256 加密壓縮，解壓密碼**另以不同管道**提供（畫面顯示一次，或簡訊）<br>③ 下載連結為簽章網址，7 天有效、最多下載 5 次<br>④ 每次產生與下載都寫入稽核日誌，並通知所有租戶擁有者 | P0 |\n| P-EXIT-05 | **定期自動備份（租戶自主備份）**：租戶可設定每週或每月自動產生完整匯出包，平台保留最近 3 份供下載；產生完成時通知租戶擁有者 | P1 |\n| P-EXIT-06 | **備份送到租戶自己的儲存空間**：定期備份可自動傳送到租戶指定的 SFTP 或雲端硬碟 | P2 |\n| P-EXIT-02 | **退租流程**：<br>① 租戶申請退租（需再次驗證 2FA，並輸入租戶代碼確認）<br>② 系統**自動產生「最終完整備份」**並通知下載<br>③ 服務終止日起 **90 天唯讀**：可登入、查詢、下載備份、重新匯出，不能新增或修改<br>④ 刪除前 **30 天、7 天、1 天**以 Email 與後台通知提醒<br>⑤ 期滿刪除，並提供刪除證明 | P0 |\n| P-EXIT-07 | **退租前確認頁**：列出最終備份的內容、大小、產生時間與下載狀態；租戶擁有者尚未下載最終備份時，在退租確認頁與每次提醒中特別提示（提醒但不阻擋退租） | P0 |\n| P-EXIT-08 | **延長封存（加值服務）**：退租後可付費延長唯讀封存 1 年或 3 年，期間可查詢與下載，不能修改；適用於需要長期保存帳務或稽核資料的租戶。價格（假設）：1 年＝退租時方案月費 × 2，3 年＝月費 × 5 | P1 |\n| P-EXIT-09 | **離線交付（加值服務）**：資料量很大時，可申請以加密外接硬碟交付，解密金鑰另行提供；每次 NT$5,000 起（假設） | P2 |\n| P-EXIT-10 | **刪除範圍與證明**：刪除資料庫、物件儲存、搜尋索引、快取、應用日誌中的租戶資料；系統備份（NF-BAK-01）依輪替週期在 35 天內自然消滅，且期間不會再用於還原該租戶；刪除證明載明刪除範圍、日期與執行紀錄 | P0 |\n| P-EXIT-11 | **回流還原**：唯讀期間重新訂閱，資料立即恢復可用；刪除後重新訂閱，可用最終備份的 JSON 檔透過匯入中心還原 | P1 |\n| P-EXIT-12 | **付款逾期不等於刪除**：付款逾期進入唯讀或停權（P-BILL-04）時，資料仍完整保留且租戶擁有者仍可匯出；只有正式退租或終止才進入刪除流程 | P0 |\n| P-EXIT-03 | 社區撤場時（原 B-FEE-26、B-FIN-30）的移交資料匯出沿用原需求書；匯出安全比照 P-EXIT-04 | P0 |\n\n#### 5.8.3 退租流程圖\n\n```mermaid\nflowchart TD\n  A[租戶擁有者申請退租<br/>再次驗證 2FA + 輸入租戶代碼] --> B[系統自動產生最終完整備份]\n  B --> C[通知下載<br/>加密壓縮檔 + 另一管道提供密碼]\n  C --> D[服務終止<br/>進入 90 天唯讀]\n  D --> E{期間內}\n  E -- 重新訂閱 --> R[資料立即恢復可用]\n  E -- 購買延長封存 --> X[延長唯讀 1 年或 3 年]\n  E -- 無動作 --> F[刪除前 30 / 7 / 1 天提醒<br/>未下載者特別提示]\n  F --> G[刪除租戶資料]\n  X --> F\n  G --> H[提供刪除證明<br/>系統備份 35 天內輪替消滅]\n```\n\n### 5.9 教學與說明（P-HELP）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-HELP-01 | 每個 LIFF 頁面提供「怎麼用」短影片或圖解（30 秒內），支援前台五種語系 | P0 |\n| P-HELP-02 | 後台線上說明文件與常見問題 | P0 |\n| P-HELP-03 | 首次使用引導：第一次開啟某功能時顯示步驟提示 | P1 |\n| P-HELP-04 | 給督導使用的「現場教學包」：可列印的單頁操作說明（大字、圖解），方便到社區教總幹事 | P1 |\n\n### 5.10 社區廠商與合約管理（B-VND）\n\n> 物業公司常代管委會管理各社區與廠商的合約，例如電梯保養、消防檢修、機電、水塔清洗、外包清潔、垃圾清運、消毒、園藝、保險。另外也有物業公司自己轉包、自己簽約的情況。本模組集中管理**廠商資料**與**各社區的廠商合約**，屬**基本版**（2026-11-07 確認）。\n>\n> - **簽約方（甲方）兩種都支援**：\n>   - **管委會**：費用由社區（管委會）財務支出。\n>   - **本公司法人**：費用歸入公司經營分析的社區直接成本。\n> - 原 B-OPS-05「廠商管理」併入本模組，並**從專業版移到基本版**。\n> - 財務連動（自動產生待付款項、成本歸集）在有「社區帳務模組」或旗艦版時才啟用；基本版只管理合約與付款排程資料。\n\n#### 5.10.1 廠商資料\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-VND-01 | **廠商主檔**（取代 B-OPS-05），在租戶內共用，一家廠商可服務多個社區。內容包括：<br>• 名稱、統編<br>• 服務類別：電梯、消防、機電、水塔清洗、外包清潔、垃圾清運、消毒、園藝、保全設備、保險、其他<br>• 聯絡人、電話、Email、地址<br>• 匯款帳戶（加密儲存，畫面遮罩）<br>• 狀態：合作中、暫停、停用 | P0 |\n| B-VND-02 | **廠商資格與證照**：資格類別（例：電梯維護業登記、消防設備師（士）、病媒防治業許可）、證號、有效期限、掃描檔。到期前 60 天提醒，過期的廠商在新增合約時顯示警示 | P0 |\n| B-VND-03 | 廠商在各社區的服務總覽：目前的合約、累計合約金額、履約紀錄、報修派工次數 | P0 |\n| B-VND-04 | **廠商評鑑**：每年或每份合約到期前評分（到場時效、施工品質、配合度、價格），可加文字說明；評分結果列入續約參考 | P1 |\n\n#### 5.10.2 社區廠商合約\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-VND-10 | **合約主檔**：一個社區可有多份合約，保留歷史版本。內容包括：<br>• 合約編號、社區、廠商、服務類別<br>• **甲方**：管委會或本公司（指定法人）<br>• 起訖日、是否自動續約、解約通知期限（例：到期前 30 天書面通知）<br>• 計價方式：月費、年費、按次、按台（例：電梯每台每月）<br>• 金額與稅別、付款週期（月、季、年、按次）<br>• 服務範圍與頻率（例：電梯每月保養 1 次、消防每年檢修申報 1 次）<br>• 保固內容、到場時限（例：故障 4 小時內到場）<br>• 合約附件（PDF）、承辦人 | P0 |\n| B-VND-11 | **合約狀態**：草稿、生效中、即將到期、續約洽談中、已到期、已解約；狀態變更保留紀錄 | P0 |\n| B-VND-12 | **到期提醒**：到期前 90、60、30 天通知總幹事、督導。管委會簽約的合約提醒「需提管委會會議決議」；自動續約的合約，在**解約通知期限前**提醒是否要續約 | P0 |\n| B-VND-13 | **續約、變更、解約**：<br>• 續約：產生新版本，保留舊版本<br>• 變更：調價或範圍變更時，記錄生效日與原因<br>• 解約：記錄解約日與原因<br>• 管委會簽約的合約，需上傳管委會決議（會議紀錄或簽核影像） | P0 |\n| B-VND-14 | **付款排程**：依付款週期與金額自動產生付款排程（期別、應付日、金額），可個別調整；顯示已付／未付 | P0 |\n| B-VND-15 | **履約紀錄**：登記每次服務（日期、內容、照片、服務報告）；依服務頻率計算應服務次數與實際次數，顯示**履約率**，不足時提醒總幹事與督導 | P0 |\n| B-VND-16 | **與設備連結**：合約可對應到設備清冊（B-SITE-06）中的設備，例如電梯 1、2 號機。設備頁面顯示負責的廠商與合約；專業版會依合約的服務頻率自動產生保養任務（F-MNT-01），保養紀錄（F-MNT-02）自動計入履約紀錄 | P1 |\n| B-VND-17 | **報修連動**：報修派外包時（F-REP-03、B-OPS-02）可選擇該社區有合約的廠商，並顯示是否在保固或合約範圍內；派工後即時通知廠商聯絡人（Email／簡訊） | P1 |\n| B-VND-18 | **同類合約比較**：比較各社區同類合約的單價（例：電梯保養每台每月、外包清潔每人每月），找出偏高的合約，作為議價參考 | P1 |\n\n#### 5.10.3 財務與經營連動\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-VND-20 | **管委會簽約**（需社區帳務模組或旗艦版）：付款排程自動轉為社區財務的「固定支出待付款項」（B-FIN-09），並帶入會計科目與廠商；列入管委會月報的「應付未付清單」（B-FIN-23b）；付款後回寫合約付款狀態 | P0 |\n| B-VND-21 | **本公司簽約**（旗艦版）：付款排程歸入公司經營分析的社區直接成本（B-BIZ-07），影響社區毛利（B-BIZ-09） | P0 |\n| B-VND-22 | 管委會月報的工作報告（B-FIN-23a）可加入「廠商合約摘要」：本月履約情形、即將到期的合約 | P1 |\n\n#### 5.10.4 預警、權限與匯入\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| B-VND-30 | **儀表板預警**（擴充 B-DASH-02）：廠商合約 90 天內到期、解約通知期限將到、廠商證照到期、履約率不足的社區 | P0 |\n| B-VND-31 | **權限（依權限細項控管，2026-11-07 確認）**：廠商合約的操作拆成下表的權限細項，透過「角色權限設定」（B-SYS-02）指派給角色，**只有被授予權限的角色可以操作**；資料範圍一律限於該員工派駐的社區（督導為轄區）。預設值見 5.10.6 | P0 |\n| B-VND-32 | **資料匯入**：資料匯入中心（B-SYS-10）支援廠商與合約的 Excel 匯入 | P0 |\n| B-VND-33 | ~~LINE 前台查詢（P1）~~ **併入 F-VND-01，改為 P0** | — |\n\n\n#### 5.10.5 前台操作（F-VND）\n\n> 2026-11-07 確認：**LINE 與網頁前台分工**。LINE 負責現場的快速操作，網頁前台負責需要填較多欄位的合約維護。網頁前台指的是員工**個人登入**的網頁前台（PWA）；**櫃台模式不提供本功能**，因為共用裝置看不到金額與完整資料（NF-AUTH-09）。\n\n| 編號 | 端 | 需求 | 優先級 |\n|---|---|---|---|\n| F-VND-01 | LINE | **本社區廠商通訊錄**：依服務類別列出生效中合約的廠商，顯示聯絡人、一鍵撥號、服務範圍與頻率、到場時限、保固範圍；有「查看合約金額」權限才顯示金額 | P0 |\n| F-VND-02 | LINE | **登記履約**：選合約 → 拍照（服務單或現場照片）→ 補充說明 → 送出。具「確認履約」權限者登記即生效；其他有「登記履約」權限者登記後為「待確認」，確認後才計入履約率 | P0 |\n| F-VND-03 | LINE | **推播提醒**：合約 90／60／30 天到期、解約通知期限將到、履約率不足、續約申請被督導退回、有待確認的履約；訊息卡片可直接開啟對應的 LIFF 頁面 | P0 |\n| F-VND-04 | LINE | **續約前置作業**：針對即將到期的合約填寫處理意向（續約、議價後續約、不續約、改找其他廠商），並拍照上傳管委會決議 | P0 |\n| F-VND-05 | 網頁前台 | **合約維護**：新增或編輯本社區合約（存成草稿）、上傳附件、查看付款排程（金額需權限）；草稿送出後由督導確認生效 | P0 |\n| F-VND-06 | 網頁前台 | **提出續約、變更、解約申請**：填寫內容與原因，管委會簽約的合約需附管委會決議；送督導確認（B-VND-13） | P0 |\n| F-VND-07 | 網頁前台 | **履約總覽**：本社區各合約的履約率、履約紀錄，並集中確認「待確認」的履約 | P0 |\n| F-VND-08 | 網頁前台 | 廠商資料查詢與評鑑意見：查看本社區服務廠商的資料，並在評鑑期間填寫現場評分（B-VND-04） | P1 |\n| F-VND-09 | 兩者 | 前台送出的所有申請與登記都寫入稽核日誌，後台「廠商與合約」頁面顯示來源（LINE／網頁前台）與送出人 | P0 |\n\n#### 5.10.6 權限細項與預設值\n\n> 租戶可在「角色權限設定」調整；下表是新租戶建立時的預設值。✓＝預設開放、—＝預設不開放（可由租戶開放）。\n\n| 權限細項 | 總幹事 | 秘書 | 保全 | 清潔 | 機電 | 督導（後台） |\n|---|---|---|---|---|---|---|\n| 查看廠商與合約（不含金額） | ✓ | — | — | — | — | ✓ |\n| 查看合約金額 | ✓ | — | — | — | — | ✓ |\n| 登記履約 | ✓ | — | — | — | — | ✓ |\n| 確認履約 | ✓ | — | — | — | — | ✓ |\n| 維護合約（新增、編輯草稿、附件） | ✓ | — | — | — | — | ✓ |\n| 提出續約、變更、解約申請 | ✓ | — | — | — | — | ✓ |\n| 確認續約、變更、解約 | — | — | — | — | — | ✓ |\n\n> 限制：「查看合約金額」與「確認續約、變更、解約」**不能開放給保全、清潔角色**；「確認續約、變更、解約」只能給督導以上的後台角色，避免同一人申請又確認。\n\n### 5.11 企業方案：單一租戶部署與授權（P-ENT）\n\n> 2026-11-07 確認：買斷以「企業方案」提供，**第三期之後**才開放（商業計畫書 6.5）。主要方式為**專屬雲環境**（客戶的雲端帳號或我們建立的獨立環境，由我們代管）；地端部署個案評估；**不提供原始碼買斷**。本節需求的優先級除另註明外皆為 **P2**。\n\n#### 5.11.1 部署與打包\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-ENT-01 | **單一租戶模式**：同一套程式碼可用設定切換為「多租戶 SaaS」或「單一租戶」；單一租戶模式下停用訂閱計費、方案升降級、試用等 SaaS 專屬功能 | P2 |\n| P-ENT-02 | **部署打包**：以容器映像與部署腳本（含資料庫、物件儲存、背景工作、快取）一次建置完整環境；提供環境需求說明（主機規格、作業系統、網路、對外 HTTPS 網域與憑證） | P2 |\n| P-ENT-03 | **專屬雲環境代管**：我們可在客戶雲端帳號（以最小權限的代管角色）或我們的獨立帳號建立環境，並負責監控、備份、更新與資安修補部署 | P2 |\n| P-ENT-04 | **地端部署**（個案）：提供安裝手冊與健康檢查工具；部署前需確認客戶具備對外 HTTPS 網域（LINE Webhook 與 LIFF 必要）、備份與主機修補能力 | P2 |\n| P-ENT-05 | **資料移轉**：SaaS 租戶可轉為企業方案；以完整匯出包（P-EXIT-01 的 JSON 格式）匯入新環境，並提供移轉核對報告 | P2 |\n\n#### 5.11.2 授權控管\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-ENT-10 | **授權金鑰**：內含客戶名稱、版本（基本／專業／旗艦）、加購模組、社區數上限、維護到期日；以數位簽章防止竄改，**可離線驗證** | P2 |\n| P-ENT-11 | **社區數控管**：超過授權社區數時無法新增「服務中」社區，提示洽詢擴充授權 | P2 |\n| P-ENT-12 | **維護到期**：到期前 90／30／7 天在後台提醒；到期後系統照常使用，但停止接收版本更新與資安修補，後台持續顯示「維護已到期」警示 | P2 |\n| P-ENT-13 | 授權金鑰更新（擴充社區數、加購模組、續約維護）在後台貼上新金鑰即生效，不需停機 | P2 |\n\n#### 5.11.3 更新與維護\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-ENT-20 | **版本支援政策**：只支援最新版與前一版；新版發布時，通知所有企業方案客戶並標示資安修補的急迫程度 | P2 |\n| P-ENT-21 | **更新方式**：方式 A 由我們依維護排程部署（事先通知、夜間進行）；方式 B 提供更新套件與更新前檢查工具，資料庫結構變更需可回復 | P2 |\n| P-ENT-22 | 企業方案的每個版本同樣必須通過上線門檻（8.8），並額外驗證單一租戶模式的安裝與升級 | P2 |\n| P-ENT-23 | **系統健康回報（選用）**：經客戶同意後，環境定期回報版本、授權狀態與健康狀態（不含任何業務資料或個資），供我們提前發現問題 | P2 |\n\n#### 5.11.4 平台營運後台的對應功能\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-ENT-30 | **企業客戶管理**：客戶資料、部署方式（專屬雲／地端）、環境位置、目前版本、授權內容與到期日、維護合約與續約狀態 | P2 |\n| P-ENT-31 | **授權金鑰簽發**：依合約產生授權金鑰並留存紀錄；簽發、擴充、續約都需主管核准並寫入平台稽核日誌 | P2 |\n| P-ENT-32 | **維護續約提醒**：維護到期前 90 天提醒業務與客戶；列出維護已到期、仍停留在不支援版本的客戶 | P2 |\n| P-ENT-33 | **版本分布**：各企業客戶目前版本一覽，標示需緊急更新（有未修補的重大資安漏洞）的環境 | P2 |\n\n#### 5.11.5 資安與責任\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-ENT-40 | **資安責任分工表**：合約附件明列平台與客戶的責任（應用程式修補、主機修補、備份、網路防護、帳號管理、事件通報）；方式 A 由我們負責大部分項目，方式 B 多數由客戶負責 | P2 |\n| P-ENT-41 | 單一租戶環境仍適用第 8 章的應用程式資安要求（登入、2FA、加密、稽核日誌等），且預設值不得低於 SaaS 版 | P2 |\n| P-ENT-42 | **LINE 官方帳號**：企業方案一律使用客戶自有官方帳號（P-LINE-01 方式 B），訊息費由客戶支付 | P2 |\n| P-ENT-43 | 平台客服進入客戶環境協助時，同樣需客戶限時授權（P-OPS-04），操作留存於客戶環境的稽核日誌 | P2 |\n\n#### 5.11.6 多年期預付（SaaS）\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| P-BILL-11 | **3 年預付**：一次付清 36 個月，依平台設定的折扣計價（預設 85 折）；期間價格不調整；可升級（按日補差額），不可降級退費；平台營運後台可查詢預付剩餘期間 | P1 |\n\n---\n\n## 6. 原需求調整\n\n以下列出原需求書中**需要修改**的項目。未列出者依原需求書。\n\n| 原編號 | 原內容摘要 | SaaS 版調整 |\n|---|---|---|\n| B-SITE-02 | 社區掛在組織節點下 | 另需指定**所屬法人**（可多個，例如物業服務與保全服務由不同法人提供） |\n| B-OPS-05 | 廠商管理（專業版、P1） | 併入 B-VND-01～04，**改為基本版 P0**（廠商評鑑 B-VND-04 維持 P1） |\n| B-SITE-06 | 設備清冊含廠商 | 設備可連結到廠商合約（B-VND-16），負責廠商以合約為準 |\n| B-DASH-02 | 預警清單 | 新增廠商合約到期、解約通知期限、廠商證照到期、履約率不足（B-VND-30） |\n| B-SITE-08 | 社區人力編制標準 | 新增社區時檢查方案社區數上限（P-SUB-04） |\n| B-CONT-01 | 合約主檔 | 新增「簽約法人」欄位 |\n| B-EMP-01 | 員工檔案 | 新增「所屬法人」欄位 |\n| B-EMP-02 | 證照管理 | 證照類別由平台預設清單帶入，租戶可增修 |\n| B-EMP-05 | 員工帳號開通 | 新增 LINE 綁定狀態與邀請碼產生（P-LINE-02） |\n| B-AUD-01 | 稽核範本管理 | 平台提供範本庫，租戶複製後修改（P-ONB-03） |\n| B-SYS-02 | 角色與權限設定 | 平台提供預設角色；租戶可複製後自訂；權限上限受方案功能授權限制 |\n| B-SYS-03 | 代碼表維護 | 「平台預設＋租戶覆寫」兩層；多語名稱沿用 |\n| B-SYS-05 | 通知設定 | 由 P-LINE-08～10 取代；新增每位使用者的通知偏好（LINE／Email） |\n| B-SYS-06 | 登入安全 | 後台 2FA 由租戶設定是否強制（預設強制租戶擁有者與系統管理員） |\n| B-SYS-10 | 資料匯入中心 | 提升為平台核心（P-ONB-02），並開放平台客服在授權期間代為匯入 |\n| B-FEE-05b | 收據名義設定 | 收據抬頭可選擇租戶下的法人 |\n| B-BIZ-09～10 | 社區／組織損益 | 新增依**法人**彙總的損益檢視 |\n| F-HOME-01～03 | 工作台首頁 | LINE 使用者改為圖文選單＋LIFF 待辦頁；網頁版工作台保留給櫃台模式 |\n| F-ATT-01～02 | 打卡 | 從「暫緩」改為**基本版 P0**；以 LIFF 執行（見 P-LINE-12）；打卡拍照（F-ATT-02）由租戶設定是否啟用 |\n| F-PAT-03 | 巡邏掃碼 | 預設以 LIFF 掃碼；先做技術驗證（地下室、機房無訊號時的離線暫存）。**驗證未通過時改用 PWA 網頁執行巡邏**（LINE 選單按下後開啟 PWA，可離線暫存、恢復連線後上傳），其他功能維持 LIFF |\n| NF-UX-02 | PWA | 改為 LINE 的備援管道，非主要入口 |\n| NF-SEC-04 | 後台 2FA、限公司 IP | IP 白名單改為租戶可自行設定（P1） |\n| 第 8 章 | 部署：雲端或自有主機 | 確定為雲端多租戶 |\n| 第 9 章 | 分期 | 改依本文件第 7、10 章的版本與分期 |\n\n---\n\n## 7. 方案與功能對照\n\n### 7.1 版本功能對照\n\n| 模組 | 基本版 | 專業版 | 旗艦版 |\n|---|---|---|---|\n| 儀表板與預警（B-DASH） | ✓ | ✓ | ✓（含經營、收繳、財務區塊） |\n| 社區、合約、到期提醒（B-SITE、B-CONT） | ✓ | ✓ | ✓ |\n| 員工、證照、派駐（B-EMP） | ✓ | ✓ | ✓ |\n| 排班與請假（B-SCH、F-ATT） | ✓ | ✓ | ✓ |\n| 交接日誌（F-SHIFT） | ✓ | ✓ | ✓ |\n| 報修工單（F-REP、B-OPS） | ✓ | ✓ | ✓ |\n| 事件通報（F-INC、B-OPS） | ✓ | ✓ | ✓ |\n| 包裹、訪客（F-PKG、F-VIS） | ✓ | ✓ | ✓ |\n| 公告（B-DOC、F-NEWS） | ✓ | ✓ | ✓ |\n| 戶別清單（F-RES 基本欄位） | ✓ | ✓ | ✓ |\n| LINE 前台（P-LINE） | ✓ | ✓ | ✓ |\n| 使用率監控（P-ADOPT） | ✓ | ✓ | ✓ |\n| 基本報表（B-RPT P0 項目） | ✓ | ✓ | ✓ |\n| 督導稽核與改善單（B-AUD、F-AUD） | — | ✓ | ✓ |\n| 巡邏打點（F-PAT） | — | ✓ | ✓ |\n| 設備保養、清潔檢核（F-MNT） | — | ✓ | ✓ |\n| 公設預約（F-FAC） | — | ✓ | ✓ |\n| **社區廠商與合約管理**（B-VND，含廠商資料、合約、付款排程、履約紀錄、到期提醒） | ✓ | ✓ | ✓ |\n| 前台廠商合約操作（F-VND，LINE＋網頁前台，依權限） | ✓ | ✓ | ✓ |\n| 合約連動社區財務（B-VND-20） | 需加購帳務模組 | 需加購帳務模組 | ✓ |\n| 合約計入公司經營分析（B-VND-21） | — | — | ✓ |\n| 合約連動設備保養任務（B-VND-16） | — | ✓ | ✓ |\n| 進階報表（B-RPT P1 項目） | — | ✓ | ✓ |\n| **社區帳務模組**：住戶完整資料（區權人、坪數、車位）、管理費收繳（B-FEE、F-FEE）、社區財務與管委會月報（B-FIN、F-FIN） | 加購 | 加購 | ✓（內含） |\n| 公司經營分析（B-BIZ） | — | — | ✓ |\n| 打卡與出勤（F-ATT-01/02、B-SCH-04/05/09） | ✓ | ✓ | ✓ |\n| 薪資標準匯出（P-PAY-01/02） | ✓ | ✓ | ✓ |\n| 薪資系統串接（P-PAY-03） | ✓ | ✓ | ✓ |\n\n### 7.1.1 社區帳務模組加購價（假設）\n\n| 社區數級距 | 加購月費 |\n|---|---|\n| 入門（1～10） | NT$3,000 |\n| 標準（11～30） | NT$6,000 |\n| 進階（31～60） | NT$11,000 |\n| 企業（60+） | 另行報價 |\n\n> 加購價等於該級距「旗艦版－專業版」的價差，因此**專業版＋加購＝旗艦版價格**，旗艦版另多「公司經營分析」，引導客戶直接選旗艦版。\n\n### 7.2 方案配額（建議值，待驗證）\n\n| 項目 | 入門（1～10 社區） | 標準（11～30） | 進階（31～60） | 企業（60+） |\n|---|---|---|---|---|\n| 使用者帳號 | 不限 | 不限 | 不限 | 不限 |\n| 儲存空間 | 20 GB | 60 GB | 150 GB | 依合約 |\n| LINE 推播配額（每月） | 3,000 則 | 8,000 則 | 15,000 則 | 依合約 |\n| 客服 | 線上回報 | 線上回報＋電話 | 專人窗口 | 專人窗口＋到場 |\n\n> 月費假設見商業計畫書第 6 章。\n\n---\n\n## 8. 資安與效能（最高優先）\n\n### 8.1 優先原則\n\n> **資安與效能是上線門檻，不是可以延後的功能。** 註冊、登入與所有系統服務在設計、開發、測試、上線的每個階段，都以資安與效能為最優先。功能時程與資安或效能衝突時，**以資安與效能為準**。\n\n| 原則 | 說明 |\n|---|---|\n| 不得延後 | 本章標示 P0 的項目，必須在**第一期**完成，不得移到後續期別；驗證期試用版若使用真實資料，同樣適用 |\n| 安全預設 | 新功能預設採最嚴格設定（例：2FA 預設強制、匯出預設只限管理者），由租戶視需要放寬 |\n| 縱深防禦 | 每一層（網路、應用、資料庫、檔案）都有獨立防護，不依賴單一機制 |\n| 最小權限 | 使用者、平台人員、工程師、服務帳號都只給完成工作所需的最少權限 |\n| 參考標準 | 開發與檢核依 **OWASP ASVS 4.0 Level 2**、OWASP Top 10；身分驗證參考 **NIST SP 800-63B** |\n| 可量測 | 每項效能需求都有明確數字（見 8.7.3），並有監控與告警 |\n| 上線門檻 | 每次發布都要通過 8.8 的資安與效能檢核，未通過不得上線 |\n\n原需求書第 7 章（NF-SEC、NF-PERF、NF-UX）全部沿用。本章為 SaaS 版新增或加嚴的要求；兩者衝突時以本章為準。\n\n### 8.2 資安風險評估\n\n#### 8.2.1 需要保護的資產\n\n| 資產 | 內容 | 敏感度 |\n|---|---|---|\n| 住戶與區權人個資 | 姓名、身分證字號、電話、地址、車牌、持分 | 極高 |\n| 員工個資 | 身分證字號、聯絡方式、證照、薪資成本 | 極高 |\n| 管委會財務資料 | 收支、帳戶、憑證影像、欠費明細 | 高 |\n| 物業公司經營資料 | 合約金額、毛利、人力成本 | 高 |\n| 帳號與憑證 | 租戶帳號密碼、2FA 金鑰、LINE 綁定、Session | 極高 |\n| 平台機密 | LINE Channel Secret、金流與電子發票金鑰、資料庫與加密金鑰 | 極高 |\n| 平台營運資料 | 租戶清單、帳務、佣金、推薦夥伴匯款帳戶 | 高 |\n\n#### 8.2.2 威脅與對策\n\n**風險等級** = 可能性 × 影響。高風險項目在第一期必須全部有對策。\n\n| # | 威脅 | 情境 | 可能性 | 影響 | 風險 | 主要對策 |\n|---|---|---|---|---|---|---|\n| T1 | 跨租戶資料外洩 | 程式漏掉租戶條件、快取鍵值沒區分租戶，A 公司看到 B 公司住戶資料 | 中 | 極高 | **高** | NF-SAAS-01/02、NF-SVC-01/05 |\n| T2 | 帳號盜用（撞庫、暴力破解） | 用外洩的帳密大量嘗試登入後台 | 高 | 高 | **高** | NF-AUTH-01～04 |\n| T3 | LINE 綁定被冒用 | 邀請碼外流，他人綁定成員工身分 | 中 | 高 | **高** | NF-REG-08、NF-AUTH-07 |\n| T4 | 偽造 LIFF 身分 | 攻擊者直接呼叫 API，冒用他人 LINE userId | 中 | 高 | **高** | NF-AUTH-07/08 |\n| T5 | 越權存取（IDOR） | 修改網址或 API 參數中的編號，讀到別的社區或別人的資料 | 中 | 高 | **高** | NF-SVC-01 |\n| T6 | 平台人員濫權 | 平台客服或工程師私下查看租戶資料 | 低 | 極高 | **高** | NF-SAAS-12、NF-SVC-11、NF-AUTH-12 |\n| T7 | 註冊濫用與機器人 | 大量假申請、重複試用、用試用環境測試攻擊手法 | 高 | 中 | **中** | NF-REG-01～04 |\n| T8 | 注入與 XSS | 在報修描述、住戶姓名等欄位插入惡意程式 | 中 | 高 | **高** | NF-SVC-02 |\n| T9 | 惡意檔案上傳 | 上傳偽裝成照片的惡意檔案，或照片 EXIF 洩漏位置 | 中 | 中 | **中** | NF-SVC-04 |\n| T10 | 勒索軟體或資料毀損 | 資料庫被加密或誤刪 | 低 | 極高 | **高** | NF-BAK-01～04 |\n| T11 | 阻斷服務（DDoS） | 交班尖峰時段遭攻擊，現場無法通報 | 中 | 高 | **高** | NF-SVC-09、NF-PF-12 |\n| T12 | 套件漏洞 | 使用的開源套件出現重大漏洞 | 高 | 高 | **高** | NF-SVC-10 |\n| T13 | 離職員工仍可存取 | 員工離職後 LINE 或帳號仍可使用 | 中 | 高 | **高** | NF-AUTH-14 |\n| T14 | 機密外洩 | 金鑰寫在程式碼或設定檔，被上傳到版本庫 | 中 | 極高 | **高** | NF-SVC-07/10 |\n| T15 | 匯出檔外洩 | 全公司資料匯出檔被轉寄，或下載連結外流 | 中 | 極高 | **高** | P-EXIT-04、NF-AUTH-13 |\n| T16 | 退租資料殘留 | 退租後資料未刪乾淨，或未經同意被留存 | 低 | 高 | **中** | P-EXIT-02/10 |\n\n### 8.3 註冊與開通資安（NF-REG）\n\n> 範圍：官網試用申請（P-CRM-01）、租戶開通（P-CRM-04）、員工帳號建立、LINE 綁定。\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| NF-REG-01 | **機器人防護**：試用申請表單使用不干擾使用者的人機驗證，並依 IP、Email 網域限流（例：同一 IP 每小時最多 5 次） | P0 |\n| NF-REG-02 | **Email 驗證**：申請送出後寄送驗證連結（單次使用、24 小時有效），驗證完成才進入審核清單 | P0 |\n| NF-REG-03 | **統編檢核與重複偵測**：檢查統編格式與檢查碼；同一統編或 Email 已有租戶、試用中或近期試用過時，轉業務確認，防止重複試用 | P0 |\n| NF-REG-04 | **人工審核後開通**：試用租戶由業務審核後才建立，不自動開通（P-CRM-04） | P0 |\n| NF-REG-05 | **開通連結**：租戶擁有者透過開通連結設定密碼，且**必須完成 2FA 綁定**才能進入系統；連結單次使用、72 小時有效 | P0 |\n| NF-REG-06 | **不洩漏帳號是否存在**：申請、登入、忘記密碼的回應訊息一致，無法用來探測某 Email 或公司是否已是客戶 | P0 |\n| NF-REG-07 | 員工帳號只能由租戶建立，**不開放自行註冊**；首次登入需自行設定密碼 | P0 |\n| NF-REG-08 | **LINE 綁定邀請碼**：一次性、至少 8 碼隨機英數（排除 0/ ---|\n| NF-SAAS-01 | **租戶隔離**：所有業務資料表帶 `tenant_id`；API 由登入身分決定租戶，不接受前端傳入的租戶參數；資料庫啟用 Row-Level Security 作為第二道防線 | P0 |\n| NF-SAAS-02 | **跨租戶存取自動化測試**：每次發布前執行，以 A 租戶身分嘗試存取 B 租戶的每一類資料（含 API、檔案、匯出、搜尋、快取），必須全部被拒絕 | P0 |\n| NF-SAAS-03 | 檔案存取一律透過短效簽章網址（預設 5 分鐘），網址中不可出現可猜測的連續編號 | P0 |\n| NF-SAAS-04 | 敏感欄位加密（沿用 NF-SEC-02），加密金鑰可依租戶區分 | P2 |\n| NF-SAAS-05 | 每年至少一次第三方滲透測試；上市前與重大改版後各加做一次 | P0 |\n\n#### 8.5.2 應用程式與基礎設施\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| NF-SVC-01 | **伺服器端授權檢查**：每個 API 都檢查「租戶 × 角色 × 資料範圍（社區）× 方案授權」；資料編號使用不可猜測的 UUID，而且仍需經過授權檢查（防 IDOR） | P0 |\n| NF-SVC-02 | **常見攻擊防護**：資料庫一律使用參數化查詢；輸出依情境編碼防 XSS；啟用 Content-Security-Policy；表單與狀態變更請求有 CSRF 防護；Excel 與 CSV 匯出防公式注入 | P0 |\n| NF-SVC-03 | **傳輸與儲存加密**：全站 TLS 1.2 以上（建議 1.3）並啟用 HSTS；資料庫、物件儲存、備份皆加密儲存 | P0 |\n| NF-SVC-04 | **檔案上傳安全**：副檔名白名單並檢查實際檔案類型；大小上限；防毒掃描；照片重新編碼並移除 EXIF 位置資訊；使用者上傳的檔案由獨立網域提供下載 | P0 |\n| NF-SVC-05 | **快取與佇列隔離**：所有快取鍵值、佇列訊息、搜尋索引都必須包含 `tenant_id`；權限或方案變更時，相關快取立即失效 | P0 |\n| NF-SVC-06 | **金流安全**：使用金流服務商的託管付款頁，平台**不經手也不儲存信用卡號** | P0 |\n| NF-SVC-07 | **機密管理**：金鑰、密碼、LINE Channel Secret、金流金鑰統一存放於雲端金鑰管理服務，不得寫入程式碼、設定檔或日誌；定期輪替 | P0 |\n| NF-SVC-08 | **稽核日誌防竄改**：稽核日誌只能新增、不能修改或刪除（以雜湊串接或不可覆寫儲存）；記錄登入、權限變更、匯出、查看未遮罩個資、平台人員操作 | P0 |\n| NF-SVC-09 | **邊界防護**：使用 WAF、DDoS 防護與 CDN；資料庫與管理介面不對公網開放 | P0 |\n| NF-SVC-10 | **安全開發流程**：CI 中執行靜態程式碼掃描（SAST）、套件弱點掃描（SCA）、機密外洩掃描、容器映像掃描；每月動態掃描（DAST）。修補時限：重大（Critical）7 天、高風險 30 天、中風險 90 天 | P0 |\n| NF-SVC-11 | **生產環境存取**：工程師預設沒有生產環境權限，需申請限時權限（Just-in-Time）並全程記錄；生產資料不得複製到開發或測試環境，測試一律使用去識別化資料 | P0 |\n| NF-SVC-12 | **資安事件應變**：訂定應變計畫與通報流程。**平台內部目標：確認發生個資事故後 24 小時內通知受影響租戶，72 小時內提供初步調查報告**；對主管機關與當事人的法定通報時限與方式，依個資法及主管機關最新規定辦理，並由法律顧問確認（S10、S13）；每年至少演練一次 | P0 |\n| NF-SVC-13 | **資安監控**：登入異常、權限異常、大量匯出、WAF 攔截等事件集中收集並告警 | P0 |\n| NF-SVC-14 | 取得 ISO 27001 驗證，以利爭取大型客戶 | P2 |\n\n#### 8.5.3 系統備份與災難復原（NF-BAK）\n\n> 這是平台自身的備份，用於系統故障或災難時還原。**租戶自行保存資料、退租帶走資料的方式見 5.8。**\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| NF-BAK-01 | 資料庫支援時間點還原（PITR），**RPO ≤ 15 分鐘**；每日完整備份，加密後存放於異地，保留 35 天 | P0 |\n| NF-BAK-02 | **RTO ≤ 4 小時**：平台在重 F-07 | **報表** | 同步查詢 ≤ 10 秒（沿用 NF-PERF-01），超過改背景產生；背景工作 1 分鐘內開始執行 | P0 |\n| NF-PF-08 | **帳單批次** | 單一租戶 ≤ 10 分鐘；全平台 ≤ 2 小時 | P0 |\n| NF-PF-09 | **完整匯出／退租備份** | 一般租戶 2 小時內完成；大型租戶（含大量照片）24 小時內完成 | P0 |\n| NF-PF-10 | **可用率** | 整體 ≥ 99.5%；**登入與事件通報 ≥ 99.9%**（關鍵路徑） | P0 |\n\n#### 8.7.4 註冊與登入效能\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| NF-PF-11 | **認證服務獨立部署**，可單獨擴充；一般業務流量或報表尖峰不得拖慢登入 | P0 |\n| NF-PF-12 | **先限流、後雜湊**：IP 與帳號限流在密碼雜湊之前執行，避免攻擊者以大量登入請求耗盡主機運算資源 | P0 |\n| NF-PF-13 | 驗證信、簡訊、通知一律由背景佇列寄送，不阻塞註冊與登入的回應 | P0 |\n| NF-PF-14 | 官網與試用申請頁為靜態頁面並透過 CDN 提供；申請送出走輕量 API | P0 |\n| NF-PF-15 | LIFF 登入後的工作階段可重複使用（最長 12 小時），避免每次開頁都重新驗證 | P0 |\n\n#### 8.7.5 系統服務效能與資源公平\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| NF-SAAS-06 | **避免單一租戶拖慢全平台**：API 依租戶限流（建議預設每租戶持續 50 次／秒、瞬間 200 次／秒，依方案調整）；帳單批次、大型報表、匯入匯出以背景佇列處理，並限制單一租戶同時執行的工作數 | P0 |\n| NF-PF-16 | **佇列分級**：緊急推播 > 一般推播 > 報表與匯出 > 帳單批次；緊急事件使用**獨立佇列與獨立工作程序**，不會被批次工作阻塞 | P0 |\n| NF-PF-17 | **資料庫**：所有索引以 `tenant_id` 為第一欄位；大表依租戶或年度分割；使用連線池；報表走唯讀副本（沿用 NF-PERF-06、10） | P0 |\n| NF-PF-18 | **快取**：權限、方案授權、代碼表、社區基本資料使用快取（鍵值包含 `tenant_id`，見 NF-SVC-05） | P0 |\n| NF-PF-19 | **自動擴充**：應用服務與背景工作依 CPU、記憶體、佇列長度自動增減主機（沿用 NF-PERF-05） | P0 |\n| NF-PF-20 | 照片與檔案經 CDN 提供，上傳時產生縮圖，列表只載入縮圖（沿用 NF-PERF-12） | P0 |\n| NF-SAAS-07 | 服務水準於服務條款中公告；計畫性維護提前 3 天以平台公告通知，並安排在夜間 | P0 |\n| NF-SAAS-08 | 備份與單一租戶還原，見 NF-BAK-01～04 | P0 |\n| NF-SAAS-09 | 監控與日誌可依租戶篩選；應用效能監控（APM）追蹤每個 API 的回應時間與錯誤率，未達 8.7.3 目標時告警 | P0 |\n\n#### 8.7.6 效能測試\n\n| 編號 | 需求 | 優先級 |\n|---|---|---|\n| NF-PF-21 | **壓力測試**：上市前與每次重大發布前，以第 3 年規模模擬 8.7.2 的所有尖峰情境，必須達到 8.7.3 的目標 | P0 |\n| NF-PF-22 | **長時間測試**：以一般負載連續執行 8 小時，確認沒有記憶體洩漏或效能逐漸下降 | P0 |\n| NF-PF-23 | **攻擊情境測試**：模擬撞庫攻擊時，正常使用者登入仍符合 NF-PF-01 | P0 |\n| NF-PF-24 | **多租戶公平性測試**：一個租戶執行大量匯出與帳單批次時，其他租戶的 API 回應仍符合 NF-PF-04 | P0 |\n\n### 8.8 上線門檻（資安與效能檢核）\n\n每次發布前必須全部通過，任何一項未通過即**不得上線**：\n\n| # | 檢核項目 | 對應需求 |\n|---|---|---|\n| G1 | 跨租戶存取自動化測試全部通過 | NF-SAAS-02 |\n| G2 | 沒有未修補的重大與高風險弱點（SAST、SCA、容器掃描） | NF-SVC-10 |\n| G3 | 程式碼與設定檔中沒有機密 | NF-SVC-07 |\n| G4 | 新增或修改的 API 都有授權檢查測試 | NF-SVC-01 |\n| G5 | 重大發布：壓力測試、攻擊情境測試、公平性測試達標 | NF-PF-21～24 |\n| G6 | 重大發布：第三方滲透測試完成，高風險項目已修補 | NF-SAAS-05 |\n| G7 | 資料庫結構變更已在還原演練環境驗證可回復 | NF-BAK-04 |\n\n---\n\n## 9. 資料模型新增（概念）\n\n```mermaid\nerDiagram\n  TENANT ||--o{ LEGAL_ENTITY : \"法人\"\n  TENANT ||--o{ ORG_UNIT : \"組織樹\"\n  TENANT ||--o{ SUBSCRIPTION : \"訂閱\"\n  PLAN ||--o{ SUBSCRIPTION : \"方案\"\n  PLAN ||--o{ PLAN_MODULE : \"可用模組\"\n  SUBSCRIPTION ||--o{ TENANT_INVOICE : \"訂閱帳單\"\n  TENANT ||--o{ USAGE_DAILY : \"用量\"\n  TENANT ||--o{ SUPPORT_GRANT : \"客服授權\"\n  ORG_UNIT ||--o{ SITE : \"包含\"\n  LEGAL_ENTITY }o--o{ SITE : \"服務\"\n  SITE ||--o{ SITE_MODULE : \"模組開關\"\n  LEGAL_ENTITY ||--o{ EMPLOYEE : \"雇用\"\n  LEGAL_ENTITY ||--o{ CONTRACT : \"簽約\"\n  EMPLOYEE ||--o| LINE_BINDING : \"LINE 綁定\"\n  SITE ||--o{ ADOPTION_DAILY : \"使用率\"\n  PARTNER ||--o{ LEAD : \"推薦\"\n  LEAD ||--o| TENANT : \"成交\"\n  LEAD ||--o{ CONTACT_LOG : \"聯繫紀錄\"\n  PARTNER ||--o{ COMMISSION : \"佣金\"\n  TENANT_INVOICE ||--o{ COMMISSION : \"計佣依據\"\n  PLAN ||--o{ PLAN_PRICE : \"價格版本\"\n  COUPON }o--o{ SUBSCRIPTION : \"套用\"\n  TENANT ||--o{ SUPPORT_TICKET : \"客服問題\"\n  PLATFORM_USER ||--o{ PLATFORM_AUDIT : \"操作紀錄\"\n  TENANT ||--o{ TENANT_EXPORT : \"匯出與備份\"\n  TENANT ||--o{ LOGIN_EVENT : \"登入紀錄\"\n  SITE ||--o{ COUNTER_DEVICE : \"櫃台裝置\"\n  VENDOR ||--o{ VENDOR_CERT : \"資格證照\"\n  VENDOR ||--o{ VENDOR_CONTRACT : \"簽約\"\n  SITE ||--o{ VENDOR_CONTRACT : \"社區合約\"\n  VENDOR_CONTRACT ||--o{ VC_PAYMENT : \"付款排程\"\n  VENDOR_CONTRACT ||--o{ VC_SERVICE_LOG : \"履約紀錄\"\n  VENDOR_CONTRACT }o--o{ EQUIPMENT : \"涵蓋設備\"\n```\n\n| 實體 | 說明 | 關鍵欄位 |\n|---|---|---|\n| TENANT 租戶 | 訂閱客戶 | 租戶代碼、名稱、統編、狀態、語系、時區、Logo |\n| LEGAL_ENTITY 法人 | 租戶底下的公司 | 名稱、統編、地址、印章圖檔 |\n| PLAN 方案 | 版本 × 級距 | 版本、社區數上下限、月費、年費、配額 |\n| PLAN_MODULE 方案模組 | 方案可用的模組 | 方案、模組代碼 |\n| SUBSCRIPTION 訂閱 | 租戶目前與歷史方案 | 租戶、方案、起訖日、計費週期、狀態 |\n| TENANT_INVOICE 訂閱帳單 | 平台向租戶收費 | 期間、金額、付款狀態、發票號碼 |\n| USAGE_DAILY 用量 | 每日用量彙總 | 租戶、日期、推播則數、儲存量、活躍人數 |\n| SUPPORT_GRANT 客服授權 | 租戶授權平台客服存取 | 租戶、授權人、起訖時間、範圍 |\n| SITE_MODULE 社區模組開關 | 社區啟用哪些模組 | 社區、模組代碼、啟用日 |\n| LINE_BINDING LINE 綁定 | 員工與 LINE 帳號對應 | 員工、LINE 使用者 ID、綁定時間、狀態 |\n| ADOPTION_DAILY 使用率 | 每日使用統計（預先彙總） | 社區、員工、日期、各功能操作次數 |\n| LEAD 潛在客戶 | 試用申請與開發中的客戶 | 公司、聯絡人、來源、推薦夥伴、階段、負責業務、預估社區數 |\n| CONTACT_LOG 聯繫紀錄 | 業務或客戶成功人員的聯繫 | 對象（潛在客戶或租戶）、日期、方式、內容、下次跟進日 |\n| PARTNER 推薦夥伴 | 推薦客戶的個人或公司 | 名稱、類型、推薦碼、佣金規則、匯款帳戶 |\n| COMMISSION 佣金 | 依租戶付款計算的佣金 | 夥伴、租戶、帳單、金額、狀態（待撥付／已撥付／追回） |\n| PLAN_PRICE 價格版本 | 方案價格的歷次版本 | 方案、月費、年費、生效日 |\n| COUPON 優惠碼 | 折扣 | 代碼、折扣方式、適用方案、有效期、使用上限 |\n| SUPPORT_TICKET 客服問題 | 租戶回報的問題 | 租戶、提問人、類別、優先級、狀態、處理人 |\n| PLATFORM_USER 平台人員 | 平台營運後台帳號 | 帳號、角色、2FA、狀態 |\n| PLATFORM_AUDIT 平台稽核日誌 | 平台人員操作紀錄（只能新增） | 人員、時間、對象、動作、授權存取編號、前一筆雜湊 |\n| TENANT_EXPORT 匯出與備份 | 完整匯出、定期備份、退租最終備份 | 類型（手動／定期／最終）、範圍、狀態、檔案大小、校驗值、下載期限、下載次數、產生人 |\n| LOGIN_EVENT 登入紀錄 | 所有登入嘗試 | 帳號、時間、IP、裝置、結果（成功／失敗／鎖定）、驗證方式 |\n| COUNTER_DEVICE 櫃台裝置 | 經核准的櫃台裝置 | 社區、裝置名稱、核准人、核准時間、狀態 |\n| VENDOR 廠商 | 租戶共用的廠商主檔 | 名稱、統編、服務類別、聯絡人、匯款帳戶（加密）、狀態、評分 |\n| VENDOR_CERT 廠商資格 | 廠商的資格與證照 | 類別、證號、有效期限、附件 |\n| VENDOR_CONTRACT 廠商合約 | 社區與廠商的合約（含歷史版本） | 社區、廠商、甲方（管委會／法人）、起訖日、自動續約、解約通知期限、計價方式、金額、付款週期、服務頻率、狀態、版本 |\n| VC_PAYMENT 合約付款排程 | 依合約產生的應付期別 | 期別、應付日、金額、付款狀態、對應社區財務或公司成本紀錄 |\n| VC_SERVICE_LOG 履約紀錄 | 廠商每次服務 | 日期、內容、照片、服務報告、對應保養任務 |\n\n> **原需求書第 6 章所有實體皆新增 `tenant_id`**；EMPLOYEE、CONTRACT 新增 `legal_entity_id`；SITE 新增與 LEGAL_ENTITY 的多對多關聯。\n\n---\n\n## 10. 分期建議\n\n| 期別 | 範圍 | 目標 |\n|---|---|---|\n| **所有期別（基線）** | 第 8 章所有 P0 資安與效能需求；每次發布通過 8.8 上線門檻 | 資安與效能不因功能時程延後 |\n| **驗證期（極簡試用版）** | LINE 前台：交接日誌、報修、事件通報、公告；後台：社區、員工、證照到期、儀表板、使用率。可先做單一租戶，不含訂閱計費 | 驗證「年長總幹事用不用得起來」（見商業計畫書第 9 章） |\n| **第一期：基本版上市** | 租戶端平台層 P0（P-TEN、P-SUB、P-BILL、P-ONB、P-LINE、P-ADOPT、P-EXIT、P-HELP）＋平台營運後台 P0（P-DASH、P-CRM、P-OPS、P-PTN、P-CMS、P-MON、P-ADM）＋基本版模組（含社區廠商與合約管理、打卡與出勤、薪資標準匯出、LINE 共用與自有帳號） | 可對外銷售、多租戶營運、計算推薦佣金 |\n| **第二期：專業版** | 專業版模組＋平台層 P1（信用卡扣款、電子發票、推播配額、流失預警、客服中心、夥伴入口、價格版本與優惠碼等） | 擴大客單價 |\n| **第三期：旗艦版與社區帳務模組** | 社區帳務模組（管理費收繳、社區財務、住戶完整資料）同時以旗艦版內含與加購模組提供；公司經營分析；薪資系統串接（P-PAY-03） | 涵蓋原需求書完整範圍 |\n| **擴充** | 管委會唯讀入口、企業方案（買斷：專屬雲環境為主，5.11）、單一登入、ISO 27001 驗證、P2 項目 | 依客戶需求排序 |\n\n> 若訪談顯示「管委會月報」或「管理費收繳」是多數客戶的首要痛點，第三期可提前或拆成加購模組。\n\n---\n\n## 11. 待確認事項\n\n> 2026-11-06 已與你逐題確認，結果如下。仍待驗證的項目標示「**待驗證**」。\n\n| # | 問題 | 結論 | 狀態 |\n|---|---|---|---|\n| S1 | 計價單位 | 維持**社區數級距**（入門／標準／進階／企業） | 已確認 |\n| S2 | 打卡 | **納入基本版（P0）**，LIFF 以 GPS 或 QR Code 打卡（P-LINE-12） | 已確認 |\n| S3 | 管理費與社區財務 | 拆成**社區帳務模組**：旗艦版內含，基本版、專業版可加購（7.1、7.1.1） | 已確認 |\n| S4 | 多法人 | 很常見，維持 P0（P-TEN-04） | 已確認 |\n| S5 | 總幹事的 LINE 熟練度 | 由業主試用驗證後調整 LINE 前台設計 | **待驗證**（業主試用） |\n| S6 | LINE 官方帳號 | **第一期即支援**共用與租戶自有兩種（P-LINE-01、P-LINE-11） | 已確認 |\n| S7 | 薪資系統 | 標準匯出 P0；調查常用的 2～3 套薪資系統後直接串接 P1（P-PAY） | 已確認；**待調查**系統清單 |\n| S8 | 巡邏離線 | 先做 LIFF 技術驗證；未通過則巡邏改用 PWA（F-PAT-03） | **待驗證**（技術驗證） |\n| S9 | 雲端服務商 | 待技術評估；維持「台灣或鄰近區域機房」（NF-SAAS-10） | **待決定** |\n| S10 | 服務條款、隱私權政策、資料處理約定 | 委託律師撰寫與審閱 | 已確認 |\n| S11 | 規模假設 | 放大一倍：第 1 年 100 家／2,000 社區，第 3 年 600 家／12,000 社區（8.7.1） | 已確認 |\n| S12 | 退租加值服務定價 | 延長封存 1 年＝月費 × 2、3 年＝月費 × 5；離線交付 NT$5,000 起（假設） | 已確認 |\n| S13 | 個資外洩通報 | 內部目標 24 小時通知租戶、72 小時初步報告；法定時限由律師確認（NF-SVC-12） | 已確認；**待律師確認**法定時限 |\n| S14 | ISO 27001 | 維持 P2，先依其精神建立制度 | 已確認 |\n| S15 | 買斷需求 | 第一、二期不提供；以 3 年預付（P-BILL-11）替代；第三期後以企業方案提供（5.11）。是否開放、授權費倍數與維護費比例依訪談決定 | 已確認方向；**待訪談驗證** |\n\n---\n\n## 附錄 A：選單結構\n\n> 原需求書附錄 A 的後台與前台選單沿用，以下標示 SaaS 版的新增或調整項目（**粗體**為新增）。\n\n### A.1 平台營運後台（新增）\n\n```\n平台營運後台\n├─ 營運儀表板（MRR、租戶數、社區數、待處理清單、趨勢）\n├─ 客戶開發\n│   ├─ 潛在客戶（銷售階段看板 / 列表）\n│   ├─ 試用申請\n│   └─ 銷售漏斗與未成交原因（P1）\n├─ 租戶管理\n│   ├─ 租戶列表 / 租戶詳情（方案、帳單、用量、使用率、導入進度、客服、聯繫紀錄）\n│   ├─ 健康度與流失預警（P1）\n│   └─ 授權存取紀錄\n├─ 方案與帳務\n│   ├─ 方案與價格版本\n│   ├─ 優惠碼（P1）\n│   ├─ 帳單與收款對帳\n│   └─ 逾期催收\n├─ 推薦夥伴\n│   ├─ 夥伴列表 / 夥伴詳情（推薦碼、推薦客戶、佣金規則）\n│   ├─ 佣金明細與撥付\n│   └─ 夥伴入口（P1，夥伴本人登入）\n├─ 客服中心（P1）\n├─ 內容管理\n│   ├─ 平台公告\n│   ├─ 平台範本庫\n│   ├─ 教學影片與說明文件\n│   └─ 服務條款版本\n├─ 系統監控（背景工作、LINE 用量、儲存用量、服務狀態）\n└─ 平台設定（平台人員、角色權限、功能開關、平台參數、稽核日誌）\n```\n\n### A.2 租戶後台（調整）\n\n```\n總公司管理平台\n├─ 儀表板（新增：使用率區塊；依方案顯示區塊）\n├─ **導入精靈**（新租戶首次登入時顯示，完成後可從設定再次開啟）\n├─ 社區管理（新增：所屬法人、模組開關、社區詳情的「廠商合約」分頁）\n├─ **廠商與合約**（廠商資料、合約列表、到期與履約追蹤、同類合約比較）\n├─ 合約管理（新增：簽約法人）\n├─ 人事管理（新增：所屬法人、LINE 綁定狀態與邀請碼）\n├─ 排班請假\n├─ 督導稽核（專業版）\n├─ 營運總覽\n├─ 管理費（旗艦版或加購社區帳務模組）\n├─ 社區財務（旗艦版或加購社區帳務模組）\n├─ 經營分析（旗艦版）\n├─ **使用率**（各社區／員工活躍度、LINE 綁定率、低使用率警示）\n├─ 公告文件\n├─ 報表中心\n├─ 系統設定（新增：法人管理、LINE 通知設定、登入安全與登入紀錄、櫃台裝置核准、平台客服授權、資料匯出與定期備份、退租）\n└─ **訂閱與帳單**（租戶擁有者：方案、升降級、帳單、發票、用量）\n```\n\n> 未包含在租戶方案內的模組，選單顯示鎖頭圖示，點選後顯示方案說明與升級入口。\n\n### A.3 LINE 前台（新增）\n\n```\nLINE 官方帳號\n├─ 綁定流程（加入好友 → 掃描邀請碼 → 確認身分 → 選擇語系）\n├─ 圖文選單（依角色）\n│   ├─ 總幹事：打卡、交接日誌、報修、事件通報、改善單、更多\n│   ├─ 保全：打卡、交接日誌、巡邏打點、事件通報、報修、更多\n│   ├─ 清潔：打卡、班表、請假、事件通報、報修、更多\n│   └─ 機電：打卡、我的工單、報修、保養、事件通報、更多\n├─ LIFF 頁面\n│   ├─ 待辦、上下班打卡、交接日誌、報修、事件通報、巡邏打點\n│   ├─ 班表、請假、公告、改善單回覆\n│   ├─ 支出拍照登錄（旗艦版）\n│   ├─ 廠商通訊錄、登記履約、續約意向（依權限）\n│   └─ 社區切換、語系、怎麼用（教學影片）、問題回報\n└─ 推播訊息（緊急事件、逾期工單、改善單、每日摘要、公司公告）\n```\n\n### A.4 網頁前台（櫃台模式／PWA）\n\n沿用原需求書附錄 A 前台選單；新增租戶 Logo 顯示、方案未包含的模組隱藏。\n\n- **個人登入**新增「廠商合約」：合約維護、續約／變更／解約申請、履約總覽、廠商資料（依權限顯示，F-VND-05～08）\n- **櫃台模式**不顯示「廠商合約」\n";

function setTheme(){
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try{localStorage.setItem('pcmp-theme', r.dataset.theme)}catch(e){}
}
try{const t=localStorage.getItem('pcmp-theme'); if(t) document.documentElement.dataset.theme=t;}catch(e){}

const content=document.getElementById('content');
content.innerHTML = marked.parse(MD);

// 表格外包捲動容器
content.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='table-wrap';t.before(w);w.appendChild(t);});

// 優先級徽章
content.querySelectorAll('td').forEach(td=>{
  const m = td.textContent.trim().match(/^P([012])$/);
  if(m){ td.innerHTML='<span class="badge p'+m[1]+'">P'+m[1]+'</span>'; td.parentElement.dataset.p='P'+m[1]; }
});
content.querySelectorAll('strong').forEach(s=>{
  const m=s.textContent.trim().match(/^P([012])$/); if(m) s.outerHTML='<span class="badge p'+m[1]+'">P'+m[1]+'</span>';
});

// 優先級篩選
document.querySelectorAll('.filter input').forEach(cb=>cb.addEventListener('change',()=>{
  const on=[...document.querySelectorAll('.filter input:checked')].map(c=>c.dataset.p);
  content.querySelectorAll('tr[data-p]').forEach(tr=>tr.classList.toggle('hidden',!on.includes(tr.dataset.p)));
}));

// 目錄
const toc=document.getElementById('toc');
content.querySelectorAll('h2,h3').forEach((h,i)=>{
  h.id='sec-'+i;
  const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.className=h.tagName.toLowerCase();
  a.onclick=()=>document.querySelector('nav').classList.remove('open');
  toc.appendChild(a);
});
const links=[...toc.querySelectorAll('a')];
const io=new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+e.target.id));}
}),{rootMargin:'0px 0px -75% 0px'});
content.querySelectorAll('h2,h3').forEach(h=>io.observe(h));

// Mermaid 流程圖
content.querySelectorAll('pre code.language-mermaid').forEach(c=>{
  const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.parentElement.replaceWith(d);
});
mermaid.initialize({startOnLoad:false,theme:'default',securityLevel:'strict'});
mermaid.run({querySelector:'.mermaid'});
</script>
