<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINE 前台原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg:#f4f6fa; --panel:#ffffff; --panel-2:#f8fafc; --text:#0f172a; --muted:#64748b; --border:#e2e8f0;
  --accent:#0ea5e9; --accent-soft:#e0f2fe;
  --ok:#059669; --ok-bg:#d1fae5; --warn:#b45309; --warn-bg:#fef3c7; --bad:#dc2626; --bad-bg:#fee2e2; --info-bg:#e0e7ff; --info:#4338ca;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 4px 16px rgba(15,23,42,.06);
  --line:#06c755; --line-dark:#04a447; --chat-bg:#8eaad6; --bubble:#ffffff; --bubble-me:#9be86b; --bubble-text:#111827;
  --phone-bg:#ffffff; --liff-bg:#f3f5f8; --liff-card:#ffffff; --menu-bg:#ffffff; --menu-tile:#f1f5f9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a0f1a; --panel:#111827; --panel-2:#0f1623; --text:#e5e7eb; --muted:#94a3b8; --border:#1f2a3c;
    --accent-soft:#0c2a3d;
    --ok:#34d399; --ok-bg:#06281f; --warn:#fbbf24; --warn-bg:#2d2208; --bad:#f87171; --bad-bg:#2e1111; --info-bg:#1e1b4b; --info:#a5b4fc;
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --chat-bg:#1f2a3d; --bubble:#2b3446; --bubble-me:#2f6b33; --bubble-text:#f1f5f9;
    --phone-bg:#111827; --liff-bg:#0d1320; --liff-card:#172033; --menu-bg:#151d2c; --menu-tile:#1e293b;
  }
}
:root[data-theme="dark"]{
  --bg:#0a0f1a; --panel:#111827; --panel-2:#0f1623; --text:#e5e7eb; --muted:#94a3b8; --border:#1f2a3c;
  --accent-soft:#0c2a3d;
  --ok:#34d399; --ok-bg:#06281f; --warn:#fbbf24; --warn-bg:#2d2208; --bad:#f87171; --bad-bg:#2e1111; --info-bg:#1e1b4b; --info:#a5b4fc;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  --chat-bg:#1f2a3d; --bubble:#2b3446; --bubble-me:#2f6b33; --bubble-text:#f1f5f9;
  --phone-bg:#111827; --liff-bg:#0d1320; --liff-card:#172033; --menu-bg:#151d2c; --menu-tile:#1e293b;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Noto Sans TC","Noto Sans Thai",system-ui,sans-serif;font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
svg.lucide{width:18px;height:18px;stroke-width:1.9;flex-shrink:0}
.wrap{display:grid;grid-template-columns:340px minmax(0,1fr);gap:28px;max-width:1180px;margin:0 auto;padding:24px 16px 40px;align-items:start}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.stage{order:-1}}

/* ---------- 控制面板 ---------- */
.ctrl{background:var(--panel);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
@media (max-width:860px){.ctrl{position:static;max-height:none}}
.ctrl h1{font-size:17px;margin:0 0 2px}
.ctrl .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.ctrl h3{font-size:12px;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px;text-transform:uppercase}
.ctrl label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 4px}
.ctrl select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--panel-2)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--panel-2);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn svg.lucide{width:15px;height:15px}
.pushes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pushes .btn{justify-content:flex-start;font-size:12.5px}
.meter{height:8px;border-radius:99px;background:var(--border);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.warn i{background:var(--warn)}.meter.bad i{background:var(--bad)}
.small{font-size:12px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:5px}
.links a{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--panel-2);border:1px solid var(--border);text-decoration:none;color:var(--text)}
.links a:hover{border-color:var(--accent);color:var(--accent)}
.req{background:var(--panel-2);border:1px dashed var(--border);border-radius:10px;padding:10px;font-size:12.5px}
.req b{display:block;margin-bottom:4px}
.req code{font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:6px;margin:2px 2px 0 0;display:inline-block}

/* ---------- 手機 ---------- */
.stage{display:flex;justify-content:center}
.phone{width:390px;max-width:100%;height:min(820px,calc(100vh - 48px));min-height:640px;border-radius:46px;border:11px solid #0b0f17;background:var(--phone-bg);position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(15,23,42,.25);display:flex;flex-direction:column}
@media (max-width:420px){.phone{height:760px;border-width:6px;border-radius:30px}}
.sbar{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:13px;font-weight:700;background:var(--line);color:#fff;flex-shrink:0}
.sbar span{display:flex;gap:4px;align-items:center}.sbar svg.lucide{width:14px;height:14px}
.lhead{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--line);color:#fff;flex-shrink:0}
.lhead .av{width:34px;height:34px;border-radius:50%;background:#fff;color:var(--line);display:grid;place-items:center;font-weight:800;font-size:14px}
.lhead .nm{font-weight:700;font-size:15.5px;line-height:1.15}
.lhead .nm small{display:block;font-weight:500;font-size:11px;opacity:.85}
.lhead .sp{flex:1}
.ibtn{border:0;background:transparent;color:inherit;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.ibtn:hover{background:rgba(255,255,255,.15)}
.chat{flex:1;overflow-y:auto;background:var(--chat-bg);padding:12px 10px 16px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:92%}
.msg .av{width:30px;height:30px;border-radius:50%;background:var(--line);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}
.msg .b{background:var(--bubble);color:var(--bubble-text);padding:10px 13px;border-radius:18px 18px 18px 4px;font-size:15px;line-height:1.5;white-space:pre-line}
.msg .tm{font-size:10.5px;color:rgba(255,255,255,.85);flex-shrink:0}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .b{background:var(--bubble-me);border-radius:18px 18px 4px 18px}
.sys{align-self:center;background:rgba(0,0,0,.25);color:#fff;font-size:12px;padding:3px 12px;border-radius:99px}
.card{background:var(--bubble);color:var(--bubble-text);border-radius:18px;overflow:hidden;width:250px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card .ch{padding:10px 14px;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;color:#fff}
.card .ch.k-emg{background:#dc2626}.card .ch.k-warn{background:#d97706}.card .ch.k-info{background:#2563eb}.card .ch.k-ok{background:var(--line)}.card .ch.k-gray{background:#475569}
.card .cb{padding:12px 14px;font-size:14.5px;line-height:1.5;white-space:pre-line}
.card .cb small{display:block;color:#64748b;font-size:12px;margin-top:4px}
.card .cbtn{display:block;width:100%;border:0;border-top:1px solid rgba(100,116,139,.2);background:transparent;padding:12px;color:#2563eb;font-weight:800;font-size:15px;cursor:pointer}
:root[data-theme="dark"] .card .cbtn{color:#7cb6ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card .cbtn{color:#7cb6ff}}
.ibar{display:flex;align-items:center;gap:6px;padding:7px 8px;border-top:1px solid var(--border);background:var(--menu-bg);flex-shrink:0}
.ibar .menutg{border:1px solid var(--border);background:var(--menu-tile);border-radius:10px;padding:7px 10px;font-weight:800;font-size:13px;display:flex;gap:4px;align-items:center;cursor:pointer;color:var(--text)}
.ibar input{flex:1;min-width:0;border:1px solid var(--border);border-radius:99px;padding:8px 12px;background:var(--panel-2);font-size:14px}
.ibar .ibtn{color:var(--line)}
.rmenu{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);flex-shrink:0;border-top:1px solid var(--border)}
.rmenu.off{display:none}
.tile{background:var(--menu-bg);border:0;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;font-weight:800;font-size:15px;color:var(--text);padding:8px 4px;text-align:center;line-height:1.2}
.tile svg.lucide{width:30px;height:30px;color:var(--line)}
.tile:hover{background:var(--menu-tile)}
.tile .bd{position:absolute;top:10px;right:22%;background:#dc2626;color:#fff;font-size:12px;min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;padding:0 6px}
.tile.lock{color:var(--muted)}.tile.lock svg.lucide{color:var(--muted)}
.tile small{font-size:11px;font-weight:600;color:var(--muted)}

/* ---------- LIFF ---------- */
.liff{position:absolute;left:0;right:0;top:34px;bottom:0;background:var(--liff-bg);transform:translateY(105%);transition:transform .25s ease;display:flex;flex-direction:column;z-index:20;font-size:18px}
.liff.on{transform:none}
.lfh{height:54px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--liff-card);border-bottom:1px solid var(--border);flex-shrink:0}
.lfh .tt{flex:1;text-align:center;font-weight:800;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lfh .ibtn{color:var(--text)}
.lfh .ibtn:hover{background:var(--menu-tile)}
.lfsite{font-size:13px;color:var(--muted);text-align:center;padding:4px;background:var(--liff-card);border-bottom:1px solid var(--border)}
.lfb{flex:1;overflow-y:auto;padding:14px 14px 28px}
.lfb h4{font-size:17px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.lfb h4:first-child{margin-top:4px}
.stp{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--line);color:#fff;font-size:16px;font-weight:800;flex-shrink:0}
.box{background:var(--liff-card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
.bb{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:58px;border-radius:16px;border:2px solid var(--border);background:var(--liff-card);font-size:18px;font-weight:800;cursor:pointer;color:var(--text);padding:8px 12px}
.bb svg.lucide{width:24px;height:24px}
.bb.go{background:var(--line);border-color:var(--line);color:#fff}
.bb.go:hover{background:var(--line-dark)}
.bb.red{background:#dc2626;border-color:#dc2626;color:#fff}
.bb.soft{background:var(--menu-tile)}
.bb + .bb{margin-top:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{border:2px solid var(--border);background:var(--liff-card);border-radius:14px;min-height:64px;padding:8px;font-size:16px;font-weight:800;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text);text-align:center;line-height:1.2}
.chip svg.lucide{width:24px;height:24px}
.chip.sel{border-color:var(--line);background:#e8f9ee;color:#065f2c}
:root[data-theme="dark"] .chip.sel{background:#0f3320;color:#86efac}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.sel{background:#0f3320;color:#86efac}}
.chip.lv-emg.sel{border-color:#dc2626;background:#fee2e2;color:#991b1b}
.chip.lv-imp.sel{border-color:#d97706;background:#fef3c7;color:#92400e}
.ta{width:100%;min-height:96px;border:2px solid var(--border);border-radius:14px;padding:12px;font-size:17px;background:var(--liff-card);resize:vertical}
.in{width:100%;border:2px solid var(--border);border-radius:14px;padding:12px;font-size:17px;background:var(--liff-card)}
.photos{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.ph{width:84px;height:84px;border-radius:12px;position:relative;display:flex;align-items:flex-end;padding:4px;color:#fff;font-size:11px;font-weight:700;overflow:hidden}
.ph::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 60%)}
.ph span{position:relative}
.ph .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer}
.ph .x svg.lucide{width:14px;height:14px}
.li{display:flex;gap:12px;align-items:center;background:var(--liff-card);border:1px solid var(--border);border-radius:16px;padding:12px 14px;margin-bottom:10px;width:100%;text-align:left;font-size:16px;color:var(--text)}
button.li{cursor:pointer}
button.li:hover{border-color:var(--line)}
.li .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--menu-tile);flex-shrink:0}
.li .ic svg.lucide{width:24px;height:24px}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:17px}
.li .tx small{display:block;color:var(--muted);font-size:14px}
.li .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sb{border:2px solid var(--border);background:var(--liff-card);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:800;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:5px}
.sb.go{background:var(--line);border-color:var(--line);color:#fff}
.sb.red{border-color:#dc2626;color:#dc2626}
.sb svg.lucide{width:17px;height:17px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:800;white-space:nowrap}
.t-ok{background:var(--ok-bg);color:var(--ok)}.t-warn{background:var(--warn-bg);color:var(--warn)}.t-bad{background:var(--bad-bg);color:var(--bad)}.t-info{background:var(--info-bg);color:var(--info)}.t-mute{background:var(--border);color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:15px;margin:10px 0;display:flex;gap:8px}
.note.info{background:var(--info-bg);color:var(--info)}
.note.ok{background:var(--ok-bg);color:var(--ok)}
.note.bad{background:var(--bad-bg);color:var(--bad)}
.note svg.lucide{width:20px;height:20px;margin-top:2px}
.prog{height:14px;border-radius:99px;background:var(--border);overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--line)}
.chk{display:flex;align-items:center;gap:10px;font-size:17px;padding:8px 0;border-bottom:1px dashed var(--border)}
.chk input{width:26px;height:26px;accent-color:var(--line)}
.done-hero{text-align:center;padding:18px 6px}
.done-hero .big{width:84px;height:84px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 10px}
.done-hero .big svg.lucide{width:46px;height:46px}
.done-hero.emg .big{background:var(--bad-bg);color:var(--bad)}
.done-hero h3{margin:0 0 6px;font-size:22px}
.tl{list-style:none;margin:8px 0;padding:0;text-align:left}
.tl li{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:16px}
.tl li svg.lucide{color:var(--ok)}
.sched{width:100%;border-collapse:collapse;font-size:16px}
.sched td{padding:10px 8px;border-bottom:1px solid var(--border)}
.sched tr.today td{background:#e8f9ee;font-weight:800}
:root[data-theme="dark"] .sched tr.today td{background:#0f3320}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sched tr.today td{background:#0f3320}}
.lockv{text-align:center;padding:40px 10px}
.lockv .big{width:90px;height:90px;border-radius:50%;background:var(--menu-tile);display:grid;place-items:center;margin:0 auto 12px}
.lockv .big svg.lucide{width:44px;height:44px;color:var(--muted)}

/* ---------- 綁定流程 ---------- */
.bind{position:absolute;left:0;right:0;top:34px;bottom:0;background:var(--liff-bg);z-index:25;display:none;flex-direction:column;font-size:18px}
.bind.on{display:flex}
.bind .bh{height:52px;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--line);color:#fff;flex-shrink:0;gap:8px}
.bind .bb-body{flex:1;overflow:auto;padding:18px}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.steps i{width:38px;height:6px;border-radius:99px;background:var(--border)}
.steps i.on{background:var(--line)}
.prof{text-align:center;padding:20px 0}
.prof .pav{width:110px;height:110px;border-radius:50%;background:var(--line);color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:34px;font-weight:900}
.idc{background:var(--liff-card);border:1px solid var(--border);border-radius:16px;padding:6px 16px;margin:12px 0}
.idc div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--border);font-size:17px}
.idc div:last-child{border-bottom:0}
.idc span{color:var(--muted)}

/* ---------- modal / toast / guide（手機內） ---------- */
#ov{position:absolute;inset:0;background:rgba(2,6,23,.55);z-index:40;display:none}
#ov.on{display:block}
#modal{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:var(--liff-card);border-radius:22px 22px 0 0;z-index:41;display:none;flex-direction:column;font-size:17px}
#modal.on{display:flex}
#modal .mh{padding:16px 18px 8px;font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px}
#modal .mb{padding:4px 18px 10px;overflow:auto}
#modal .mf{padding:12px 18px 18px;display:flex;gap:8px;flex-wrap:wrap}
#modal .mf .btn{flex:1;justify-content:center;min-height:52px;font-size:17px;border-radius:14px;border-width:2px}
#modal .mf .btn.primary{background:var(--line);border-color:var(--line)}
#toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:rgba(15,23,42,.92);color:#fff;padding:10px 16px;border-radius:14px;font-size:14.5px;opacity:0;pointer-events:none;transition:.2s;z-index:60;width:max-content;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:70;transition:opacity .25s}
#flash.on{opacity:.85;transition:none}
#guide{position:absolute;inset:0;z-index:50;background:rgba(2,6,23,.7);display:none;align-items:center;justify-content:center;padding:24px}
#guide.on{display:flex}
#guide .gc{background:var(--liff-card);border-radius:22px;padding:22px;width:100%;font-size:19px;text-align:center}
#guide .gc .stp{width:52px;height:52px;font-size:24px;margin:0 auto 10px;display:grid}
#guide .gc p{margin:0 0 16px;line-height:1.5;font-weight:700}
#guide .dots{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
#guide .dots i{width:10px;height:10px;border-radius:50%;background:var(--border)}#guide .dots i.on{background:var(--line)}
.scanner{height:230px;border-radius:16px;background:#0b0f17;position:relative;overflow:hidden;margin-bottom:12px}
.scanner::before{content:"";position:absolute;inset:40px 70px;border:3px solid var(--line);border-radius:14px}
.scanner::after{content:"";position:absolute;left:70px;right:70px;height:3px;background:var(--line);top:50%;animation:scan 1.6s ease-in-out infinite alternate;box-shadow:0 0 12px var(--line)}
@keyframes scan{from{top:42px}to{top:186px}}
.scanner span{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:#cbd5e1;font-size:14px}
.video{height:190px;border-radius:16px;background:linear-gradient(135deg,#0f172a,#065f46);display:grid;place-items:center;color:#fff;position:relative;margin-bottom:10px}

function badge(p){
 const sp=site();
 switch(p){
  case "todo":return todoItems().length;
  case "shift":return S.pendingShift.filter(x=>x.st==="待確認").length;
  case "improve":return S.improves.filter(x=>x.st==="待改善").length;

  case "workorder":return S.workorders.filter(x=>x.site===sp&&x.st==="待接單").length;
  case "maint":return S.maint.filter(x=>x.site===sp&&x.st==="待執行").length;

 }return 0;
}

/* =====================================================================
   LIFF 開關與路由
   ===================================================================== */
function needPick(p){return user().sites.length>1&&!S.siteChosen[S.role]&&!["sitepick","settings","help","feedback","more"].includes(p);}
function openLiff(p){
 if(!S.bound){S.bound=true;}
 if(needPick(p)){S.pending=p;p="sitepick";}
 S.page=p;
 $("#liffTitle").textContent=t(p);
 $("#liffSite").textContent=TENANT.replace("股份有限公司","")+"・"+site()+"・"+user().n;
 $("#liffBody").innerHTML=locked(p)?lockView(p):R[p]();
 $("#liff").classList.add("on");$("#bind").classList.remove("on");
 icons();renderReq();renderMenu();
 if(PAGES[p].guide&&!S.seen[p]&&!locked(p)&&!S.done[p]){S.guide={p,i:0};showGuide();}
}
function refresh(){if(S.page)openLiffKeep();renderMenu();renderReq();}
function openLiffKeep(){const sc=$("#liffBody").scrollTop;$("#liffTitle").textContent=t(S.page);$("#liffBody").innerHTML=locked(S.page)?lockView(S.page):R[S.page]();icons();$("#liffBody").scrollTop=sc;}
function closeLiff(){S.page=null;$("#liff").classList.remove("on");renderReq();}
function go(p){if(location.hash==="#"+p){if(PAGES[p])openLiff(p);else route();}else location.hash=p;}
function route(){
 const h=(location.hash||"#chat").slice(1);
 closeAll();
 const m=h.match(/^bind([1-4])$/);
 if(m){S.bound=false;S.bindStep=+m[1];S.bindErr=false;closeLiff();renderBind();renderMenu();renderReq();return;}
 if(PAGES[h]){openLiff(h);return;}
 closeLiff();if(S.bound)$("#bind").classList.remove("on");else renderBind();renderMenu();
}
function showGuide(){const g=S.guide,steps=GUIDES[g.p];
 $("#guideBody").innerHTML=`<div class="dots">${steps.map((_,i)=>`<i class="${i===g.i?"on":""}"></i>`).join("")}</div><span class="stp">${g.i+1}</span><p>${steps[g.i]}</p><button class="bb go" data-act="guideNext">${g.i<steps.length-1?t("next"):t("gotit")}</button>${g.i<steps.length-1?`<button class="bb soft" data-act="guideSkip">${t("skip")}</button>`:""}`;
 $("#guide").classList.add("on");}

  <button class="bb go" data-act="bindScan" style="margin-top:14px"><i data-lucide="qr-code"></i>${t("bind_scan")}</button>

 woUpdate:el=>{const x=findBy(S.workorders,el.dataset.id);modal(`<i data-lucide="pencil"></i>更新進度 ${x.id}`,`<textarea class="ta" id="woLog" placeholder="處理狀況"></textarea>`,[{label:t("cancel")},{label:t("submit"),cls:"primary",fn:()=>{const v=formVal("woLog");if(!v){toast("請填寫進度");return;}x.log.push(now()+" "+v);closeAll();refresh();toast("已更新");}}]);},
 woVendor:el=>{const x=findBy(S.workorders,el.dataset.id);modal(`<i data-lucide="truck"></i>待料／外包 ${x.id}`,`<select class="in" id="woV"><option>叫料中（等待零件）</option><option>外包：永大電梯</option><option>外包：大同水電行</option><option>外包：安心消防</option></select><input class="in" id="woCost" type="number" placeholder="預估費用（元，可不填）" style="margin-top:10px"><label class="chk"><input type="checkbox" id="woCmt" checked>費用由管委會支付（F-REP-05）</label>`,[{label:t("cancel")},{label:t("confirm"),cls:"primary",fn:()=>{x.st="待料/外包";x.log.push(now()+" "+formVal("woV")+(formVal("woCost")?"・預估 NT$"+fmt(formVal("woCost")):""));closeAll();refresh();toast("已更新為待料/外包");}}]);},
 woDone:el=>{const x=findBy(S.workorders,el.dataset.id);S.photos.wo=[];modal(`<i data-lucide="camera"></i>${t("complete")} ${x.id}`,`${photoBlock("wo","拍完工照片")}<textarea class="ta" id="woNote" style="margin-top:10px" placeholder="處理說明"></textarea>`,[{label:t("cancel")},{label:t("submit"),cls:"primary",fn:()=>{if(!(S.photos.wo||[]).length){toast("請拍完工照片");return;}x.st="已完成";x.log.push(now()+" 完工："+(formVal("woNote")||"已修復"));closeAll();addMsg({k:"bot",txt:"🛠️ "+x.id+" 已完工，等待總幹事確認結案"});refresh();}}]);},
 /* 保養 */
 mtRecord:el=>{const x=findBy(S.maint,el.dataset.id);S.photos.mt=[];S.form.mtFile=null;
  modal(`<i data-lucide="clipboard-pen"></i>${esc(x.n)}`,`<input class="in" type="date" id="mtDate" value="2026-11-06"><input class="in" id="mtVendor" value="${esc(x.vendor)}" style="margin-top:10px"><select class="in" id="mtRes" style="margin-top:10px"><option>正常</option><option>需追蹤</option><option>異常（轉報修）</option></select><div style="margin-top:10px">${photoBlock("mt")}</div><div id="mtFile" class="small" style="margin:8px 0;font-size:14px">尚未上傳保養報告</div><button class="bb soft" data-act="mockUpload"><i data-lucide="file-up"></i>上傳保養報告（PDF／照片）</button>`,
  [{label:t("cancel")},{label:"儲存紀錄",cls:"primary",fn:()=>{x.st="已完成";x.rec=formVal("mtDate").slice(5).replace("-","/")+" "+formVal("mtVendor")+"・"+formVal("mtRes")+(S.form.mtFile?"・附報告":"");if(formVal("mtRes").startsWith("異常")){S.workorders.unshift({id:"R-288"+(60+S.workorders.length),site:x.site,cat:"c_other",loc:"設備",desc:x.n+" 保養發現異常",st:"處理中",log:[now()+" 由保養紀錄轉報修"]});}closeAll();addMsg({k:"bot",txt:"✅ 保養紀錄已儲存："+x.n});refresh();}}]);},
 mockUpload:()=>{S.form.mtFile="保養報告_"+now().replace(":","")+".pdf";const f=$("#mtFile");if(f)f.textContent="已上傳："+S.form.mtFile;toast("已上傳");},
 /* 支出 */
 expSubmit:()=>{keepForm();if(!(S.photos.exp||[]).length){toast("請拍發票或收據（步驟 1）");return;}if(!S.form.ecat){toast("請選擇科目");return;}const amt=+S.form.eAmt;if(!amt||amt<=0){toast("請輸入金額");return;}if(!S.form.epay){toast("請選擇付款方式");return;}
  const d={cat:S.form.ecat,amt,pay:S.form.epay};S.expenses.unshift({d:"11/06",...d,st:amt>5000?"待簽核":"已登錄"});S.done.expense=d;S.form.ecat=S.form.epay=null;S.form.eAmt="";S.photos.exp=[];
  addMsg({k:"bot",txt:"🧾 支出已登錄："+d.cat+" NT$"+fmt(amt)+(amt>5000?"\n需列印請款單給財委簽核":"")});openLiffKeep();refresh();},
 /* 問題回報 */
 shot:()=>{S.form.shot=true;keepForm();openLiffKeep();toast("已附上目前畫面截圖");},
 shotDel:()=>{S.form.shot=false;keepForm();openLiffKeep();},
 fbSubmit:()=>{keepForm();if(!S.form.fcat){toast("請選擇問題類型");return;}if(!S.form.fText){toast("請描述問題");return;}
  const id="SUP-2026-0"+(142+S.tickets.length);S.tickets.unshift({id,cat:S.form.fcat,text:S.form.fText,st:"新進"});S.done.feedback=id;S.form.fcat=null;S.form.fText="";S.form.shot=false;
  addMsg({k:"bot",txt:"📨 已收到您的問題回報 "+id+"\n客服會在 1 個工作天內於此回覆。"});openLiffKeep();
  setTimeout(()=>{const k=S.tickets.find(x=>x.id===id);if(k){k.st="處理中（客服）";addMsg({k:"bot",txt:"客服小美：您好，我們已收到 "+id+"，正在確認中，稍後回覆您。"});if(S.page==="feedback")openLiffKeep();}},2500);},
 /* 設定 */
 setLang:el=>{S.lang=el.dataset.v;renderAll();toast("Language: "+LANGS[LI[S.lang]][1]);},
 pickSite:el=>{S.site[S.role]=el.dataset.v;S.siteChosen[S.role]=true;renderCtrl();toast("目前社區："+el.dataset.v);const p=S.pending;S.pending=null;if(p){openLiff(p);}else openLiffKeep();refresh();},
 pkgInfo:()=>modal(`<i data-lucide="package"></i>包裹與訪客`,`<p style="margin:0 0 8px">包裹登記、領取簽名與訪客登記，在警衛室櫃台的共用電腦或平板（網頁版櫃台模式）操作，方便快速切換值班人員。</p><div class="note info"><i data-lucide="info"></i><span>LINE 前台只顯示未領數量提醒（SaaS 需求書 2.2：F-PKG、F-VIS 以網頁版為主）。</span></div>`,[{label:t("close")}]),
 /* 綁定 */
 bindAdd:()=>{go("bind2");},
 bindScan:()=>modal(`<i data-lucide="qr-code"></i>${t("bind_scan")}`,`<div class="scanner"><span>將鏡頭對準主管手機上的邀請碼</span></div><button class="bb go" data-act="bindScanOk"><i data-lucide="check"></i>模擬掃到：YX-8231-KL</button><button class="bb red" data-act="bindScanErr"><i data-lucide="octagon-alert"></i>模擬：此 LINE 已綁定其他公司</button>`,[{label:t("cancel")}]),
 bindScanOk:()=>{closeAll();S.bindCode="YX-8231-KL";go("bind3");},
 bindScanErr:()=>{closeAll();S.bindErr=true;renderBind();},
 bindCode:()=>{const v=formVal("bindCode").toUpperCase();S.bindCode=v;if(!v){toast("請輸入邀請碼");return;}
  if(v==="YX-8231-KL"||/^YX-\d{4}-[A-Z]{2}$/.test(v)){S.bindErr=false;go("bind3");}
  else if(v.startsWith("HY")){S.bindErr=true;renderBind();}
  else{toast("邀請碼無效或已過期，請向主管重新索取");}},
 bindConfirm:()=>{go("bind4");},
 bindNotMe:()=>modal(`<i data-lucide="user-x"></i>資料不是您本人`,`<p style="margin:0">請聯絡您的主管重新產生邀請碼。每組邀請碼只能使用一次，24 小時內有效。</p>`,[{label:"回上一步",fn:()=>{closeAll();go("bind2");}},{label:t("close")}]),
 bindLang:el=>{S.lang=el.dataset.v;S.bound=true;S.menuOpen=true;
  S.chat=[{k:"sys",txt:"今天"},{k:"sys",txt:"已加入官方帳號"},{k:"bot",txt:user().n+" 您好！\n已完成綁定："+TENANT+"・"+user().sites.join("、")+"\n請使用下方選單開始工作。"}];
  if(user().sites.length>1)S.siteChosen[S.role]=false;
  renderAll();go("chat");toast("綁定完成");},
 /* 控制面板 */
 push:el=>doPush(el.dataset.k),
 quotaNear:()=>{S.quota.used=S.quota.limit-2;renderQuota();toast("剩 2 則，之後非緊急通知會改在待辦顯示");},
 quotaReset:()=>{S.quota.used=0;S.suppressed=[];renderQuota();refresh();toast("配額已歸零（新的月份）");},
 resetDemo:()=>{const keep={role:S.role,plan:S.plan,oa:S.oa};initState();Object.assign(S,keep);S.lang=user().lang;S.bound=false;S.siteChosen={};renderAll();go("bind1");},
 theme:()=>{const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");r.dataset.theme=cur==="dark"?"light":"dark";},
};

/* =====================================================================
   事件委派
   ===================================================================== */
document.addEventListener("click",e=>{
 const f=e.target.closest("[data-foot]");if(f){const fn=FOOT[f.dataset.foot];fn?fn():closeAll();return;}
 const el=e.target.closest("[data-act]");if(!el)return;
 const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el);}
});
document.addEventListener("change",e=>{
 const c=e.target.dataset.change;if(!c)return;const v=e.target.value;
 if(c==="role"){S.role=v;S.lang=user().lang;impSel=null;}
 if(c==="lang")S.lang=v;
 if(c==="site"){S.site[S.role]=v;S.siteChosen[S.role]=true;}
 if(c==="plan")S.plan=+v;
 if(c==="oa")S.oa=v;
 renderAll();
 if(c==="role"&&S.page&&needPick(S.page))openLiff(S.page);
 toast("已切換");
});
$("#msgIn").addEventListener("keydown",e=>{if(e.key==="Enter")A.sendMsg();});
window.addEventListener("hashchange",route);
initState();renderAll();route();
</script>
</body>
</html>
