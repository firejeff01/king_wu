<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --text:#1f2933; --muted:#5f6b7a; --border:#e1e5ea;
  --accent:#1f6f5c; --accent-soft:#e3f1ec; --code:#f0f2f5;
  --p0:#b42318; --p0-bg:#fde8e7; --p1:#9a5b00; --p1-bg:#fdf1dc; --p2:#3b5b8a; --p2-bg:#e6edf7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14171b; --panel:#1c2026; --text:#e4e7eb; --muted:#9aa5b1; --border:#2e343c;
    --accent:#5cc4a6; --accent-soft:#1d3530; --code:#252a31;
    --p0:#ff8a80; --p0-bg:#3a1f1e; --p1:#ffc266; --p1-bg:#3a2e17; --p2:#9ab8e6; --p2-bg:#1f2a3a;
  }
}
:root[data-theme="dark"]{
  --bg:#14171b; --panel:#1c2026; --text:#e4e7eb; --muted:#9aa5b1; --border:#2e343c;
  --accent:#5cc4a6; --accent-soft:#1d3530; --code:#252a31;
  --p0:#ff8a80; --p0-bg:#3a1f1e; --p1:#ffc266; --p1-bg:#3a2e17; --p2:#9ab8e6; --p2-bg:#1f2a3a;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7;font-size:15px}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
nav{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px}
nav .brand{font-weight:700;font-size:16px;margin:0 6px 4px}
nav .sub{color:var(--muted);font-size:12px;margin:0 6px 14px}
nav a{display:block;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:6px;font-size:13.5px}
nav a.h3{padding-left:22px;font-size:12.5px}
nav a:hover,nav a.active{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;gap:6px;margin:0 6px 14px}
.tools button{flex:1;border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:6px;padding:5px;font-size:12px;cursor:pointer}
main{padding:32px 40px 80px;max-width:1180px}
h1{font-size:28px;margin:0 0 18px;border-bottom:3px solid var(--accent);padding-bottom:10px}
h2{font-size:22px;margin:44px 0 14px;padding:8px 14px;background:var(--accent-soft);border-left:5px solid var(--accent);border-radius:4px;scroll-margin-top:16px}
h3{font-size:17px;margin:28px 0 10px;color:var(--accent);scroll-margin-top:16px}
p,li{color:var(--text)}
hr{border:0;border-top:1px solid var(--border);margin:28px 0}
blockquote{margin:14px 0;padding:10px 16px;background:var(--panel);border-left:4px solid var(--muted);color:var(--muted);border-radius:4px}
blockquote p{margin:0;color:var(--muted)}
.table-wrap{overflow-x:auto;margin:12px 0 18px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{background:var(--code);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}
code{background:var(--code);padding:1px 6px;border-radius:4px;font-size:13px;font-family:Consolas,"Cascadia Mono",monospace}
pre{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;overflow-x:auto;line-height:1.5}
pre code{background:none;padding:0}
.mermaid{background:#fff;border:1px solid var(--border);border-radius:8px;padding:16px;margin:14px 0;overflow-x:auto;text-align:center}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge.p0{color:var(--p0);background:var(--p0-bg)}
.badge.p1{color:var(--p1);background:var(--p1-bg)}
.badge.p2{color:var(--p2);background:var(--p2-bg)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:0 6px 14px}
.filter label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
tr.hidden{display:none}
.menu-btn{display:none}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  nav{position:fixed;inset:0 30% 0 0;z-index:10;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 24px rgba(0,0,0,.25)}
  nav.open{transform:none}
  main{padding:60px 16px 60px}
  .menu-btn{display:block;position:fixed;top:12px;left:12px;z-index:11;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:6px 12px}
  h1{font-size:22px}
}
@media print{
  nav,.menu-btn{display:none}
  .layout{display:block}
  main{max-width:none;padding:0}
  h2{break-after:avoid}
  .table-wrap,.mermaid{break-inside:avoid}
}
</style>

<script>
const MD = "# 物業社區管理平台 SaaS 化 — 商業計畫書\n\n| 項目 | 內容 |\n|---|---|\n| 文件版本 | v0.1（初稿） |\n| 撰寫日期 | 2026-11-06 |\n| 文件狀態 | 討論草案，價格與數字皆為**假設**，需經訪談與試用驗證 |\n| 相關文件 | 原需求規劃書 v0.5（`../社區管理系統需求規劃書.md`）、SaaS 版需求規劃書（`社區管理系統SaaS版需求規劃書.md`） |\n\n---\n\n## 1. 摘要\n\n- **做什麼**：把原本為單一物業公司規劃的「社區管理系統」，改成**多家物業公司共用、按月訂閱**的 SaaS 服務。\n- **為誰做**：服務 5～60 個社區的**中小型物業管理／保全公司**。\n- **差異化**：**「年長總幹事也用得來」**。前台以 LINE 為入口、3 步內完成作業；總公司端提供預警、稽核、管委會月報一鍵產出，以及「各社區使用率」監控。\n- **怎麼賺錢**：以**公司為單位**訂閱，依「服務社區數級距 × 功能版本」收月費，另收一次性導入費。\n- **現在要做的事**：**先驗證、後開發**。用現有需求書與雛型做 5～10 場訪談，再請業主找 1～2 位總幹事試用極簡 LINE 版本，通過後才進入正式開發。\n\n---\n\n## 2. 緣起\n\n### 2.1 原案經過\n\n| 時間 | 事件 |\n|---|---|\n| 2026-11 | 為業主（物業公司）完成需求規劃書 v0.5 與前後台畫面雛型 |\n| 2026-11-05 | 業主評估後決定**不導入** |\n| 同日 | 提出 SaaS 化構想，業主有興趣，願意透過人脈協助推廣 |\n\n### 2.2 業主不導入的原因與啟示\n\n> 業主：「公司內的總幹事年紀都較大，導入後學習曲線高，可能使用率偏低而浪費。」\n\n| 觀察 | 啟示 |\n|---|---|\n| 業主**沒有否定需求**，只擔心「用不起來」 | 痛點存在，阻礙在**導入門檻**，不在功能 |\n| 總幹事年長是**業界普遍現象** | 其他物業公司大多會有同樣顧慮；能解決這點就是**主要差異化** |\n| 「浪費」代表怕**一次投入大、回收不確定** | SaaS 月繳、可退訂、先試用，正好降低這個顧慮 |\n| 原需求書功能完整，但前台作業項目多 | SaaS 版要**分版本、可按社區開關模組**，讓客戶從少量功能開始 |\n\n---\n\n## 3. 市場與目標客群\n\n### 3.1 目標客群\n\n| 區隔 | 規模 | 是否為目標 | 理由 |\n|---|---|---|---|\n| 大型保全／物業集團 | 100+ 社區 | ✗ | 多半有自建系統或長期配合的資訊廠商，決策週期長 |\n| **中型物業公司** | 20～60 社區 | ✓ 主力 | 已感受到「總公司管不到現場」的痛點，又沒有自建系統的資源 |\n| **小型物業公司** | 5～20 社區 | ✓ | 老闆兼督導，最需要省人力；價格敏感 |\n| 個體／單一社區 | 1～4 社區 | △ | 量小、流失率高，提供入門方案即可，不主動經營 |\n\n> **待驗證**：台灣中小型物業公司的實際家數與社區數分布，需在訪談與公開登記資料中確認。\n\n### 3.2 買家與使用者不同\n\n| 角色 | 在意什麼 | 我們要給他什麼 |\n|---|---|---|\n| **老闆／總經理**（付錢的人） | 掌握各社區狀況、合約不漏續、毛利 | 儀表板、到期預警、社區損益 |\n| **督導／區域主管** | 巡點、稽核、人力調度 | 稽核表單、改善單追蹤、人力缺口預警 |\n| **總幹事**（用的人，常是年長者） | 不要增加工作、不要學新東西 | LINE 操作、拍照取代打字、管委會月報自動產出（**幫他省事**） |\n| **保全／清潔**（常有外籍人員） | 簡單、看得懂 | LINE 圖文選單、多語系 |\n\n**關鍵**：老闆買單的理由是「看得到現場」，但能不能看到，取決於總幹事願不願意用。所以產品設計要讓**總幹事覺得系統在幫他省事**，而不是多一份工作。\n\n### 3.3 產業特性（影響導入策略）\n\n- **公司常分屬不同法人**：依法規，保全業務與公寓大廈管理維護業務常由**不同公司**經營，同一集團底下可能有保全公司與物業公司兩個法人。SaaS 需支援「一個租戶多個法人」。\n- **溝通以 LINE 為主**：現場與總公司的溝通大多在 LINE 群組，這是我們前台採 LINE 入口的理由。\n- **外籍員工多**：保全、清潔常有外籍人員，多語系（繁中、英、印尼、越南、泰文）是實用的差異點。\n- **毛利薄、價格敏感**：訂閱費需讓老闆算得出「省下的人力或避免的損失」大於費用。\n\n---\n\n## 4. 產品定位與差異化\n\n### 4.1 一句話定位\n\n> **給中小型物業公司的營運平台：總公司看得到每個社區，年長總幹事也用得來。**\n\n### 4.2 與市面產品的差異\n\n| 面向 | 市面常見社區系統 | 本平台 |\n|---|---|---|\n| 服務對象 | 多以**住戶**為主（住戶 App、包裹通知、繳費） | 以**物業公司本身**為主（總公司＋派駐人員） |\n| 前台操作 | 需另裝 App 或登入網頁 | **LINE 圖文選單＋LIFF 頁面**，不用另裝 App |\n| 年長使用者 | 一般設計 | 大字級、3 步內完成、拍照取代打字 |\n| 總公司管理 | 較少著墨 | 合約／證照到期預警、督導稽核、人力缺口、社區損益 |\n| 導入成效 | 客戶自行摸索 | **各社區使用率儀表板**，看得到誰沒在用 |\n\n> **待辦**：在訪談中盤點受訪公司「現在用什麼工具」，整理正式的競品比較表。\n\n### 4.3 回應業主顧慮的產品設計\n\n| 顧慮 | 對策 |\n|---|---|\n| 總幹事學不會 | 前台用 LINE；每項作業 3 步內；圖示一律配文字；內建短影片教學 |\n| 使用率偏低、浪費錢 | 後台「使用率儀表板」逐社區顯示使用狀況，低使用率自動提醒督導；月繳可隨時調整方案 |\n| 一次導入負擔大 | 可**按社區、按模組**逐步開通，先從 1～2 個社區、2～3 個功能開始 |\n| 輸入工作量大 | 總幹事只做確認、拍照、簽核；資料輸入交給秘書或總公司 |\n\n---\n\n## 5. 產品範圍與版本\n\n完整功能沿用原需求書 v0.5，並依 SaaS 需求調整，詳見《SaaS 版需求規劃書》。版本規劃摘要如下：\n\n| 版本 | 定位 | 主要內容 |\n|---|---|---|\n| **基本版** | 先把現場和總公司連起來 | 社區／合約／到期提醒、員工／證照／派駐、排班請假、交接日誌、報修、事件通報、包裹、訪客、公告、LINE 前台、使用率儀表板 |\n| **專業版** | 品質管理 | 基本版＋督導稽核與改善單、巡邏打點、設備保養、清潔檢核、廠商管理、進階報表 |\n| **旗艦版** | 帳務與經營 | 專業版＋管理費收繳、社區財務與管委會月報、公司經營分析（社區損益） |\n\n> **為什麼這樣切**：基本版解決「看不到現場」這個最普遍的痛點，導入門檻最低。管理費與社區財務牽涉金錢與個資，導入成本高，放在旗艦版；但**管委會月報一鍵產出**對總幹事很有吸引力，若訪談顯示這是首要痛點，可考慮拆成獨立加購模組提前提供。\n\n---\n\n## 6. 訂閱方案與定價\n\n> 以下價格皆為**假設**，用於訪談時試探價格接受度，不是正式報價。\n\n### 6.1 月費（以公司為單位）\n\n| 社區數級距 | 基本版 | 專業版 | 旗艦版 |\n|---|---|---|---|\n| 入門：1～10 個 | NT$3,500 | NT$5,000 | NT$8,000 |\n| 標準：11～30 個 | NT$8,000 | NT$12,000 | NT$18,000 |\n| 進階：31～60 個 | NT$16,000 | NT$25,000 | NT$36,000 |\n| 企業：60 個以上 | 另行報價 | 另行報價 | 另行報價 |\n\n- **使用者帳號數不限**：避免客戶為了省錢而少開帳號，影響使用率。\n- **計算方式**：以「服務中」的社區數計算；洽談中、已解約的社區不計。\n\n### 6.2 其他收費\n\n| 項目 | 方式 | 假設價格 |\n|---|---|---|\n| 導入費（一次性） | 含資料匯入協助、LINE 帳號設定、2 場教育訓練 | NT$20,000 起，依社區數與資料量調整 |\n| 年繳優惠 | 一次繳 12 個月 | 九折 |\n| 加購教育訓練 | 到場或線上 | 每場 NT$3,000～5,000 |\n| 超出級距 | 自動升級到下一級距，次月生效 | — |\n\n### 6.3 定價需注意的問題\n\n- **級距邊界跳價**：例如 10 個社區付 5,000 元，11 個社區付 12,000 元，跳幅偏大。替代做法是「基本費＋每社區單價」，訪談時兩種都要問。\n- **與客戶的價值對照**：客戶從每個社區每月收取的服務費通常遠高於系統費用，可以「每社區每月約 NT$300～500」的角度說明，讓費用顯得合理。\n- **試用方案**：前 1～2 家試點客戶可給優惠價，但**一定要收費**，免費試用無法證明真實需求。\n\n---\n\n## 7. 成本結構\n\n### 7.1 主要成本項目\n\n| 項目 | 性質 | 說明 |\n|---|---|---|\n| 開發人力 | 固定 | 最大宗；MVP 階段可能是 1～2 人 |\n| 客服與導入人力 | 半固定 | 年長使用者多，客服需求會比一般 SaaS 高，是**容易低估**的成本 |\n| 雲端主機、資料庫、儲存 | 隨用量 | 初期每月約數千到一兩萬元（視架構而定，需實際估算） |\n| LINE 官方帳號訊息費 | 隨用量 | 只有主動推播收費，回覆訊息與 LIFF 頁面不計費（見 7.2） |\n| Email／簡訊 | 隨用量 | 簡訊每則需付費，只用於重要通知或 LINE 未綁定者 |\n| 電子發票、金流手續費 | 隨營收 | 平台向租戶收月費時產生 |\n| 資安檢測 | 年度 | 弱點掃描、滲透測試 |\n\n### 7.2 LINE 推播成本估算\n\n**假設**：每個社區 3 位人員，每人每天 2 則主動推播，即每社區每月約 180 則。整個平台共用一個官方帳號時，成本依全平台總量計算，每家公司分攤的是邊際成本：\n\n| 方案 | 推播量／月 | LINE 邊際成本約 | 佔該級距專業版月費 |\n|---|---|---|---|\n| 入門（10 個社區） | 1,800 則 | 數百元 | 個位數 % |\n| 標準（30 個社區） | 5,400 則 | NT$1,000～1,500 | 約 10% |\n| 進階（60 個社區） | 10,800 則 | NT$2,000～2,500 | 約 10% |\n\n- LINE 官方帳號方案價格以 LINE 官方公告為準，正式規劃前需重新確認。\n- 控制成本的設計：**只推例外狀況**（逾期、緊急）、**每日摘要合併推播**、總公司幹部改用 Email 或後台通知。\n\n### 7.3 損益兩平試算（示意）\n\n> 損益兩平客戶數 ＝ 每月固定成本 ÷（平均每家客戶月費 × 毛利率）\n\n**示例**：每月固定成本 NT$150,000（人力＋基礎設施），平均每家客戶月費 NT$12,000、毛利率 80%：\n\n150,000 ÷（12,000 × 0.8）≈ **16 家客戶**\n\n實際數字需等開發團隊規模與定價確認後重算。\n\n---\n\n## 8. 與業主的合作模式\n\n業主的人脈是最重要的初期通路，合作方式需要先談清楚。\n\n| 模式 | 內容 | 優點 | 缺點 |\n|---|---|---|---|\n| **推薦佣金** | 業主介紹成交，抽首年訂閱費一定比例（例如 15～20%） | 簡單、無須出資 | 業主投入程度可能有限 |\n| **經銷／代理** | 業主以折扣價取得，自行轉售並提供第一線服務 | 業主動機強 | 品質與價格較難掌控 |\n| **合夥／入股** | 業主出資或以資源（人脈、產業知識）換取股份 | 利益綁定最深 | 需處理股權、決策權，談判複雜 |\n| **設計夥伴** | 業主公司作為首家試用客戶，提供回饋，換取長期優惠 | 直接驗證產品 | 業主原本就擔心使用率低，需設計好試用 |\n\n**建議**：先以「**設計夥伴＋推薦佣金**」起步，風險最低；等試點證明可行後，再談更深的合作。\n\n**需要先釐清**：\n\n1. 業主的人脈主要是**同業**（其他物業公司）還是**上下游**（建商、管委會、保全設備商）？同業之間可能不願互相推薦，或擔心資料放在同一系統。\n2. 業主願意投入多少時間？是介紹完就交給我們，還是會陪同拜訪？\n3. 品牌與公司主體：以誰的名義對外銷售、簽約、開發票？\n\n---\n\n## 9. 驗證計畫\n\n### 9.1 階段與通過條件\n\n```mermaid\nflowchart LR\n  A[階段0 準備<br/>約2週] --> B[階段1 訪談<br/>約3～4週]\n  B --> C{通過?}\n  C -- 否 --> X[調整定位<br/>或停止]\n  C -- 是 --> D[階段2 業主試用<br/>約4～6週]\n  D --> E{通過?}\n  E -- 否 --> X\n  E -- 是 --> F[階段3 付費試點<br/>約2～3個月]\n  F --> G{通過?}\n  G -- 是 --> H[正式開發與上市]\n  G -- 否 --> X\n```\n\n| 階段 | 做什麼 | 通過條件（建議） |\n|---|---|---|\n| **0. 準備** | 談定與業主的合作方式；製作極簡 LINE 版原型；準備訪談題綱 | 業主同意協助安排訪談與試用 |\n| **1. 訪談** | 訪談 5～10 家物業公司（老闆、督導為主，盡量也訪總幹事） | ① 過半受訪者把本平台核心痛點列為前三大困擾<br/>② 至少 3 家表示願意付費試點<br/>③ 價格假設落在可接受範圍 |\n| **2. 業主試用** | 業主公司 1～2 個社區、1～2 位總幹事，試用極簡 LINE 版 2～4 週 | ① 試用總幹事每週至少 4 天有操作<br/>② 第 4 週使用頻率不低於第 1 週<br/>③ 總幹事主觀評價「不麻煩」 |\n| **3. 付費試點** | 2～3 家付費客戶，正式使用基本版 | ① 試點結束後至少 2 家續約<br/>② 各社區每週活躍率 ≥ 70%<br/>③ 客服負擔在可承受範圍 |\n\n### 9.2 訪談題綱\n\n**A. 公司概況**\n1. 目前服務幾個社區？員工大約多少人？有幾位督導？\n2. 保全與物業是否為不同公司（法人）？\n3. 總幹事的平均年齡大約幾歲？有外籍員工嗎？\n\n**B. 現行作業與工具**\n4. 總公司怎麼知道各社區發生什麼事？（LINE 群組、電話、紙本、Excel、系統？）\n5. 合約到期、員工證照到期怎麼追蹤？有沒有漏過？\n6. 督導巡點、稽核怎麼記錄？缺失怎麼追蹤改善？\n7. 管委會月報、財報是誰做的？每個月花多少時間？\n8. 現在有在付費使用任何系統嗎？一個月花多少？\n\n**C. 痛點排序**\n9. 以下哪三項最困擾你？（合約／證照到期、人力缺口與排班、督導稽核、現場狀況回報、報修追蹤、管理費收繳、管委會月報、公司損益）\n10. 上次因為這些問題造成的損失或麻煩是什麼？\n\n**D. 導入顧慮**\n11. 如果導入系統，最擔心什麼？\n12. 總幹事用 LINE 的熟練程度？會用 LINE 拍照、傳檔案嗎？\n13. （展示雛型與 LINE 原型後）你覺得你們的總幹事用得來嗎？哪裡會卡住？\n\n**E. 價格與決策**\n14. 你會希望照社區數計價，還是照員工數計價？\n15. 以你們的規模，每月多少錢你會覺得「太便宜，懷疑品質」？多少「划算」？多少「貴但可以考慮」？多少「太貴不考慮」？\n16. 這種採購由誰決定？需要多久？\n\n### 9.3 業主試用的範圍（極簡版）\n\n只做最能展示價值、又最少操作的功能：\n\n| 端 | 功能 | 說明 |\n|---|---|---|\n| LINE 前台 | 交接日誌 | 選範本、補充文字或語音、送出；接班人一鍵確認 |\n| LINE 前台 | 報修 | 拍照 → 選類別 → 送出 |\n| LINE 前台 | 事件通報 | 拍照 → 選等級 → 送出，緊急事件即時通知督導 |\n| LINE 前台 | 公告 | 接收公司公告，一鍵已讀 |\n| 後台 | 社區、員工、證照 | 基本資料與到期提醒 |\n| 後台 | 儀表板 | 未結報修、未結事件、到期預警、**各社區使用率** |\n\n---\n\n## 10. 產品路線圖（驗證通過後）\n\n| 期間 | 里程碑 | 內容 |\n|---|---|---|\n| 第 1～3 個月 | 平台基礎＋基本版 MVP | 多租戶架構、訂閱與方案控管、LINE 前台、基本版功能、使用率儀表板 |\n| 第 4～6 個月 | 專業版 | 督導稽核、巡邏、設備保養、清潔檢核、廠商管理；線上訂閱與自動扣款 |\n| 第 7～12 個月 | 旗艦版 | 管理費收繳、社區財務與管委會月報、公司經營分析 |\n| 第 12 個月後 | 擴充 | 打卡（加購）、薪資系統匯出格式、虛擬帳號與線上繳費、管委會唯讀入口（評估中） |\n\n> 時程以 1～2 位開發人員估計，需依實際資源調整。若訪談顯示管理費或管委會月報是首要痛點，旗艦版功能可提前。\n\n---\n\n## 11. 風險與對策\n\n| 風險 | 可能性 | 影響 | 對策 |\n|---|---|---|---|\n| 總幹事仍然不用 | 中 | 高 | LINE 入口、極簡流程；使用率儀表板；先做業主試用驗證 |\n| 客戶要求大量客製化 | 高 | 高 | 以「設定」取代「改程式」；客製需求統一收集，評估是否納入產品；不接單一客戶的專屬開發 |\n| 業主人脈轉換率低 | 中 | 中 | 同步經營其他通路（產業公會、保全設備商、會計師事務所） |\n| 客服負擔過重 | 中 | 中 | 內建教學影片、常見問題；導入費涵蓋初期訓練；按方案提供不同客服等級 |\n| 個資外洩或跨租戶資料外洩 | 低 | 極高 | 租戶隔離自動化測試、加密、稽核日誌、定期資安檢測、資料處理附約 |\n| 大型業者或既有廠商跟進 | 中 | 中 | 專注中小型市場與「年長友善」定位，建立客戶口碑 |\n| 價格低於成本 | 中 | 高 | 試點期間記錄實際客服與主機成本，正式定價前重新試算 |\n\n---\n\n## 12. 需要決定的事\n\n| # | 事項 | 決定者 | 時間點 |\n|---|---|---|---|\n| D1 | 與業主的合作模式（推薦、經銷、合夥、設計夥伴） | 你＋業主 | 階段 0 |\n| D2 | 業主是否同意作為首家試用客戶 | 業主 | 階段 0 |\n| D3 | 對外銷售與簽約的公司主體、產品品牌名稱 | 你＋業主 | 階段 1 前 |\n| D4 | 開發資源：自行開發、組團隊或外包 | 你 | 階段 2 前 |\n| D5 | 初期資金來源與可承受的投入上限 | 你＋業主 | 階段 2 前 |\n| D6 | 正式定價與方案切分 | 你 | 階段 3 前（依訪談結果） |\n";

function setTheme(){
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark';
  try{localStorage.setItem('pcmp-theme', r.dataset.theme)}catch(e){}
}
try{const t=localStorage.getItem('pcmp-theme'); if(t) document.documentElement.dataset.theme=t;}catch(e){}

});

});
